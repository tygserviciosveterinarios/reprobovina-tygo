          onChange({ animales: animales.map((a) => (a.id === editandoId ? { ...a, ...datos } : a)) });
        } else {
          onChange({ animales: [...animales, { id: uid(), ...datos }] });
          playBeep("positivo");
        }
        limpiarCampos();
        setTimeout(() => { if (electronicaRef.current) electronicaRef.current.focus(); }, 0);
      };
      const onEnter = (e) => { if (e.key === "Enter") { e.preventDefault(); agregar(); } };
      const borrar = (id) => { onChange({ animales: animales.filter((a) => a.id !== id) }); if (editandoId === id) limpiarCampos(); };
      const editar = (a) => {
        setRp(a.rp || ""); setElectronica(a.electronica || ""); setToro(a.toro || ""); setNota(a.nota || "");
        setMatch((a.raza || a.cc || a.gdr) ? { raza: a.raza, cc: a.cc, gdr: a.gdr } : null);
        setEditandoId(a.id);
      };
      const q = busqueda.trim().toLowerCase();
      const filtrados = q
        ? animales.filter((a) => (a.rp || "").toLowerCase().includes(q) || (a.electronica || "").toLowerCase().includes(q))
        : animales;
      return (
        <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: 12, marginTop: 8, marginBottom: 4 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>
            Animales del lote (opcional) {animales.length > 0 && `· ${animales.length} cargados`}
          </div>
          {editandoId && (
            <div style={{ background: T.tealSoft, border: `1.5px solid ${T.teal}`, borderRadius: 8, padding: "8px 11px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 13.5, fontWeight: 700, color: T.teal }}>Editando animal — corregí y guardá</span>
              <button onClick={limpiarCampos} style={{ background: "none", border: "none", color: T.teal, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>Cancelar</button>
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: duplicado ? 4 : 8 }}>
            <div><label style={{ fontSize: 12.5, color: T.inkSoft }}>RP</label>
              <input value={rp} onChange={(e) => { setRp(e.target.value); setMatch(null); }} onBlur={buscarMatch} onKeyDown={onEnter} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${duplicado ? T.rust : T.line}`, fontSize: 16, background: "#fff" }} /></div>
            <div><label style={{ fontSize: 12.5, color: T.inkSoft }}>Caravana electrónica</label>
              <input ref={electronicaRef} value={electronica} onChange={(e) => { setElectronica(limpiarCodigo(e.target.value)); setMatch(null); }} onBlur={buscarMatch} onKeyDown={onEnter} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${duplicado ? T.rust : T.line}`, fontSize: 16, background: "#fff" }} /></div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
            <div><label style={{ fontSize: 12.5, color: T.inkSoft }}>Toro</label>
              {torosLote.length > 0 ? (
                <select value={toro} onChange={(e) => setToro(e.target.value)} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                  <option value="">-</option>
                  {torosLote.map((t) => <option key={t.id} value={t.nombre}>{t.nombre}</option>)}
                </select>
              ) : (
                <input value={toro} onChange={(e) => setToro(e.target.value)} onKeyDown={onEnter} placeholder="Cargá los toros del lote arriba" style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }} />
              )}</div>
            <div><label style={{ fontSize: 12.5, color: T.inkSoft }}>Nota / Observación</label>
              <input value={nota} onChange={(e) => setNota(e.target.value)} onKeyDown={onEnter} placeholder="Opcional" style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }} /></div>
          </div>
          {match && !duplicado && (
            <div style={{ background: T.tealSoft, border: `1.5px solid ${T.teal}`, borderRadius: 8, padding: "8px 10px", marginBottom: 8, fontSize: 13, color: T.teal }}>
              ✓ Encontrado en Preservicio: {match.raza ? normalizarRaza(match.raza) : "sin raza"}{match.cc ? ` · CC ${match.cc}` : ""}{match.gdr ? ` · GDR ${match.gdr}` : ""}
            </div>
          )}
          {(rpT || electronicaT) && !match && !duplicado && animalesPreservicio.length > 0 && !editandoId && (
            <div style={{ fontSize: 12.5, color: T.inkSoft, marginBottom: 8 }}>No se encontró ese animal en el Preservicio vinculado.</div>
          )}
          {duplicado && (
            <div style={{ background: "#E7C9B7", border: `1.5px solid ${T.rust}`, borderRadius: 8, padding: "8px 10px", marginBottom: 8, fontSize: 13, color: T.rust, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={15} /> Ese RP o caravana ya está cargado en este lote.
            </div>
          )}
          <button onClick={agregar} disabled={!!duplicado || (!rpT && !electronicaT)} style={{
            width: "100%", padding: "10px", borderRadius: 8, border: "none", cursor: (!!duplicado || (!rpT && !electronicaT)) ? "default" : "pointer",
            background: (!!duplicado || (!rpT && !electronicaT)) ? T.line : T.teal, color: (!!duplicado || (!rpT && !electronicaT)) ? T.inkSoft : "#fff",
            fontWeight: 700, fontSize: 15, marginBottom: 8,
          }}>{editandoId ? "Guardar cambios" : "+ Agregar animal (o Enter tras escanear)"}</button>
          {animales.length > 4 && (
            <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar por RP o caravana..."
              style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14, marginBottom: 8, background: "#fff" }} />
          )}
          {animales.length > 0 && (
            <div style={{ maxHeight: 180, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8 }}>
              {q && filtrados.length === 0 && (
                <div style={{ padding: "12px", fontSize: 13.5, color: T.inkSoft, textAlign: "center" }}>No hay ningún animal con ese RP o caravana.</div>
              )}
              {[...filtrados].reverse().map((a) => (
                <div key={a.id} onClick={() => editar(a)} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "8px 12px",
                  borderBottom: `1px solid ${T.line}`, fontSize: 14.5, cursor: "pointer",
                  background: editandoId === a.id ? T.tealSoft : "transparent",
                }}>
                  <span>
                    {a.rp || "s/n"}{a.electronica ? ` · ${a.electronica}` : ""}{a.raza ? ` · ${normalizarRaza(a.raza)}` : ""}{a.cc ? ` · CC ${a.cc}` : ""}{a.gdr ? ` · GDR ${a.gdr}` : ""}
                    {a.toro && <div style={{ fontSize: 13, color: T.teal, marginTop: 2 }}>🐂 {a.toro}</div>}
                    {a.nota && <div style={{ fontSize: 13, color: T.inkSoft, fontStyle: "italic", marginTop: 2 }}>📝 {a.nota}</div>}
                  </span>
                  <button onClick={(e) => { e.stopPropagation(); borrar(a.id); }} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={16} /></button>
                </div>
              ))}
            </div>
          )}
          {animales.length > 0 && parseFloat(lote.cantidad) !== animales.length && (
            <div style={{ marginTop: 8, fontSize: 13, color: T.teal, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span>Cargaste {animales.length}, la cantidad del lote dice {lote.cantidad || 0}.</span>
              <button onClick={() => onChange({ cantidad: String(animales.length) })} style={{ background: "none", border: "none", color: T.teal, fontWeight: 700, cursor: "pointer", textDecoration: "underline", fontSize: 13 }}>Usar {animales.length}</button>
            </div>
          )}
        </div>
      );
    }

    function IatfView({ cliente, informes, guardar, borrar, estadoSync, todosInformes = [], preservicios = [] }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const vacio = () => ({
        nombre: "", numero: "",
        fecha: new Date().toISOString().slice(0, 10),
        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",
        protocolos: [nuevoLote()],
        pajuelas: [nuevaPajuela()],
        preservicioInformeId: "",
        observacionesGen: "", conclusionPdf: "",
      });
      const [form, setForm] = useState(vacio());
      const [ultimoGuardado, setUltimoGuardado] = useState(null);
      const [viendoId, setViendoId] = useState(null);
      const [conclusionEdit, setConclusionEdit] = useState("");
      const [conclusionManual, setConclusionManual] = useState(false);

      const propios = informes.filter((i) => i.clienteId === cliente.id);
      const informeMostrado = informes.find((i) => i.id === viendoId) || null;
      const abrirNuevo = () => { const id = uid(); setEditando(id); setForm(vacio()); setVista("form"); setUltimoGuardado(null); };
      const abrirEditar = (inf) => { setEditando(inf.id); setForm({ pajuelas: [nuevaPajuela()], ...inf }); setVista("form"); setUltimoGuardado(null); };
      const abrirReporte = (inf) => { setViendoId(inf.id); setVista("reporte"); };
      const hayContenidoIatf = (f) => (f.protocolos || []).some((p) => p.cantidad || (p.animales || []).length > 0) || (f.pajuelas || []).some((p) => p.toro) || f.nombre;
      const guardarAvance = () => {
        if (!editando || !hayContenidoIatf(form)) return;
        guardar({ ...form, id: editando, clienteId: cliente.id });
        setUltimoGuardado(Date.now());
      };
      useEffect(() => {
        if (vista !== "form" || !editando || !hayContenidoIatf(form)) return;
        const t = setTimeout(() => { guardar({ ...form, id: editando, clienteId: cliente.id }); setUltimoGuardado(Date.now()); }, 2500);
        return () => clearTimeout(t);
      }, [form, editando, vista]);
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        const idFinal = editando || uid();
        guardar({ ...form, numero: numeroFinal, id: idFinal, clienteId: cliente.id });
        setViendoId(idFinal);
        setVista("reporte");
      };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) borrar(id); };
      useEffect(() => {
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual) return;
        setConclusionManual(!!infActual.conclusionManual);
        if (infActual.conclusionManual) {
          setConclusionEdit(infActual.conclusionPdf != null ? infActual.conclusionPdf : generarConclusionIatf(infActual));
        } else {
          setConclusionEdit(generarConclusionIatf(infActual));
        }
      }, [viendoId, informeMostrado]);
      useEffect(() => {
        if (vista !== "reporte" || !viendoId || !conclusionManual) return;
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual || (infActual.conclusionPdf === conclusionEdit && infActual.conclusionManual)) return;
        const t = setTimeout(() => guardar({ ...infActual, conclusionPdf: conclusionEdit, conclusionManual: true }), 900);
        return () => clearTimeout(t);
      }, [conclusionEdit, conclusionManual]);

      const actualizarPajuela = (id, patch) => setForm({ ...form, pajuelas: form.pajuelas.map((p) => p.id === id ? { ...p, ...patch } : p) });
      const agregarPajuela = () => setForm({ ...form, pajuelas: [...form.pajuelas, nuevaPajuela()] });
      const quitarPajuela = (id) => setForm({ ...form, pajuelas: form.pajuelas.filter((p) => p.id !== id) });

      const actualizarLote = (id, patch) => setForm({ ...form, protocolos: form.protocolos.map((p) => p.id === id ? { ...p, ...patch } : p) });
      const agregarLote = () => setForm({ ...form, protocolos: [...form.protocolos, nuevoLote()] });
      const quitarLote = (id) => setForm({ ...form, protocolos: form.protocolos.filter((p) => p.id !== id) });

      const statsLote = (p) => {
        const cant = parseFloat(p.cantidad) || 0;
        const noResp = parseFloat(p.noRespondieron) || 0;
        const perd = parseFloat(p.perdidasDispositivo) || 0;
        return { cant, respondieron: Math.max(0, cant - noResp), perd, pctResp: pct(cant - noResp, cant), pctPerd: pct(perd, cant) };
      };
      const totalesInforme = (inf) => (inf.protocolos || []).reduce((a, p) => a + (parseFloat(p.cantidad) || 0), 0);

      if (vista === "reporte" && informeMostrado) {
        const inf = informeMostrado;
        const lotes = (inf.protocolos || []).filter((p) => p.cantidad || p.nombre);
        let cantTotal = 0, perdTotal = 0, noRespTotal = 0;
        lotes.forEach((p) => { cantTotal += parseFloat(p.cantidad) || 0; perdTotal += parseFloat(p.perdidasDispositivo) || 0; noRespTotal += parseFloat(p.noRespondieron) || 0; });
        const respTotal = Math.max(0, cantTotal - noRespTotal);
        const pajuelas = (inf.pajuelas || []).filter((p) => p.toro);
        const pajNoAptas = pajuelas.filter((p) => p.resultado !== "Apto").length;
        return (
          <div>
            <div style={{ padding: "16px 16px 4px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <ChevronDown size={19} style={{ transform: "rotate(90deg)" }} /> Volver
              </button>
              <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <Pencil size={18} /> Editar
              </button>
            </div>
            <div style={{ padding: "0 16px 8px" }}>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 24, color: T.ink }}>{inf.nombre || "IATF"}</div>
              <div style={{ fontSize: 15, color: T.inkSoft }}>{inf.fecha}{inf.numero ? ` · N° ${inf.numero}` : ""}</div>
            </div>
            <Membrete width={210} />
            <div style={{ padding: "8px 16px 90px" }}>
              <div style={{ textAlign: "center", marginBottom: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", letterSpacing: 1 }}>Total inseminadas</div>
                <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 56, color: T.ink, lineHeight: 1.1 }}>{cantTotal}</div>
              </div>
              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "13px 15px", marginBottom: 20 }}>
                Cliente: <b>{cliente.nombre}</b>
                <div style={{ fontSize: 14, color: T.inkSoft, marginTop: 2 }}>{inf.establecimiento}</div>
                {(() => {
                  const vinc = getPreservicioVinculado(preservicios, inf.preservicioInformeId);
                  if (!vinc) return null;
                  const stVinc = statsPreservicio(vinc);
                  return (
                    <div style={{ fontSize: 13.5, color: T.teal, marginTop: 6, paddingTop: 6, borderTop: `1px solid ${T.line}` }}>
                      Vinculado a Preservicio: {(vinc.nombre || vinc.establecimiento)} · {vinc.fecha} · {stVinc.aptas}/{stVinc.revisadas} aptas ({pct(stVinc.aptas, stVinc.revisadas)}%)
                    </div>
                  );
                })()}
              </div>

              <div style={{ height: 26, borderRadius: 8, overflow: "hidden", display: "flex", marginBottom: 12, boxShadow: "inset 0 0 0 1px rgba(28,43,34,0.08)" }}>
                {respTotal > 0 && <div style={{ width: `${pct(respTotal, cantTotal)}%`, backgroundImage: "linear-gradient(180deg,#2E8484,#1F6B6B)" }} />}
                {perdTotal > 0 && <div style={{ width: `${pct(perdTotal, cantTotal)}%`, backgroundImage: "linear-gradient(180deg,#C4602E,#A6491F)" }} />}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 20 }}>
                <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "Fraunces, serif", fontWeight: 800, fontSize: 17, color: T.ink, lineHeight: 1, marginTop: 8 }}>{respTotal}</div>
                  <div style={{ fontSize: 10.5, color: T.inkSoft, marginTop: 2 }}>Respondieron · {pct(respTotal, cantTotal)}%</div>
                </div>
                <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "Fraunces, serif", fontWeight: 800, fontSize: 17, color: T.ink, lineHeight: 1, marginTop: 8 }}>{perdTotal}</div>
                  <div style={{ fontSize: 10.5, color: T.inkSoft, marginTop: 2 }}>Pérd. dispositivo · {pct(perdTotal, cantTotal)}%</div>
                </div>
                <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "Fraunces, serif", fontWeight: 800, fontSize: 17, color: T.ink, lineHeight: 1, marginTop: 8 }}>{cantTotal}</div>
                  <div style={{ fontSize: 10.5, color: T.inkSoft, marginTop: 2 }}>Total</div>
                </div>
              </div>

              {lotes.length > 0 && (
                <React.Fragment>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>% de respuesta por lote</div>
                  <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20 }}>
                    {lotes.map((p, i) => {
                      const cant = parseFloat(p.cantidad) || 0;
                      const noResp = parseFloat(p.noRespondieron) || 0;
                      const resp = Math.max(0, cant - noResp);
                      return (
                        <div key={p.id || i} style={{ marginBottom: i < lotes.length - 1 ? 10 : 0 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4 }}>
                            <span>{p.nombre || `Lote ${i + 1}`}</span><span style={{ fontWeight: 700 }}>{resp}/{cant} · {pct(resp, cant)}%</span>
                          </div>
                          <div style={{ background: T.line, borderRadius: 4, height: 6 }}>
                            <div style={{ background: T.teal, borderRadius: 4, height: 6, width: `${pct(resp, cant)}%` }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}

              {pajuelas.length > 0 && (
                <React.Fragment>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Calidad seminal (pajuelas)</div>
                  <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "13px 15px", marginBottom: 20, fontSize: 14.5 }}>
                    {pajNoAptas === 0 ? (
                      <span>{pajuelas.length} pajuela{pajuelas.length !== 1 ? "s" : ""} controlada{pajuelas.length !== 1 ? "s" : ""}, todas aptas.</span>
                    ) : (
                      <span><b style={{ color: T.rust }}>{pajNoAptas}</b> de {pajuelas.length} pajuela{pajuelas.length !== 1 ? "s" : ""} no cumplieron los parámetros esperados.</span>
                    )}
                  </div>
                </React.Fragment>
              )}

              {inf.observacionesGen && (
                <React.Fragment>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Observaciones</div>
                  <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20, fontSize: 14.5, color: T.ink }}>
                    {inf.observacionesGen}
                  </div>
                </React.Fragment>
              )}

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Conclusión (para el PDF del productor — editable)</div>
                {conclusionManual && (
                  <button onClick={() => { setConclusionEdit(generarConclusionIatf(inf)); setConclusionManual(false); guardar({ ...inf, conclusionManual: false }); }}
                    style={{ background: "none", border: "none", color: T.teal, fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>↺ Volver a automática</button>
                )}
              </div>
              <textarea value={conclusionEdit} onChange={(e) => { setConclusionEdit(e.target.value); setConclusionManual(true); }}
                style={{ width: "100%", minWidth: 0, background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20, fontSize: 14.5, color: T.ink, minHeight: 110 }} />

              <div style={{ display: "grid", gridTemplateColumns: "auto auto 1fr auto", gap: 8 }}>
                <button onClick={() => generarPDFIatf({ ...inf, conclusionPdf: conclusionEdit }, cliente)} style={{ background: T.rust, color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                  <Download size={18} /> PDF
                </button>
                <button onClick={() => exportarExcelIatf(inf, cliente)} style={{ background: T.teal, color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                  <Download size={18} /> Excel
                </button>
                <button onClick={() => abrirEditar(inf)} style={{ background: "#fff", color: T.ink, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer" }}>Editar informe</button>
                <button onClick={() => eliminar(inf.id)} style={{ background: T.rust, color: "#fff", border: "none", borderRadius: 10, padding: "13px", cursor: "pointer" }}><Trash2 size={20} /></button>
              </div>
            </div>
          </div>
        );
      }

      if (vista === "form") {
        return (
          <div style={{ padding: "16px 16px 90px" }}>
            <button onClick={() => { if (window.confirm("¿Volver sin guardar los cambios de este informe?")) setVista("lista"); }} style={{ background: "none", border: "none", color: T.teal, marginBottom: 6, cursor: "pointer", fontWeight: 700, fontSize: 17, padding: "12px 10px 12px 0", minHeight: 44 }}>&larr; Volver</button>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10 }}>
                <div>

    const MOTIVOS_DESCARTE = ["Atrofia testicular", "Parálisis", "Edad", "Locomotor", "Prepucio", "Enfermedad venérea", "Otro"];
    function claseCE(ce) {
      const v = parseFloat(ce);
      if (!v) return null;
      if (v >= 35) return { label: "Apto", color: T.gold, bg: T.goldSoft };
      if (v >= 34) return { label: "Observable", color: T.teal, bg: T.tealSoft };
      return { label: "Descartable", color: T.rust, bg: "#E7C9B7" };
    }
    const EDADES_TORO = ["2D", "4D", "6D", "Boca llena", "1/2 D", "US", "DESCARTE"];
    function normalizarEdad(valor) {
      const v = String(valor || "").trim();
      if (!v) return "";
      const upper = v.toUpperCase().replace(/\./g, "").replace(/\s+/g, " ").trim();
      const equivalencias = {
        "BLL": "Boca llena", "B LL": "Boca llena", "BOCA LLENA": "Boca llena", "BL": "Boca llena",
        "2D": "2D", "4D": "4D", "6D": "6D",
        "1/2D": "1/2 D", "1/2 D": "1/2 D", "MEDIO DIENTE": "1/2 D", "1 2 D": "1/2 D",
        "US": "US", "DESCARTE": "DESCARTE",
      };
      if (equivalencias[upper]) return equivalencias[upper];
      // Si ya viene con el valor exacto tal cual lo usa el desplegable, lo dejamos como está
      if (EDADES_TORO.includes(v)) return v;
      return v;
    }

    function nuevoToro() {
      return {
        id: uid(), tubo: "", rp: "", electronica: "", raza: "", origen: "", rodeo: "", edad: "",
        ce: "", tono: "", cc: "", estado: "apto", motivoDescarte: "", observaciones: "",
        miembroAnt: "Ok", miembroAntDetalle: "", miembroPost: "Ok", miembroPostDetalle: "",
        prepucio: "Ok", prepucioDetalle: "",
        campylobacter: "", tricomonas: "", brucelosis: "",
      };
    }

    function buscarEnBase(torosBase, clienteId, rp, electronica, establecimiento) {
      if (!rp && !electronica) return null;
      const rpL = limpiarCodigo(rp), elL = limpiarCodigo(electronica);
      return torosBase.find((b) => b.clienteId === clienteId && (!establecimiento || b.establecimiento === establecimiento) && ((rpL && limpiarCodigo(b.rp) === rpL) || (elL && limpiarCodigo(b.electronica) === elL))) || null;
    }

    function TarjetaToro({ t, idx, expandido, onExpandir, onActualizar, onQuitar, sePuedeQuitar, torosBase, clienteId, establecimiento, tubosRepetidos, rpsRepetidos, electronicasRepetidas }) {
      const est = ESTADOS_TORO.find((e) => e.v === t.estado);
      const [venereasAbiertoToro, setVenereasAbiertoToro] = useState(false);
      const baseCliente = torosBase.filter((b) => b.clienteId === clienteId && b.establecimiento === establecimiento);
      const match = buscarEnBase(baseCliente, clienteId, t.rp, t.electronica, establecimiento);
      const esNuevo = !match && baseCliente.length > 0 && (t.rp || t.electronica);

      const aplicarMatch = (m) => {
        if (!m) return;
        onActualizar({
          rp: m.rp || t.rp, electronica: m.electronica || t.electronica,
          raza: m.raza || t.raza, origen: m.origen || t.origen, rodeo: m.rodeo || t.rodeo, edad: m.edad || t.edad,
          ce: m.ce || t.ce, tono: m.tono || t.tono, cc: m.cc || t.cc,
          estado: m.estado || t.estado, motivoDescarte: m.motivoDescarte || t.motivoDescarte,
          observaciones: m.observaciones || t.observaciones,
          miembroAnt: m.miembroAnt || t.miembroAnt, miembroAntDetalle: m.miembroAntDetalle || t.miembroAntDetalle,
          miembroPost: m.miembroPost || t.miembroPost, miembroPostDetalle: m.miembroPostDetalle || t.miembroPostDetalle,
          prepucio: m.prepucio || t.prepucio, prepucioDetalle: m.prepucioDetalle || t.prepucioDetalle,
        });
        if (m.estado === "descarte") playBeep("negativo");
      };
      /* Si se borraron RP y electrónica, limpiamos los datos que se habían traído de la base
         para no dejar pegados por error datos de otro toro */
      const limpiarSiVacio = () => {
        if (!t.rp && !t.electronica) {
          onActualizar({
            raza: "", origen: "", rodeo: "", edad: "", ce: "", tono: "", cc: "", estado: "apto", motivoDescarte: "", observaciones: "",
            miembroAnt: "Ok", miembroAntDetalle: "", miembroPost: "Ok", miembroPostDetalle: "", prepucio: "Ok", prepucioDetalle: "",
          });
        }
      };

      if (!expandido) {
        return (
          <div onClick={onExpandir} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 700, color: T.ink }}>#{t.orden || idx + 1} · RP {t.rp || "-"}{t.tubo ? ` · Tubo N° ${t.tubo}` : ""}</div>
              <div style={{ fontSize: 14, color: T.inkSoft }}>{t.raza}{t.rodeo ? ` · ${t.rodeo}` : ""}{t.ce ? ` · CE ${t.ce} cm${claseCE(t.ce) ? ` (${claseCE(t.ce).label})` : ""}` : ""}</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {t.tubo && tubosRepetidos.has(t.tubo) && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>Tubo repetido</span>}
              {t.rp && rpsRepetidos.has(t.rp) && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>RP repetido</span>}
              {t.electronica && electronicasRepetidas.has(t.electronica) && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>Electrónica repetida</span>}
              {t.campylobacter === "positivo" && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>+ Campylobacter</span>}
              {t.tricomonas === "positivo" && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>+ Tricomonas</span>}
              {t.brucelosis === "positivo" && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>+ Brucelosis</span>}
              {esNuevo && <span style={{ background: "#E7C9B7", color: T.rust, fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>Nuevo</span>}
              {est && <span style={{ background: est.bg, color: est.color, fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>{est.label}</span>}
              <ChevronDown size={21} style={{ color: T.inkSoft }} />
            </div>
          </div>
        );
      }
      return (
        <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 8 }}>
          <div onClick={onExpandir} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, cursor: "pointer" }}>
            <div style={{ fontWeight: 700, color: T.ink }}>Toro N° {t.orden || idx + 1}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {sePuedeQuitar && <button onClick={(e) => { e.stopPropagation(); onQuitar(); }} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={19} /></button>}
              <ChevronUp size={21} style={{ color: T.inkSoft }} />
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
            <div><label style={{ fontSize: 13, color: T.inkSoft }}>N° Tubo</label>
              <input value={t.tubo} onChange={(e) => onActualizar({ tubo: e.target.value })}
                style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, fontSize: 16.5, background: "#fff",
                  border: `1.5px solid ${t.tubo && tubosRepetidos.has(t.tubo) ? T.rust : T.line}`,
                  color: t.tubo && tubosRepetidos.has(t.tubo) ? T.rust : T.ink, fontWeight: t.tubo && tubosRepetidos.has(t.tubo) ? 700 : 400,
                }} /></div>
            <div><label style={{ fontSize: 13.5, color: T.teal, fontWeight: 800 }}>RP</label>
              <input value={t.rp} onChange={(e) => onActualizar({ rp: e.target.value })}
                onBlur={() => { aplicarMatch(buscarEnBase(baseCliente, clienteId, t.rp, "", establecimiento)); limpiarSiVacio(); }}
                style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, fontSize: 17.5, fontWeight: 700,
                  background: t.rp && rpsRepetidos.has(t.rp) ? "#fff" : T.tealSoft,
                  border: `2px solid ${t.rp && rpsRepetidos.has(t.rp) ? T.rust : T.teal}`,
                  color: t.rp && rpsRepetidos.has(t.rp) ? T.rust : T.ink,
                }} />
              {t.rp && rpsRepetidos.has(t.rp) && <div style={{ fontSize: 12.5, color: T.rust, fontWeight: 700, marginTop: 3 }}>⚠ Este RP ya está cargado en otro toro de este informe</div>}
            </div>
          </div>
          <div style={{ marginBottom: 8 }}><label style={{ fontSize: 13, color: T.inkSoft }}>Electrónica (caravana)</label>
            <input value={t.electronica} onChange={(e) => onActualizar({ electronica: limpiarCodigo(e.target.value) })}
              onBlur={() => { aplicarMatch(buscarEnBase(baseCliente, clienteId, "", t.electronica, establecimiento)); limpiarSiVacio(); }}
              style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, fontSize: 16.5, background: "#fff",
                border: `1.5px solid ${t.electronica && electronicasRepetidas.has(t.electronica) ? T.rust : T.line}`,
                color: t.electronica && electronicasRepetidas.has(t.electronica) ? T.rust : T.ink, fontWeight: t.electronica && electronicasRepetidas.has(t.electronica) ? 700 : 400,
              }} />
            {t.electronica && electronicasRepetidas.has(t.electronica) && <div style={{ fontSize: 12.5, color: T.rust, fontWeight: 700, marginTop: 3 }}>⚠ Esta electrónica ya está cargada en otro toro de este informe</div>}
          </div>

          {match && match.updatedAt && (
            <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 8 }}>
              Última vez que se trabajó este toro: <b>{new Date(match.updatedAt).toLocaleDateString("es-AR")}</b>
            </div>
          )}
          {match && match.estado === "descarte" && (
            <div style={{
              background: T.rust, borderRadius: 10, padding: "15px 17px", marginBottom: 10,
              display: "flex", alignItems: "flex-start", gap: 10, border: `2px solid ${T.ink}`,
            }}>
              <AlertTriangle size={25} style={{ color: "#fff", flexShrink: 0, marginTop: 1 }} />
              <div>
                <div style={{ color: "#fff", fontWeight: 800, fontSize: 16.5 }}>⚠ TORO DESCARTADO EN LA BASE</div>
                <div style={{ color: "#fff", fontSize: 14.5, marginTop: 3 }}>
                  {match.motivoDescarte ? `Motivo: ${match.motivoDescarte}` : ""}{match.observaciones ? ` · ${match.observaciones}` : ""}
                </div>
                <div style={{ color: "#fff", fontSize: 14, marginTop: 4, fontWeight: 600 }}>Confirmá si sigue en descarte o si cambió su condición.</div>
              </div>
            </div>
          )}
          {match && match.estado === "tratamiento" && (() => {
            const puntos = [];
            if (match.miembroAnt === "*") puntos.push(`Miembro anterior${match.miembroAntDetalle ? `: ${match.miembroAntDetalle}` : ""}`);
            if (match.miembroPost === "*") puntos.push(`Miembro posterior${match.miembroPostDetalle ? `: ${match.miembroPostDetalle}` : ""}`);
            if (match.prepucio === "*") puntos.push(`Prepucio${match.prepucioDetalle ? `: ${match.prepucioDetalle}` : ""}`);
            return (
              <div style={{
                background: T.teal, borderRadius: 10, padding: "15px 17px", marginBottom: 10,
                display: "flex", alignItems: "flex-start", gap: 10, border: `2px solid ${T.ink}`,
              }}>
                <AlertTriangle size={25} style={{ color: "#fff", flexShrink: 0, marginTop: 1 }} />
                <div>
                  <div style={{ color: "#fff", fontWeight: 800, fontSize: 16.5 }}>⚠ TORO A TRATAMIENTO EN LA BASE</div>
                  {puntos.length > 0 && (
                    <ul style={{ color: "#fff", fontSize: 14.5, marginTop: 4, marginBottom: 0, paddingLeft: 18 }}>
                      {puntos.map((p, i) => <li key={i}>{p}</li>)}
                    </ul>
                  )}
                  {match.observaciones && (
                    <div style={{ color: "#fff", fontSize: 14.5, marginTop: 3 }}>{match.observaciones}</div>
                  )}
                  <div style={{ color: "#fff", fontSize: 14, marginTop: 4, fontWeight: 600 }}>Confirmá si sigue a tratamiento o si cambió su condición.</div>
                </div>
              </div>
            );
          })()}
          {match && match.estado !== "descarte" && match.estado !== "tratamiento" && (
            <div style={{ background: T.goldSoft, borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, color: T.gold }}>
              Encontrado en la base — datos completados solos, revisá y actualizá lo que cambió.
            </div>
          )}
          {esNuevo && (
            <div style={{ background: "#E7C9B7", color: T.rust, borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700 }}>
              Toro nuevo: no está en la base cargada para este cliente.
            </div>
          )}
          {t.tubo && tubosRepetidos.has(t.tubo) && (
            <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={16} /> Tubo {t.tubo} repetido en este informe — revisá los toros
            </div>
          )}
          {t.rp && rpsRepetidos.has(t.rp) && (
            <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={16} /> RP {t.rp} repetido en este informe — revisá los toros
            </div>
          )}
          {t.electronica && electronicasRepetidas.has(t.electronica) && (
            <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={16} /> Electrónica {t.electronica} repetida en este informe — revisá los toros
            </div>
          )}

          <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Datos físicos</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Raza</label>
                <select value={normalizarRaza(t.raza)} onChange={(e) => onActualizar({ raza: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="">-</option>
                  {RAZAS_TORO.map((r) => <option key={r} value={r}>{r}</option>)}
                  {t.raza && !RAZAS_TORO.includes(normalizarRaza(t.raza)) && <option value={t.raza}>{t.raza}</option>}
                </select></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Origen</label>
                <input value={t.origen} onChange={(e) => onActualizar({ origen: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Edad</label>
                <select value={normalizarEdad(t.edad)} onChange={(e) => onActualizar({ edad: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="">-</option>
                  {EDADES_TORO.map((e) => <option key={e} value={e}>{e}</option>)}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Rodeo (en servicio)</label>
                <input value={t.rodeo} onChange={(e) => onActualizar({ rodeo: e.target.value })} placeholder="Ej: Rodeo 1" style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: claseCE(t.ce) ? 4 : 0 }}>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>C.E. (cm)</label>
                <input value={t.ce} onChange={(e) => onActualizar({ ce: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Tono</label>
                <input value={t.tono} onChange={(e) => onActualizar({ tono: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>C.C.</label>
                <input value={t.cc} onChange={(e) => onActualizar({ cc: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
            </div>
            {claseCE(t.ce) && (
              <span style={{ background: claseCE(t.ce).bg, color: claseCE(t.ce).color, fontSize: 13, fontWeight: 700, padding: "4px 10px", borderRadius: 20 }}>
                C.E. {claseCE(t.ce).label}
              </span>
            )}
          </div>

          <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Examen físico</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Miembro anterior</label>
                <select value={t.miembroAnt} onChange={(e) => onActualizar({ miembroAnt: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="Ok">Ok</option>
                  <option value="*">*</option>
                </select>
                {t.miembroAnt === "*" && (
                  <input value={t.miembroAntDetalle} onChange={(e) => onActualizar({ miembroAntDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
                )}
              </div>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Miembro posterior</label>
                <select value={t.miembroPost} onChange={(e) => onActualizar({ miembroPost: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="Ok">Ok</option>
                  <option value="*">*</option>
                </select>
                {t.miembroPost === "*" && (
                  <input value={t.miembroPostDetalle} onChange={(e) => onActualizar({ miembroPostDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
                )}
              </div>
            </div>
            <div>
              <label style={{ fontSize: 13, color: T.inkSoft }}>Prepucio</label>
              <select value={t.prepucio} onChange={(e) => onActualizar({ prepucio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                <option value="Ok">Ok</option>
                <option value="*">*</option>
              </select>
              {t.prepucio === "*" && (
                <input value={t.prepucioDetalle} onChange={(e) => onActualizar({ prepucioDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
              )}
            </div>
          </div>

          <div style={{ background: T.paper, borderRadius: 12, marginBottom: 12, overflow: "hidden" }}>
            <button onClick={() => setVenereasAbiertoToro(!venereasAbiertoToro)} style={{
              width: "100%", minWidth: 0, background: "none", border: "none", cursor: "pointer",
              padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", display: "flex", alignItems: "center", gap: 6 }}>
                Enfermedades venéreas
                {(t.campylobacter === "positivo" || t.tricomonas === "positivo" || t.brucelosis === "positivo") && (
                  <span style={{ background: T.rust, color: "#fff", fontSize: 11, fontWeight: 700, padding: "2px 7px", borderRadius: 20 }}>⚠</span>
                )}
              </span>
              {venereasAbiertoToro ? <ChevronUp size={17} style={{ color: T.inkSoft }} /> : <ChevronDown size={17} style={{ color: T.inkSoft }} />}
            </button>
            {venereasAbiertoToro && (
              <div style={{ padding: "0 14px 14px" }}>
                {[["campylobacter", "Campylobacter"], ["tricomonas", "Tricomonas"], ["brucelosis", "Brucelosis"]].map(([campo, label]) => (
                  <div key={campo} style={{ marginBottom: 8 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>{label}</label>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 6 }}>
                      <button onClick={() => onActualizar({ [campo]: "negativo" })} style={{
                        padding: "9px 6px", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer",
                        border: `1.5px solid ${t[campo] === "negativo" ? T.teal : T.line}`, background: t[campo] === "negativo" ? T.tealSoft : "#fff", color: t[campo] === "negativo" ? T.teal : T.inkSoft,
                      }}>Negativo</button>
                      <button onClick={() => onActualizar({ [campo]: "positivo", estado: "descarte", motivoDescarte: "Enfermedad venérea" })} style={{
                        padding: "9px 6px", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer",
                        border: `1.5px solid ${t[campo] === "positivo" ? T.rust : T.line}`, background: t[campo] === "positivo" ? "#E7C9B7" : "#fff", color: t[campo] === "positivo" ? T.rust : T.inkSoft,
                      }}>Positivo</button>
                    </div>
                    {t[campo] === "positivo" && (
                      <div style={{ fontSize: 12, color: T.rust, marginTop: 3 }}>⚠ Pasó a Descarte automáticamente por este resultado.</div>
                    )}

    function AndrologicoView({ cliente, informes, guardar, borrar, estadoSync, torosBase, guardarBase, borrarBase, borrarBaseVarios, todosInformes = [] }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const [viendoId, setViendoId] = useState(null);
      const vacio = () => ({
        nombre: "", numero: "",

        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",

      const [form, setForm] = useState(vacio());
      const [expandidoId, setExpandidoId] = useState(null);
      const [ultimoGuardado, setUltimoGuardado] = useState(null);
      const [buscarToro, setBuscarToro] = useState("");
      const [buscarGlobal, setBuscarGlobal] = useState("");
      const [establecimientoAbierto, setEstablecimientoAbierto] = useState(null);
      const [venereasAbierto, setVenereasAbierto] = useState(false);
      const [conclusionEdit, setConclusionEdit] = useState("");
      const [conclusionManual, setConclusionManual] = useState(false);
      useEffect(() => {
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual) return;
        setConclusionManual(!!infActual.conclusionManual);
        if (infActual.conclusionManual) {
          setConclusionEdit(infActual.conclusionPdf != null ? infActual.conclusionPdf : generarConclusionAndrologico(infActual));
        } else {
          setConclusionEdit(generarConclusionAndrologico(infActual));
        }
      }, [viendoId, informes]);
      useEffect(() => {
        if (vista !== "reporte" || !viendoId || !conclusionManual) return;
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual || (infActual.conclusionPdf === conclusionEdit && infActual.conclusionManual)) return;
        const t = setTimeout(() => guardar({ ...infActual, conclusionPdf: conclusionEdit, conclusionManual: true }), 900);
        return () => clearTimeout(t);
      }, [conclusionEdit, conclusionManual]);
      const [venereasReporte, setVenereasReporte] = useState({ fechaCampyTrico: "", protocoloCampyTrico: "", fechaBrucelosis: "", protocoloBrucelosis: "" });
      const [buscarToroVenereas, setBuscarToroVenereas] = useState("");

      const [excepTricoForm, setExcepTricoForm] = useState("");

      const [excepTricoRep, setExcepTricoRep] = useState("");
      const [excepBrRep, setExcepBrRep] = useState("");
      useEffect(() => {
        const inf = informes.find((i) => i.id === viendoId);
        if (inf) setVenereasReporte({
          fechaCampyTrico: inf.fechaCampyTrico || "", protocoloCampyTrico: inf.protocoloCampyTrico || "",
          fechaBrucelosis: inf.fechaBrucelosis || "", protocoloBrucelosis: inf.protocoloBrucelosis || "",
        });
        setBuscarToroVenereas("");
      }, [viendoId]);
      useEffect(() => {
        if (vista !== "reporte" || !viendoId) return;

        if (!inf) return;
        const cambio = inf.fechaCampyTrico !== venereasReporte.fechaCampyTrico || inf.protocoloCampyTrico !== venereasReporte.protocoloCampyTrico
          || inf.fechaBrucelosis !== venereasReporte.fechaBrucelosis || inf.protocoloBrucelosis !== venereasReporte.protocoloBrucelosis;
        if (!cambio) return;
        const t = setTimeout(() => { guardar({ ...inf, ...venereasReporte }); }, 900);
        return () => clearTimeout(t);
      }, [venereasReporte]);
      const venereasPositivosForm = form.toros.filter((t) => t.campylobacter === "positivo" || t.tricomonas === "positivo" || t.brucelosis === "positivo");

      const propios = informes.filter((i) => i.clienteId === cliente.id);
      const contarRepetidos = (campo, ignorar = []) => {
        const conteo = {};
        form.toros.forEach((t) => {
          const v = t[campo];
          if (v && !ignorar.includes(v.trim().toLowerCase())) conteo[v] = (conteo[v] || 0) + 1;
        });
        return new Set(Object.keys(conteo).filter((k) => conteo[k] > 1));
      };
      const VALORES_TUBO_SIN_DATO = ["sin raspaje", "s/raspaje", "sin dato", "s/n", "s/d", "-"];
      const tubosRepetidos = contarRepetidos("tubo", VALORES_TUBO_SIN_DATO);
      const rpsRepetidos = contarRepetidos("rp");
      const electronicasRepetidas = contarRepetidos("electronica");
      const abrirNuevo = () => {
        const v = vacio(); const id = uid();
        v.numero = proximoNumero(todosInformes, v.fecha);
        setEditando(id); setForm(v); setExpandidoId(v.toros[0].id); setVista("form"); setUltimoGuardado(null); setVenereasAbierto(false);
      };
      const abrirEditar = (inf) => {
        setEditando(inf.id);
        const toros = (inf.toros || []).map((t, i) => t.orden ? t : { ...t, orden: i + 1 });

        setExpandidoId(null); setVista("form"); setUltimoGuardado(null); setVenereasAbierto(false);
      };

      const hayContenido = (f) => (f.toros || []).some((t) => t.rp || t.electronica || t.tubo || t.ce) || f.nombre;

      const guardarAvance = () => {
        if (!editando || !hayContenido(form)) return;
        guardar({ ...form, id: editando, clienteId: cliente.id });
        setUltimoGuardado(Date.now());
      };

      // Guardado automático: cada vez que cambia el formulario, guarda solo (sin salir a la pantalla de resumen)
      useEffect(() => {
        if (vista !== "form" || !editando || !hayContenido(form)) return;
        const t = setTimeout(() => { guardar({ ...form, id: editando, clienteId: cliente.id }); setUltimoGuardado(Date.now()); }, 2500);
        return () => clearTimeout(t);
      }, [form, editando, vista]);

      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        const idFinal = editando || uid();
        guardar({ ...form, numero: numeroFinal, id: idFinal, clienteId: cliente.id });
        form.toros.forEach((t) => {
          if (!t.rp && !t.electronica) return;
          const baseCliente = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === form.establecimiento);
          const existente = buscarEnBase(baseCliente, cliente.id, t.rp, t.electronica, form.establecimiento);
          guardarBase({
            id: existente ? existente.id : undefined, clienteId: cliente.id, establecimiento: form.establecimiento,
            rp: t.rp, electronica: t.electronica, raza: t.raza, origen: t.origen, rodeo: t.rodeo, edad: t.edad,
            ce: t.ce, tono: t.tono, cc: t.cc, estado: t.estado, motivoDescarte: t.motivoDescarte, observaciones: t.observaciones,

        setViendoId(idFinal);
        setVista("reporte");

      const abrirReporte = (inf) => { setViendoId(inf.id); setVista("reporte"); };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) { borrar(id); setVista("lista"); } };

      const fileRef = useRef(null);
      const [msgImport, setMsgImport] = useState("");
      const [estabImportLista, setEstabImportLista] = useState((cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "");
      const handleImportar = async (e, estab) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        setMsgImport("Leyendo archivo...");
        try {
          const { toros: filas, headersOriginales, ceEncontrada } = await parseExcelToros(file);
          if (!filas.length) { setMsgImport("Se leyó el archivo pero no se encontraron filas con RP o electrónica."); return; }

          // Partimos de lo que ya había en la base de este establecimiento, y lo vamos actualizando
          // EN MEMORIA a medida que procesamos cada fila del Excel. Así detectamos también los
          // RP/electrónica repetidos dentro del mismo archivo (antes solo se comparaba contra lo
          // que ya estaba guardado, por eso quedaban duplicados si el Excel traía la misma fila 2 veces).
          let baseEnMemoria = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === estab);
          const idsTocados = new Set();
          let repetidosEnArchivo = 0;
          for (const t of filas) {
            const existente = buscarEnBase(baseEnMemoria, cliente.id, t.rp, t.electronica, estab);
            const registro = { id: existente ? existente.id : uid(), clienteId: cliente.id, establecimiento: estab, ...t };
            if (existente) {
              if (idsTocados.has(existente.id)) repetidosEnArchivo++;
              baseEnMemoria = baseEnMemoria.map((b) => (b.id === existente.id ? registro : b));
            } else {
              baseEnMemoria = [...baseEnMemoria, registro];
            }
            idsTocados.add(registro.id);
            guardarBase(registro);
          }
          let msg = `${filas.length} filas leídas → ${idsTocados.size} toros guardados en la base de ${estab || "este establecimiento"}.`;
          if (repetidosEnArchivo > 0) msg += ` (${repetidosEnArchivo} filas tenían el mismo RP/electrónica que otra fila del mismo Excel y se unificaron en un solo toro).`;
          if (!ceEncontrada) msg += ` ⚠ No encontré la columna de C.E. Columnas detectadas: ${headersOriginales.join(" | ")}`;
          setMsgImport(msg);
        } catch (err) {
          setMsgImport("No se pudo leer el archivo: " + (err.message || "error desconocido"));
        }
      };

      const vaciarBase = async (estab) => {
        const registros = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === estab);
        if (registros.length === 0) return;
        if (!window.confirm(`Esto va a borrar los ${registros.length} toros de la base de "${estab}" (quedan en la papelera 30 días por si hace falta recuperarlos). No afecta a los informes ya guardados. ¿Continuar?`)) return;
        setMsgImport("Vaciando...");

      const actualizarToro = (id, patch) => setForm({ ...form, toros: form.toros.map((t) => t.id === id ? { ...t, ...patch } : t) });
      const agregarToro = () => {
        const maxOrden = form.toros.reduce((max, t) => Math.max(max, t.orden || 0), 0);

      const resumen = (inf) => {
        const toros = inf.toros || [];
        const aptos = toros.filter((t) => t.estado === "apto").length;
        return `${aptos}/${toros.length} aptos`;
      };

      const informeMostrado = informes.find((i) => i.id === viendoId) || null;

      if (vista === "reporte" && informeMostrado) {
        const inf = informeMostrado;
        const toros = inf.toros || [];
        const total = toros.length;
        const aptos = toros.filter((t) => t.estado === "apto").length;

        const contarPor = (campo) => {

            if (campo === "raza" && v !== `Sin raza`) v = normalizarRaza(v);
            conteo[v] = (conteo[v] || 0) + 1;
          });
          return Object.entries(conteo).sort((a, b) => b[1] - a[1]);
        };
        const porRaza = contarPor("raza");
        const porOrigen = contarPor("origen");
        const porMotivo = (() => {

      const fileRef = useRef(null);

      const handleExportar = async () => {
        setOcupado(true);
        try {
          await exportarBackupCompleto();
          setMsg("Copia de seguridad descargada.");
        } catch (err) {
          setMsg("No se pudo exportar: " + (err.message || "error desconocido"));
        }
        setOcupado(false);
      };
      const handleImportar = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (!window.confirm("Esto va a sumar/actualizar datos en este dispositivo desde el archivo elegido. ¿Continuar?")) return;
        setOcupado(true);
        try {
          const total = await importarBackupDesdeArchivo(file);
          setMsg(`${total} registros importados. Recargando...`);

    function anioDeInforme(inf) {
      if (inf.fecha) return inf.fecha.slice(0, 4);
      return "s/f";
    }
    function MiniStat({ label, value, tone }) {
      const bg = tone === "gold" ? T.goldSoft : tone === "teal" ? T.tealSoft : "#E7C9B7";
      const fg = tone === "gold" ? T.gold : tone === "teal" ? T.teal : T.rust;
      return (
        <div style={{ background: bg, borderRadius: 12, padding: "10px 6px", textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: fg, textTransform: "uppercase" }}>{label}</div>
          <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 20, color: fg }}>{value}</div>
        </div>
      );
    }
    function calcularStatsGrupo(gY, pY, iY, aY) {
      let gCant = 0, gPren = 0;
      gY.forEach((inf) => (inf.rodeos || []).forEach((r) => {
        const s = statsRodeo(r); gCant += s.cantidad; gPren += s.prenadas;
      }));

      let pRev = 0, pApt = 0;
      pY.forEach((inf) => {
        const s = statsPreservicio(inf);
        pRev += s.revisadas; pApt += s.aptas;
      });

      let iCant = 0, iPerd = 0, iNoResp = 0;
      iY.forEach((inf) => (inf.protocolos || []).forEach((p) => {
        iCant += parseFloat(p.cantidad) || 0;
        iPerd += parseFloat(p.perdidasDispositivo) || 0;
        iNoResp += parseFloat(p.noRespondieron) || 0;
      }));

      let aTotal = 0, aApto = 0, aDescarte = 0, aTratamiento = 0;
      aY.forEach((inf) => (inf.toros || []).forEach((t) => {
        aTotal++;
        if (t.estado === "descarte") aDescarte++;
        else if (t.estado === "tratamiento") aTratamiento++;
        else aApto++;
      }));

      return {
        gestacion: gCant > 0 ? { cant: gCant, pren: gPren, vacias: gCant - gPren, pct: pct(gPren, gCant) } : null,
        preservicio: pRev > 0 ? { rev: pRev, pctApt: pct(pApt, pRev), pctDesc: pct(pRev - pApt, pRev) } : null,
        iatf: iCant > 0 ? { cant: iCant, pctResp: pct(iCant - iNoResp, iCant), pctPerd: pct(iPerd, iCant) } : null,
        andrologico: aTotal > 0 ? { total: aTotal, pctApto: pct(aApto, aTotal), pctDesc: pct(aDescarte, aTotal), pctTrat: pct(aTratamiento, aTotal) } : null,
      };
    }

    function ClienteDashboard({ cliente, gestaciones, preservicios, iatfs, andrologicos, onBack }) {
      const propios = (list) => list.filter((i) => i.clienteId === cliente.id);
      const gAll = propios(gestaciones), pAll = propios(preservicios), iAll = propios(iatfs), aAll = propios(andrologicos);
      const anios = Array.from(new Set([...gAll, ...pAll, ...iAll, ...aAll].map(anioDeInforme))).sort((a, b) => b.localeCompare(a));

      const dataPorAnio = anios.map((anio) => {
        const gY = gAll.filter((i) => anioDeInforme(i) === anio);
        const pY = pAll.filter((i) => anioDeInforme(i) === anio);
        const iY = iAll.filter((i) => anioDeInforme(i) === anio);
        const aY = aAll.filter((i) => anioDeInforme(i) === anio);

        const establecimientos = Array.from(new Set([...gY, ...pY, ...iY, ...aY].map((i) => i.establecimiento || "Sin establecimiento"))).sort();

        const porEstablecimiento = establecimientos.map((estab) => {
          const filtro = (i) => (i.establecimiento || "Sin establecimiento") === estab;
          return { estab, stats: calcularStatsGrupo(gY.filter(filtro), pY.filter(filtro), iY.filter(filtro), aY.filter(filtro)) };
        });

        // Comparación de % preñez entre establecimientos (para el gráfico de barras)
        const comparacionPrenez = porEstablecimiento
          .filter((e) => e.stats.gestacion)
          .map((e) => ({ estab: e.estab, pctv: e.stats.gestacion.pct }));

        return { anio, general: calcularStatsGrupo(gY, pY, iY, aY), porEstablecimiento, comparacionPrenez };
      });

      return (
        <div>
          <button onClick={onBack} style={{ background: "none", border: "none", color: T.teal, fontSize: 17, fontWeight: 700, cursor: "pointer", padding: "16px 16px", display: "block", minHeight: 44 }}>&larr; Volver</button>

            <div style={{ fontSize: 15, color: T.inkSoft }}>{cliente.nombre}</div>
          </div>
          <div style={{ padding: "12px 16px 100px" }}>
            {dataPorAnio.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <BarChart3 size={38} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes cargados para este cliente.</div>
              </div>
            )}
            {dataPorAnio.map((y) => (
              <div key={y.anio} style={{ marginBottom: 18 }}>
                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink, marginBottom: 10 }}>{y.anio}</div>

                {y.comparacionPrenez.length > 1 && (
                  <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>% Preñez por establecimiento</div>
                    {y.comparacionPrenez.map((e) => (
                      <div key={e.estab} style={{ marginBottom: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4 }}>
                          <span>{e.estab}</span><span style={{ fontWeight: 700, color: T.gold }}>{e.pctv}%</span>
                        </div>
                        <div style={{ background: T.line, borderRadius: 4, height: 10 }}>
                          <div style={{ background: T.gold, borderRadius: 4, height: 10, width: `${e.pctv}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {y.porEstablecimiento.map(({ estab, stats }) => (
                  <div key={estab} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>

        const destino = eligiendoClientePara === "ficha" ? "Ficha del animal" : "Indicadores";
        return (
          <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", maxWidth: 900, margin: "0 auto", color: T.ink }}>
            <button onClick={() => setEligiendoClientePara(null)} style={{
              background: "none", border: "none", color: T.teal, fontSize: 17, fontWeight: 700, cursor: "pointer",
              padding: "14px 18px", display: "flex", alignItems: "center", gap: 4, minHeight: 44,
            }}>
              <ChevronDown size={24} style={{ transform: "rotate(90deg)" }} /> Inicio
            </button>
            <div style={{ padding: "0 16px 10px", fontSize: 14.5, color: T.inkSoft }}>
              Elegí sobre qué cliente querés ver <b>{destino}</b>:
            </div>
            <ClientesView clientes={clientes} guardar={guardarCliente} borrar={borrarCliente} estadoSync={syncClientes}
              onSeleccionar={(c) => { setClienteId(c.id); setTab(eligiendoClientePara); setEligiendoClientePara(null); }}
              onVerEvolucion={setDashboardCliente} />
          </div>
        );
      }

      if (dashboardCliente) {
        return (
          <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", maxWidth: 900, margin: "0 auto", color: T.ink }}>
            <ClienteDashboard cliente={dashboardCliente} gestaciones={gestaciones} preservicios={preservicios}
              iatfs={iatfs} andrologicos={andrologicos} onBack={() => setDashboardCliente(null)} />
          </div>
        );
      }

      if (tab === null) {
        return (
          <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", color: T.ink }}>
            <HomeScreen onElegir={elegirDesdeInicio} onAbrirPapelera={() => setPapeleraAbierta(true)} usuario={usuario} onCambiarUsuario={cambiarUsuario} />
          </div>
        );
      }

      return (
        <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", maxWidth: 900, margin: "0 auto", color: T.ink }}>
          <button onClick={irAInicio} style={{
            background: "none", border: "none", color: T.teal, fontSize: 17, fontWeight: 700, cursor: "pointer",
            padding: "14px 18px", display: "flex", alignItems: "center", gap: 4, minHeight: 44,
          }}>
            <ChevronDown size={24} style={{ transform: "rotate(90deg)" }} /> Inicio
          </button>
          {tab === "clientes" && (
            <ClientesView clientes={clientes} guardar={guardarCliente} borrar={borrarCliente} estadoSync={syncClientes} onSeleccionar={irACliente} onVerEvolucion={setDashboardCliente} />
          )}
          {tab === "preservicio" && (
            clienteActivo ? (
              <PreservicioView cliente={clienteActivo} informes={preservicios} guardar={guardarPreservicio} borrar={borrarPreservicio} estadoSync={syncPreservicio} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "gestacion" && (
            clienteActivo ? (
              <GestacionView cliente={clienteActivo} informes={gestaciones} guardar={guardarGestacion} borrar={borrarGestacion} estadoSync={syncGestacion} iatfs={iatfs} todosInformes={todosInformes} historicos={historicos} guardarHistorico={guardarHistorico} borrarHistorico={borrarHistorico} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "iatf" && (
            clienteActivo ? (
              <IatfView cliente={clienteActivo} informes={iatfs} guardar={guardarIatf} borrar={borrarIatf} estadoSync={syncIatf} todosInformes={todosInformes} preservicios={preservicios} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "andrologico" && (
            clienteActivo ? (
              <AndrologicoView cliente={clienteActivo} informes={andrologicos} guardar={guardarAndrologico} borrar={borrarAndrologico} estadoSync={syncAndrologico} torosBase={torosBase} guardarBase={guardarBase} borrarBase={borrarBase} borrarBaseVarios={borrarBaseVarios} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "calidadseminal" && (
            clienteActivo ? (
              <CalidadSeminalView cliente={clienteActivo} informes={calidadSeminal} guardar={guardarCalidadSeminal} borrar={borrarCalidadSeminal} estadoSync={syncCalidadSeminal} todosInformes={todosInformes} torosBase={torosBase} guardarBase={guardarBase} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "tactosmerma" && (
            clienteActivo ? (
              <TactosMermaView cliente={clienteActivo} informes={tactosMerma} guardar={guardarTactosMerma} borrar={borrarTactosMerma} estadoSync={syncTactosMerma} todosInformes={todosInformes} gestaciones={gestaciones} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "sangrados" && (
            clienteActivo ? (
              <SangradosView cliente={clienteActivo} informes={sangrados} guardar={guardarSangrados} borrar={borrarSangrados} estadoSync={syncSangrados} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "ficha" && (
            clienteActivo ? (
              <FichaAnimalView cliente={clienteActivo} preservicios={preservicios} andrologicos={andrologicos} calidadSeminal={calidadSeminal} sangrados={sangrados} gestaciones={gestaciones} torosBase={torosBase} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "indicadores" && (
            clienteActivo ? (
              <IndicadoresView cliente={clienteActivo} gestaciones={gestaciones} preservicios={preservicios} tactosMerma={tactosMerma} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          <BarraNav tab={tab} setTab={setTab} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
