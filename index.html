  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useRef } from "react";
    import { createRoot } from "react-dom/client";
    import { Users, Plus, X, Trash2, Pencil, Wifi, WifiOff, ListChecks, ChevronDown, ChevronUp, AlertTriangle, Download, BarChart3, Zap, Percent, Droplet, Search, Activity } from "lucide-react";
    import * as XLSX from "xlsx";
    import { jsPDF } from "jspdf";
    import autoTable from "jspdf-autotable";
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyDeBLhH4lIASyLxlMg_oSwM_EZX7wzOg94",
      authDomain: "reprobovina-tyg.firebaseapp.com",
      projectId: "reprobovina-tyg",
      storageBucket: "reprobovina-tyg.firebasestorage.app",
      messagingSenderId: "162502425864",
      appId: "1:162502425864:web:49fecac926675a731c00bd",
    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    const DB_NAME = "reprobovina_local";
    const DB_VERSION = 11;
    const COLECCIONES = ["clientes", "preservicios", "gestaciones", "iatfs", "andrologicos", "toros_base", "historico_prenez", "papelera", "calidad_seminal", "tactos_merma", "sangrados"];
    const DIAS_PAPELERA = 30;

    /* Usuario del dispositivo (multi-usuario simple, sin contraseña): cada tablet elige quién la usa
       una vez, y ese nombre queda guardado localmente para "estampar" quién cargó cada informe. */
    const VETS = ["Ramiro", "Adolfo", "Fede", "Mojarra"];
    const USUARIO_KEY = "reprobovina_usuario";
    function obtenerUsuarioActual() {
      try { return localStorage.getItem(USUARIO_KEY) || ""; } catch (e) { return ""; }
    }
    function guardarUsuarioActual(nombre) {
      try { localStorage.setItem(USUARIO_KEY, nombre); } catch (e) {}
    }
    function borrarUsuarioActual() {
      try { localStorage.removeItem(USUARIO_KEY); } catch (e) {}
    }

    function abrirDB() {
      return new Promise((resolve, reject) => {
        let yaReintentado = false;
        const intentar = () => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const dbase = req.result;
            COLECCIONES.forEach((nombre) => {
              if (!dbase.objectStoreNames.contains(nombre)) {
                dbase.createObjectStore(nombre, { keyPath: "id" });
              }
            });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => {
            const err = req.error;
            // La base local del dispositivo quedó en una versión más nueva que la que pide
            // el código (puede pasar por una versión vieja que quedó en caché). En vez de
            // romper la app, la reseteamos: los datos reales están respaldados en la nube
            // y se vuelven a sincronizar solos apenas haya conexión.
            if (err && err.name === "VersionError" && !yaReintentado) {
              yaReintentado = true;
              const delReq = indexedDB.deleteDatabase(DB_NAME);
              delReq.onsuccess = () => intentar();
              delReq.onerror = () => reject(err);
              delReq.onblocked = () => reject(err);
            } else {
              reject(err);
            }
          };
        };
        intentar();
      });
    }
    async function idbGetAll(nombreColeccion) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readonly");
        const req = tx.objectStore(nombreColeccion).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbPut(nombreColeccion, registro) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readwrite");
        tx.objectStore(nombreColeccion).put(registro);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbDelete(nombreColeccion, id) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readwrite");
        tx.objectStore(nombreColeccion).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function getColeccion(nombreColeccion) { return idbGetAll(nombreColeccion); }

    /* Copia de seguridad completa: junta las 6 colecciones en un solo archivo para exportar/restaurar */
    async function exportarBackupCompleto() {
      const data = {};
      for (const col of COLECCIONES) {
        data[col] = await getColeccion(col);
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `backup_reprobovina_${todayISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    async function importarBackupDesdeArchivo(file) {
      const texto = await file.text();
      const data = JSON.parse(texto);
      let total = 0;
      for (const col of COLECCIONES) {
        const registros = data[col] || [];
        for (const r of registros) {
          await guardarEnColeccion(col, r);
          total++;
        }
      }
      return total;
    }
    /* Evita que una operación de red colgada deje la app esperando para siempre */
    function conTimeout(promesa, ms = 6000) {
      return Promise.race([
        promesa,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
      ]);
    }
    async function guardarEnColeccion(nombreColeccion, registro) {
      const conFecha = { ...registro, updatedAt: Date.now() };
      await idbPut(nombreColeccion, conFecha);
      if (navigator.onLine) {
        // Esperamos la confirmación de la nube, pero con un límite de tiempo: si tarda demasiado
        // (mala conexión) no nos colgamos, pero en condiciones normales sí queda confirmado antes
        // de seguir, para que una sincronización posterior no pise el cambio local.
        try { await conTimeout(setDoc(doc(db, nombreColeccion, conFecha.id), conFecha)); } catch (e) {}
      }
      return conFecha;
    }
    async function borrarDeColeccion(nombreColeccion, id) {
      await idbDelete(nombreColeccion, id);
      if (navigator.onLine) {
        // Igual que al guardar: esperamos la confirmación (con límite) para que la sincronización
        // no vuelva a traer de la nube un registro que acabamos de borrar localmente.
        try { await conTimeout(deleteDoc(doc(db, nombreColeccion, id))); } catch (e) {}
      }
    }
    async function sincronizar(nombreColeccion) {
      if (!navigator.onLine) return { ok: false };
      try {
        const locales = await idbGetAll(nombreColeccion);
        const localesPorId = Object.fromEntries(locales.map((r) => [r.id, r]));
        const snap = await conTimeout(getDocs(collection(db, nombreColeccion)));
        const remotos = snap.docs.map((d) => d.data());
        const remotosPorId = Object.fromEntries(remotos.map((r) => [r.id, r]));
        const todosLosIds = new Set([...Object.keys(localesPorId), ...Object.keys(remotosPorId)]);
        for (const id of todosLosIds) {
          const loc = localesPorId[id];
          const rem = remotosPorId[id];
          if (loc && !rem) setDoc(doc(db, nombreColeccion, id), loc).catch(() => {});
          else if (rem && !loc) await idbPut(nombreColeccion, rem);
          else if (loc && rem) {
            if ((loc.updatedAt || 0) > (rem.updatedAt || 0)) setDoc(doc(db, nombreColeccion, id), loc).catch(() => {});
            else if ((rem.updatedAt || 0) > (loc.updatedAt || 0)) await idbPut(nombreColeccion, rem);
          }
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, motivo: e.message };
      }
    }

    const T = {
      paper: "#DCD3B8", ink: "#1C2B22", inkSoft: "#5A6B5E", card: "#F3EEDD",
      line: "#C9BE9C", rust: "#A6491F", gold: "#8A6D1E", goldSoft: "#E9DCB0",
      teal: "#1F6B6B", tealSoft: "#CFE3E1",
    };
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function todayISO() { return new Date().toISOString().slice(0, 10); }

    /* Revisa si el número de informe ya está usado por otro informe del mismo año, en cualquiera de los 4 módulos */
    function numeroInformeDuplicado(todosInformes, numero, fecha, selfId) {
      if (!numero) return false;
      const anio = (fecha || todayISO()).slice(0, 4);
      return (todosInformes || []).some((i) => i.id !== selfId && String(i.numero) === String(numero) && (i.fecha || "").slice(0, 4) === anio);
    }
    /* Calcula el próximo número correlativo (compartido entre los 4 módulos) para el año de la fecha dada */
    function proximoNumero(todosInformes, fecha) {
      const anio = (fecha || todayISO()).slice(0, 4);
      const delAnio = (todosInformes || []).filter((i) => (i.fecha || "").slice(0, 4) === anio);
      const max = delAnio.reduce((m, i) => Math.max(m, parseFloat(i.numero) || 0), 0);
      return max + 1;
    }

    let _audioCtx = null;
    let _audioUnlocked = false;
    function _desbloquearAudio(ctx) {
      if (_audioUnlocked) return;
      try {
        const buffer = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buffer; src.connect(ctx.destination); src.start(0);
      } catch (e) {}
      _audioUnlocked = true;
    }
    function _tocarTono(ctx, kind) {
      const now = ctx.currentTime;
      if (kind === "alerta") {
        [0, 0.13].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "square";
          osc.frequency.setValueAtTime(440, now + offset);
          gain.gain.setValueAtTime(0.13, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);
          osc.start(now + offset); osc.stop(now + offset + 0.11);
        });
        return;
      }
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if (kind === "negativo") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.16);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.19);
      } else {
        osc.type = "sine";
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.1);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now); osc.stop(now + 0.15);
      }
    }
    /* kind: "positivo" (preñada/apta), "negativo" (vacía/descarte) o "alerta" (duplicado/aviso) */
    function playBeep(kind) {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = _audioCtx;
        _desbloquearAudio(ctx);
        if (ctx.state === "suspended" || ctx.state === "interrupted") {
          ctx.resume().then(() => _tocarTono(ctx, kind)).catch(() => {});
        } else {
          _tocarTono(ctx, kind);
        }
      } catch (e) {}
    }

    function EstadoConexion({ estado }) {
      const config = {
        online: { icon: Wifi, texto: "En línea · sincronizado", color: T.teal, bg: T.tealSoft },
        offline: { icon: WifiOff, texto: "Sin conexión · guardado en el dispositivo", color: T.rust, bg: "#E7C9B7" },
        sincronizando: { icon: Wifi, texto: "Sincronizando...", color: T.gold, bg: T.goldSoft },
      }[estado] || {};
      const Icon = config.icon;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", background: config.bg, color: config.color, fontSize: 14, fontWeight: 600 }}>
          {Icon && <Icon size={16} />} {config.texto}
        </div>
      );
    }

    function useCollection(nombre) {
      const [lista, setLista] = useState([]);
      const [estadoSync, setEstadoSync] = useState(navigator.onLine ? "sincronizando" : "offline");
      const recargar = () => getColeccion(nombre).then(setLista);
      useEffect(() => {
        recargar();
        const sync = async () => {
          if (!navigator.onLine) { setEstadoSync("offline"); return; }
          setEstadoSync("sincronizando");
          await sincronizar(nombre);
          await recargar();
          setEstadoSync("online");
        };
        sync();
        const onOnline = () => sync();
        const onOffline = () => setEstadoSync("offline");
        window.addEventListener("online", onOnline);
        window.addEventListener("offline", onOffline);
        return () => {
          window.removeEventListener("online", onOnline);
          window.removeEventListener("offline", onOffline);
        };
      }, [nombre]);
      const guardar = async (registro) => {
        const conId = registro.id ? registro : { ...registro, id: uid() };
        const usuarioActual = obtenerUsuarioActual();
        const conAutoria = {
          ...conId,
          cargadoPor: conId.cargadoPor || usuarioActual || conId.cargadoPor || "",
          modificadoPor: usuarioActual || conId.modificadoPor || "",
          fechaModificacion: Date.now(),
        };
        await guardarEnColeccion(nombre, conAutoria);
        await recargar();
      };
      /* Antes de borrar de verdad, guardamos una copia en la papelera por si hay que recuperarlo */
      const aPapelera = async (registros) => {
        if (nombre === "papelera" || registros.length === 0) return;
        await Promise.all(registros.map((r) =>
          guardarEnColeccion("papelera", { id: uid(), coleccionOriginal: nombre, datos: r, deletedAt: Date.now() })
        ));
      };
      const borrar = async (id) => {
        const registro = lista.find((r) => r.id === id);
        if (registro) await aPapelera([registro]);
        await borrarDeColeccion(nombre, id);
        await recargar();
      };
      /* Borra muchos registros en paralelo (mucho más rápido que uno por uno) */
      const borrarVarios = async (ids) => {
        const registros = lista.filter((r) => ids.includes(r.id));
        await aPapelera(registros);
        await Promise.all(ids.map((id) => borrarDeColeccion(nombre, id)));
        await recargar();
      };
      return { lista, guardar, borrar, borrarVarios, estadoSync };
    }

    function pct(parte, total) {
      if (!total) return 0;
      return Math.round((parte / total) * 1000) / 10;
    }
    /* Igual que pct pero con 2 decimales y coma, como usan los informes de Tactos Merma (ej: "2,31") */
    function pct2(parte, total) {
      if (!total) return "0,00";
      return (Math.round((parte / total) * 10000) / 100).toFixed(2).replace(".", ",");
    }
    /* Color informativo según % de merma: bajo (teal), medio (dorado/atención), alto (rust/alerta) */
    function colorMerma(v) {
      const n = parseFloat(String(v).replace(",", ".")) || 0;
      if (n >= 6) return T.rust;
      if (n >= 3) return T.gold;
      return T.teal;
    }
    function nuevoEstablecimiento() { return { id: uid(), nombre: "", ubicacion: "" }; }

    /* Busca un valor en una fila de Excel probando distintos nombres posibles de columna */
    /* Normaliza un texto de encabezado de Excel: minúsculas, sin acentos, sin puntos/espacios/símbolos.
       Así "C.E." o "C. E." o "Condición Corporal" se reconocen igual que "ce" o "condicion". */
    function normalizeKey(k) {
      return k.toString().trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }
    function extractField(row, aliases) {
      const aliasesNorm = aliases.map(normalizeKey);
      for (const key of Object.keys(row)) {
        const k = normalizeKey(key);
        if (aliasesNorm.some((a) => k === a || k.includes(a))) return row[key];
      }
      return "";
    }

    /* Lee un archivo Excel/CSV de toros (identidad simple o examen completo, reconoce las columnas solo) */
    async function parseExcelToros(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      // Leemos como grilla de filas/columnas (no como objetos) para no depender de cómo
      // SheetJS adivine los encabezados, y para poder buscar la fila de encabezados real.
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

      let headerRowIdx = 0;
      for (let i = 0; i < Math.min(grid.length, 15); i++) {
        const fila = (grid[i] || []).map((c) => normalizeKey(c));
        if (fila.some((c) => c === "tubo" || c === "rp")) { headerRowIdx = i; break; }
      }
      const headers = (grid[headerRowIdx] || []).map((c) => normalizeKey(c));
      const headersOriginales = (grid[headerRowIdx] || []).map((c) => String(c).trim()).filter(Boolean);
      const dataRows = grid.slice(headerRowIdx + 1);

      const getCell = (row, aliases) => {
        const aliasesNorm = aliases.map(normalizeKey);
        for (let col = 0; col < headers.length; col++) {
          const h = headers[col];
          if (!h) continue;
          if (aliasesNorm.some((a) => h === a || h.includes(a))) {
            return row[col] !== undefined ? row[col] : "";
          }
        }
        return "";
      };

      const marcado = (v) => {
        const s = String(v || "").trim().toLowerCase();
        return s !== "" && s !== "ok" && s !== "0" && s !== "no";
      };

      const toros = dataRows.map((row) => {
        if (!row || row.every((c) => c === "" || c === undefined)) return null;
        const estadoTexto = String(getCell(row, ["estado"]) || "").trim().toLowerCase();
        const motivoTexto = String(getCell(row, ["motivo"]) || "").trim();
        const observTexto = String(getCell(row, ["observ"]) || "").trim();
        let estado = "apto";
        if (estadoTexto.includes("descarte") || motivoTexto.toLowerCase().includes("descarte") || observTexto.toLowerCase().includes("descarte")) {
          estado = "descarte";
        } else if (estadoTexto.includes("tratamiento") || motivoTexto.toLowerCase().includes("tratamiento") || observTexto.toLowerCase().includes("tratamiento")) {
          estado = "tratamiento";
        }

        const miembroAntCelda = getCell(row, ["miembro anterior", "miembro ant"]);
        const miembroPostCelda = getCell(row, ["miembro posterior", "miembro post"]);
        const prepucioCelda = getCell(row, ["prepucio"]);

        return {
          tubo: String(getCell(row, ["tubo"]) || "").trim(),
          rp: String(getCell(row, ["rp"]) || "").trim(),
          electronica: String(getCell(row, ["electronica", "eid", "vid", "caravana"]) || "").trim(),
          raza: normalizarRaza(getCell(row, ["raza"])),
          origen: String(getCell(row, ["origen"]) || "").trim(),

        };
      }).filter(Boolean).filter((t) => t.rp || t.electronica);

      const ceEncontrada = headers.some((h) => ["ce", "circunferencia", "perimetro", "escrotal"].some((a) => h === a || h.includes(a)));

    }

    /* Descarga un libro de Excel ya armado (evita el bug de XLSX.writeFile en algunos navegadores) */
    function descargarExcel(wb, nombreArchivo) {
      const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nombreArchivo;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ---------- Infraestructura compartida para generar PDF ---------- */
    const PDF_COLORES = { ink: [28, 43, 34], inkSoft: [90, 107, 94], gold: [138, 109, 30], teal: [31, 107, 107], rust: [166, 73, 31], line: [201, 190, 156] };
    function pdfHeader(doc, tituloModulo, cliente, establecimiento, fecha, numero) {
      const pageWidth = doc.internal.pageSize.getWidth();
      let y = 14;
      try {
        const props = doc.getImageProperties(LOGO_TYG);
        const ratio = props.height / props.width;
        let logoW = 48, logoH = logoW * ratio;
        if (logoH > 24) { logoH = 24; logoW = logoH / ratio; }
        doc.addImage(LOGO_TYG, "PNG", pageWidth / 2 - logoW / 2, y, logoW, logoH);
        y += logoH + 6;
      } catch (e) { y += 23; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...PDF_COLORES.ink);
      doc.text(tituloModulo.toUpperCase(), pageWidth / 2, y, { align: "center" });
      y += 7;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...PDF_COLORES.inkSoft);
      const partes = [`Cliente: ${cliente.nombre}`, establecimiento ? `Establecimiento: ${establecimiento}` : null, `Fecha: ${fecha}`, numero ? `N° ${numero}` : null].filter(Boolean);
      doc.text(partes.join("   ·   "), pageWidth / 2, y, { align: "center" });
      y += 6;
      doc.setDrawColor(...PDF_COLORES.line);
      doc.line(14, y, pageWidth - 14, y);
      y += 7;
      return y;
    }
    function pdfSeccionTitulo(doc, y, texto) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(...PDF_COLORES.ink);
      doc.text(texto, 14, y);
      return y + 6;
    }
    function pdfTabla(doc, y, head, body, opciones = {}) {
      autoTable(doc, {
        startY: y, head: [head], body,
        theme: "grid", styles: { fontSize: 9, textColor: PDF_COLORES.ink, lineColor: PDF_COLORES.line, lineWidth: 0.2 },
        headStyles: { fillColor: PDF_COLORES.gold, textColor: [255, 255, 255], fontStyle: "bold" },
        alternateRowStyles: { fillColor: [243, 238, 221] },
        margin: { left: 14, right: 14 },
        ...opciones,
      });
      return doc.lastAutoTable.finalY + 8;
    }
    function pdfStatsFila(doc, y, stats) {
      // stats: [{label, value, color}]
      const pageWidth = doc.internal.pageSize.getWidth();
      const anchoTotal = pageWidth - 28;
      const anchoCaja = anchoTotal / stats.length;
      stats.forEach((s, i) => {
        const x = 14 + i * anchoCaja;
        doc.setDrawColor(...PDF_COLORES.line);
        doc.roundedRect(x + 2, y, anchoCaja - 4, 20, 2, 2);
        doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...(s.color || PDF_COLORES.ink));
        doc.text(String(s.value), x + anchoCaja / 2, y + 10, { align: "center" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...PDF_COLORES.inkSoft);
        doc.text(s.label, x + anchoCaja / 2, y + 16, { align: "center" });
      });
      return y + 26;
    }
    function pdfConclusionYPie(doc, y, conclusion) {
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      if (conclusion && conclusion.trim()) {
        if (y > pageHeight - 45) { doc.addPage(); y = 18; }
        y = pdfSeccionTitulo(doc, y, "Conclusión");
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...PDF_COLORES.ink);
        const lineas = doc.splitTextToSize(conclusion, pageWidth - 28);
        doc.text(lineas, 14, y);
        y += lineas.length * 5 + 4;
      }
      const totalPages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        const footerY = pageHeight - 16;
        doc.setDrawColor(...PDF_COLORES.line);
        doc.line(14, footerY - 5, pageWidth - 14, footerY - 5);
        doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(120, 120, 120);
        doc.text("T&G Servicios Veterinarios S.A.S.", pageWidth / 2, footerY, { align: "center" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
        doc.text("tygserviciosveterinarios@gmail.com", pageWidth / 2, footerY + 4, { align: "center" });
        doc.text("Ramiro Gallardo (0387) 154732153   ·   Adolfo Torino (0387) 154473233", pageWidth / 2, footerY + 8, { align: "center" });
        doc.text(`Página ${i} de ${totalPages}`, pageWidth - 14, footerY + 8, { align: "right" });
      }
      return y;
    }
    function pdfDescargar(doc, nombreArchivo) {
      doc.save(nombreArchivo);

    function generarConclusionPreservicio(inf) {
      const st = statsPreservicio(inf);
      const rev = st.revisadas, apt = st.aptas;
      if (rev === 0) return "";
      const p = pct(apt, rev);
      let calif = "bueno";
      if (p >= 90) calif = "muy bueno";
      else if (p < 70) calif = "regular, con un porcentaje de descarte más alto de lo esperable";
      let texto = `Se revisaron ${rev} animales en ${inf.establecimiento || "el establecimiento"}, de los cuales ${apt} resultaron aptas para servicio (${p}%) y ${rev - apt} fueron descartadas (${pct(rev - apt, rev)}%). El resultado general de la preparación de vientres es ${calif}.`;
      const motivos = [["Pelvimetría", st.descPelvimetria || 0], ["GDR insuficiente", st.descGdr || 0], ["Tamaño/desarrollo", st.descTamano || 0], ["Preñada", st.descPrenada || 0], ["Otras causas", st.descOtras || 0]].filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
      if (motivos.length) texto += ` El principal motivo de descarte fue ${motivos[0][0].toLowerCase()} (${motivos[0][1]} caso${motivos[0][1] !== 1 ? "s" : ""}).`;
      if ((st.gdr1 + st.gdr2 + st.gdr3 + st.gdr4) > 0) {

    function generarPDFPreservicio(inf, cliente) {
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      let y = pdfHeader(doc, "Preservicio", cliente, inf.establecimiento, inf.fecha, inf.numero);
      const st = statsPreservicio(inf);
      const rev = st.revisadas, apt = st.aptas;
      y = pdfStatsFila(doc, y, [
        { label: "APTAS", value: `${apt} (${pct(apt, rev)}%)`, color: PDF_COLORES.gold },
        { label: "DESCARTE", value: `${rev - apt} (${pct(rev - apt, rev)}%)`, color: PDF_COLORES.rust },
        { label: "TOTAL REVISADAS", value: rev, color: PDF_COLORES.ink },
      ]);
      y = pdfSeccionTitulo(doc, y, "Motivos de descarte");
      y = pdfTabla(doc, y, ["Motivo", "Cantidad"], [
        ["Pelvimetría", st.descPelvimetria || 0], ["GDR insuficiente", st.descGdr || 0], ["Tamaño/desarrollo", st.descTamano || 0], ["Preñada", st.descPrenada || 0], ["Otras causas", st.descOtras || 0],
      ]);
      if ((st.gdr1 + st.gdr2 + st.gdr3 + st.gdr4) > 0) {
        y = pdfSeccionTitulo(doc, y, "Clasificación por GDR (sobre aptas)");
        y = pdfTabla(doc, y, ["GDR", "Cantidad", "%"], [1, 2, 3, 4].map((g) => [`GDR ${g}`, st[`gdr${g}`] || 0, `${pct(st[`gdr${g}`], apt)}%`]));
      }
      if (inf.modoCarga === "rapida" && (inf.animales || []).length > 0) {
        const animalesInf = inf.animales || [];
        const armar = (campo, normalizar) => {
          const grupos = {};
          animalesInf.forEach((a) => {
            const raw = a[campo];
            if (!raw) return;
            const k = normalizar ? normalizar(raw) : raw;
            if (!grupos[k]) grupos[k] = { total: 0, gdr: { 1: 0, 2: 0, 3: 0, 4: 0 } };
            grupos[k].total += 1;
            if (a.resultado === "Apta" && a.gdr) grupos[k].gdr[a.gdr] = (grupos[k].gdr[a.gdr] || 0) + 1;
          });
          return grupos;
        };
        const filaGdr = (g) => [1, 2, 3, 4].filter((n) => g.gdr[n] > 0).map((n) => `GDR${n}: ${g.gdr[n]}`).join(" · ");
        const gruposCC = armar("cc");
        const totalCC = Object.values(gruposCC).reduce((a, g) => a + g.total, 0);
        if (Object.keys(gruposCC).length > 0) {
          y = pdfSeccionTitulo(doc, y, "Condición corporal");
          y = pdfTabla(doc, y, ["C.C.", "Cantidad", "%", "GDR (sobre aptas)"],
            Object.entries(gruposCC).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0])).map(([cc, g]) => [cc, g.total, `${pct(g.total, totalCC)}%`, filaGdr(g)]));
        }
        const gruposRaza = armar("raza", normalizarRaza);
        const totalRaza = Object.values(gruposRaza).reduce((a, g) => a + g.total, 0);
        if (Object.keys(gruposRaza).length > 0) {
          y = pdfSeccionTitulo(doc, y, "Raza");
          y = pdfTabla(doc, y, ["Raza", "Cantidad", "%", "GDR (sobre aptas)"],
            Object.entries(gruposRaza).sort((a, b) => b[1].total - a[1].total).map(([raza, g]) => [raza, g.total, `${pct(g.total, totalRaza)}%`, filaGdr(g)]));
        }
      }
      pdfConclusionYPie(doc, y, inf.conclusionPdf != null ? inf.conclusionPdf : generarConclusionPreservicio(inf));
      pdfDescargar(doc, `Preservicio_${cliente.nombre}_${inf.fecha}.pdf`);
    }

    function generarConclusionIatf(inf) {
      const lotes = (inf.protocolos || []).filter((p) => p.cantidad);
      if (lotes.length === 0) return "";
      let cantTotal = 0, perdTotal = 0, noRespTotal = 0;
      lotes.forEach((p) => { cantTotal += parseFloat(p.cantidad) || 0; perdTotal += parseFloat(p.perdidasDispositivo) || 0; noRespTotal += parseFloat(p.noRespondieron) || 0; });
      let texto = `Se realizó protocolo de IATF en ${inf.establecimiento || "el establecimiento"} sobre ${lotes.length} lote${lotes.length !== 1 ? "s" : ""}, totalizando ${cantTotal} animales. `;
      texto += `La pérdida de dispositivos fue de ${perdTotal} animales (${pct(perdTotal, cantTotal)}%) y ${noRespTotal} no mostraron respuesta al protocolo (${pct(noRespTotal, cantTotal)}%).`;
      const pajuelas = (inf.pajuelas || []).filter((p) => p.toro);
      if (pajuelas.length) {
        const noAptas = pajuelas.filter((p) => p.resultado !== "Apto").length;
        texto += noAptas > 0
          ? ` Del control de calidad seminal realizado sobre ${pajuelas.length} pajuela(s), ${noAptas} no cumplieron los parámetros esperados; se recomienda revisar el lote de semen correspondiente.`
          : ` El control de calidad seminal sobre ${pajuelas.length} pajuela(s) resultó satisfactorio en la totalidad de los casos.`;
      }
      texto += " El diagnóstico de gestación correspondiente permitirá confirmar el resultado final del servicio.";
      return texto;
    }

    function generarConclusionAndrologico(inf) {
      const toros = inf.toros || [];
      const total = toros.length;
      if (total === 0) return "";
      const aptos = toros.filter((t) => t.estado === "apto").length;
      const tratam = toros.filter((t) => t.estado === "tratamiento").length;
      const descarte = toros.filter((t) => t.estado === "descarte").length;
      const pctAptos = pct(aptos, total);
      let calif = "bueno";
      if (pctAptos >= 90) calif = "muy bueno";
      else if (pctAptos < 75) calif = "regular, con una proporción de descarte más alta de lo esperable";
      let texto = `Se examinaron ${total} toros en ${inf.establecimiento || "el establecimiento"}, de los cuales ${aptos} resultaron aptos (${pctAptos}%), ${tratam} quedaron a tratamiento (${pct(tratam, total)}%) y ${descarte} fueron descartados (${pct(descarte, total)}%). El estado sanitario-reproductivo general del lote es ${calif}.`;
      const porMotivo = {};
      toros.filter((t) => t.estado === "descarte").forEach((t) => { const m = t.motivoDescarte || "sin especificar"; porMotivo[m] = (porMotivo[m] || 0) + 1; });
      const motivos = Object.entries(porMotivo).sort((a, b) => b[1] - a[1]);
      if (motivos.length) texto += ` El principal motivo de descarte fue ${motivos[0][0].toLowerCase()} (${motivos[0][1]} caso${motivos[0][1] !== 1 ? "s" : ""}).`;
      const venereasPositivos = toros.filter((t) => t.campylobacter === "positivo" || t.tricomonas === "positivo" || t.brucelosis === "positivo");
      if (venereasPositivos.length > 0) {
        texto += ` Se detectaron ${venereasPositivos.length} toro${venereasPositivos.length !== 1 ? "s" : ""} positivo${venereasPositivos.length !== 1 ? "s" : ""} a enfermedades venéreas, que fueron descartados; se recomienda reforzar el control sanitario del rodeo.`;
      } else if (inf.fechaCampyTrico || inf.fechaBrucelosis) {
        texto += " El panel de enfermedades venéreas realizado resultó negativo en la totalidad del lote.";
      }
      texto += " Se recomienda repetir el examen andrológico según el protocolo habitual del establecimiento.";
      return texto;
    }

    /* Busca el rodeo de un diagnóstico de Gestación anterior, para vincularlo a una fila de re-tacto (Tactos Merma) */
    function getRodeoGestacionVinculado(gestaciones, gestacionInformeId, gestacionRodeoId) {
      if (!gestacionInformeId || !gestacionRodeoId) return null;
      const inf = (gestaciones || []).find((i) => i.id === gestacionInformeId);
      if (!inf) return null;
      const rodeo = (inf.rodeos || []).find((r) => r.id === gestacionRodeoId);

      const filas = inf.filas || [];

      const totalRodeo = filas.reduce((s, f) => s + (parseFloat(f.totalRodeo) || 0), 0);
      const totalVacias = filas.reduce((s, f) => s + (parseFloat(f.vacias) || 0), 0);
      return {
        totalTactadas, totalRodeo, totalVacias,
        pctTactado: pct2(totalTactadas, totalRodeo),
        pctMerma: pct2(totalVacias, totalTactadas),
      };
    }

        id: uid(), orden: 1, tubo: "", identificacion: "", electronica: "", raza: "", ce: "", vol: "",
        apariencia: "", motilidadMasal: "", vigor: "", concentracion: "", mt: "", mp: "",
        morfologia: "", ph: "", resultado: "", observaciones: "",
        // Semen congelado
        partidaPajuela: "",
      };

    function tamanoPajuelaNumero(v) {
      if (!v) return 0;
      return parseFloat(String(v).replace(",", ".")) || 0;
    }
    function calcularConcentracionPajuela(m) {
      return (parseFloat(m.concentracion) || 0) * tamanoPajuelaNumero(m.vol);
    }
    function calcularSptzVivosPajuela(m) {
      return calcularConcentracionPajuela(m) * (parseFloat(m.mt) || 0) / 100;
    }

    function claseResultadoSeminal(v) {

    function exportarExcelCalidadSeminal(inf, cliente) {
      const esFresco = (inf.tipoSemen || "fresco") === "fresco";
      const filas = [
        ["REVISACIÓN ANDROLÓGICA Y CALIDAD SEMINAL"],
        ["Cliente", cliente.nombre], ["Establecimiento", inf.establecimiento], ["Fecha", inf.fecha],
        ["Tipo de semen", esFresco ? "Fresco" : "Congelado"],
        [],
      ];
      if (esFresco) {
        filas.push(["Orden", "Tubo", "Identificación", "Electrónica", "Raza", "C.E.", "Vol.", "Apariencia", "Motilidad masal", "Vigor", "Concentración (mill/ml)", "%MT", "%MP", "Morfología", "pH", "Resultado final", "Observaciones"]);
        (inf.muestras || []).forEach((m, i) => {
          filas.push([
            m.orden || i + 1, m.tubo || "", m.identificacion || "", m.electronica || "", normalizarRaza(m.raza) || "", m.ce || "", m.vol || "",
            m.apariencia || "", m.motilidadMasal || "", m.vigor || "", m.concentracion || "", m.mt || "", m.mp || "",
            m.morfologia || "", m.ph || "", m.resultado || "", m.observaciones || "",
          ]);
        });
        const ws = XLSX.utils.aoa_to_sheet(filas);
        ws["!cols"] = [{ wch: 7 }, { wch: 8 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 7 }, { wch: 7 }, { wch: 11 }, { wch: 14 }, { wch: 7 }, { wch: 14 }, { wch: 7 }, { wch: 7 }, { wch: 10 }, { wch: 6 }, { wch: 20 }, { wch: 26 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "CalidadSeminal");
        descargarExcel(wb, `CalidadSeminal_${cliente.nombre}_${inf.fecha}.xlsx`);
      } else {
        filas.push(["Orden", "Identificación", "Electrónica", "Raza", "Partida pajuela", "Concentración (mill/ml)", "Tamaño pajuela", "Concentración (mill/pajuela)", "%MT", "%MP", "Sptz vivos por pajuela", "Resultado final", "Observaciones"]);
        (inf.muestras || []).forEach((m, i) => {
          filas.push([
            m.orden || i + 1, m.identificacion || "", m.electronica || "", normalizarRaza(m.raza) || "", m.partidaPajuela || "",
            m.concentracion || "", m.vol || "", calcularConcentracionPajuela(m).toFixed(1), m.mt || "", m.mp || "",
            calcularSptzVivosPajuela(m).toFixed(1),
            m.resultado || "", m.observaciones || "",
          ]);
        });
        const ws = XLSX.utils.aoa_to_sheet(filas);
        ws["!cols"] = [{ wch: 7 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 16 }, { wch: 7 }, { wch: 7 }, { wch: 16 }, { wch: 20 }, { wch: 26 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "CalidadSeminal");
        descargarExcel(wb, `CalidadSeminal_${cliente.nombre}_${inf.fecha}.xlsx`);
      }
    }

        form.muestras.forEach((m) => { if (m[campo]) conteo[m[campo]] = (conteo[m[campo]] || 0) + 1; });
        return new Set(Object.keys(conteo).filter((k) => conteo[k] > 1));
      };
      const identifRepetidas = contarRepetidosCS("identificacion");
      const electronicaRepetidas = contarRepetidosCS("electronica");
      const tubosRepetidas = contarRepetidosCS("tubo");

      const abrirNuevo = () => {
        const v = vacio(); const id = uid();
        v.numero = proximoNumero(todosInformes, v.fecha);
        setEditando(id); setForm(v); setExpandidoId(v.muestras[0].id); setVista("form"); setUltimoGuardado(null);
      };
      const abrirEditar = (inf) => {
        setEditando(inf.id);
        const muestras = (inf.muestras || []).map((m, i) => m.orden ? m : { ...m, orden: i + 1 });
        setForm({ ...inf, muestras });
        setExpandidoId(null); setVista("form"); setUltimoGuardado(null);
      };
      const hayContenido = (f) => (f.muestras || []).some((m) => m.identificacion || m.concentracion) || f.nombre;
      const guardarAvance = () => {
        if (!editando || !hayContenido(form)) return;
        guardar({ ...form, id: editando, clienteId: cliente.id });
        setUltimoGuardado(Date.now());
      };
      useEffect(() => {
        if (vista !== "form" || !editando || !hayContenido(form)) return;
        const t = setTimeout(() => { guardar({ ...form, id: editando, clienteId: cliente.id }); setUltimoGuardado(Date.now()); }, 2500);
        return () => clearTimeout(t);
      }, [form, editando, vista]);
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        const idFinal = editando || uid();
        guardar({ ...form, numero: numeroFinal, id: idFinal, clienteId: cliente.id });
        setViendoId(idFinal);
        setVista("reporte");
      };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) borrar(id); };
      const abrirReporte = (inf) => { setViendoId(inf.id); setVista("reporte"); };

      const agregarMuestra = () => {
        const maxOrden = form.muestras.reduce((max, m) => Math.max(max, m.orden || 0), 0);
        const nueva = { ...nuevaMuestra(), orden: maxOrden + 1 };
        setForm({ ...form, muestras: [...form.muestras, nueva] });
        setExpandidoId(nueva.id);
      };
      const quitarMuestra = (id) => setForm({ ...form, muestras: form.muestras.filter((m) => m.id !== id) });
      const actualizarMuestra = (id, patch) => setForm({ ...form, muestras: form.muestras.map((m) => m.id === id ? { ...m, ...patch } : m) });

      const handleImportarCS = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        setMsgImport("Leyendo archivo...");
        try {
          // Solo tomamos RP, raza y C.E., y los guardamos en la BASE del establecimiento
          // (la misma que usa Andrológico) — no se cargan toros en el informe todavía.
          // Después, al escribir el RP de un toro nuevo acá, se completan solos.
          const { toros: filas } = await parseExcelToros(file);
          if (!filas.length) { setMsgImport("Se leyó el archivo pero no se encontraron filas con RP."); return; }
          let baseEnMemoria = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === form.establecimiento);
          const idsTocados = new Set();
          let repetidosEnArchivo = 0;
          filas.forEach((t) => {
            if (!t.rp) return;
            const existente = buscarEnBase(baseEnMemoria, cliente.id, t.rp, "", form.establecimiento);
            const registro = { id: existente ? existente.id : uid(), clienteId: cliente.id, establecimiento: form.establecimiento, rp: t.rp, raza: t.raza || "", ce: t.ce || "" };
            if (existente) {
              if (idsTocados.has(existente.id)) repetidosEnArchivo++;
              baseEnMemoria = baseEnMemoria.map((b) => (b.id === existente.id ? registro : b));
            } else {
              baseEnMemoria = [...baseEnMemoria, registro];
            }
            idsTocados.add(registro.id);
            guardarBase(registro);
          });
          setMsgImport(`${idsTocados.size} toros guardados en la base de ${form.establecimiento || "este establecimiento"} (RP, raza y C.E.)${repetidosEnArchivo > 0 ? ` · ${repetidosEnArchivo} filas repetidas se unificaron` : ""}. Ahora, al cargar una muestra nueva y escribir el RP, se completan solos.`);
        } catch (err) {
          setMsgImport("No se pudo leer el archivo: " + (err.message || "error desconocido"));
        }
      };

      const informeMostrado = informes.find((i) => i.id === viendoId) || null;

      if (vista === "reporte" && informeMostrado) {
        const inf = informeMostrado;
        const muestras = inf.muestras || [];
        const total = muestras.length;
        const contarResultado = (v) => muestras.filter((m) => m.resultado === v).length;
        const aptos = contarResultado("APTO");
        const cuestionables = contarResultado("CUESTIONABLE- REPETIR") + contarResultado("REPETIR");
        const noAptos = contarResultado("NO APTO-REPETIR");
        return (
          <div>
            <div style={{ padding: "16px 16px 4px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <ChevronDown size={19} style={{ transform: "rotate(90deg)" }} /> Volver
              </button>
              <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <Pencil size={18} /> Editar
              </button>
            </div>
            <div style={{ padding: "0 16px 8px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>{inf.nombre || "Calidad Seminal"}</div>
                <span style={{ background: T.tealSoft, color: T.teal, fontSize: 12.5, fontWeight: 700, padding: "3px 10px", borderRadius: 20 }}>{(inf.tipoSemen || "fresco") === "fresco" ? "Semen fresco" : "Semen congelado"}</span>
              </div>
              <div style={{ fontSize: 15, color: T.inkSoft }}>{inf.fecha}{inf.numero ? ` · N° ${inf.numero}` : ""}</div>
            </div>
            <Membrete width={210} />
            <div style={{ padding: "8px 16px 90px" }}>
              <div style={{ textAlign: "center", marginBottom: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", letterSpacing: 1 }}>Total de muestras</div>
                <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 56, color: T.ink, lineHeight: 1.1 }}>{total}</div>
              </div>
              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "13px 15px", marginBottom: 20 }}>
                Cliente: <b>{cliente.nombre}</b>
                <div style={{ fontSize: 14, color: T.inkSoft, marginTop: 2 }}>{inf.establecimiento}</div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 10, marginBottom: 20 }}>
                <div style={{ background: T.goldSoft, borderRadius: 12, padding: "14px 8px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 24, color: T.gold }}>{aptos}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 700, color: T.gold, textTransform: "uppercase", marginTop: 2 }}>Aptos · {pct(aptos, total)}%</div>
                </div>
                <div style={{ background: T.tealSoft, borderRadius: 12, padding: "14px 8px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 24, color: T.teal }}>{cuestionables}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 700, color: T.teal, textTransform: "uppercase", marginTop: 2 }}>A repetir · {pct(cuestionables, total)}%</div>
                </div>
                <div style={{ background: "#E7C9B7", borderRadius: 12, padding: "14px 8px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 24, color: T.rust }}>{noAptos}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 700, color: T.rust, textTransform: "uppercase", marginTop: 2 }}>No aptos · {pct(noAptos, total)}%</div>
                </div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Planilla individual</div>
              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 6, marginBottom: 20 }}>
                {muestras.map((m, i) => {
                  const res = claseResultadoSeminal(m.resultado);
                  return (
                    <div key={m.id || i} style={{ padding: "10px 8px", borderBottom: i < muestras.length - 1 ? `1px solid ${T.line}` : "none" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 15.5, color: T.teal }}>#{m.orden || i + 1} · {m.identificacion || "-"}</div>

                      {m.observaciones && <div style={{ marginTop: 6, fontSize: 13, color: T.inkSoft, fontStyle: "italic" }}>{m.observaciones}</div>}
                    </div>

              </div>
              <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 8 }}>
                <button onClick={() => exportarExcelCalidadSeminal(inf, cliente)} style={{ background: T.teal, color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>

            </div>
          </div>

      if (vista === "form") {

            <div style={{ padding: "0 16px 90px" }}>

                  </div>

                <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Establecimiento</label>
                <select value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }}>
                  {(cliente.establecimientos || []).map((e) => <option key={e.id || e.nombre} value={e.nombre}>{e.nombre}</option>)}
                </select>
                <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Tipo de semen (define los campos y valores de referencia)</label>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginTop: 6 }}>
                  <button onClick={() => setForm({ ...form, tipoSemen: "fresco" })} style={{
                    padding: "13px", borderRadius: 8, fontWeight: 700, fontSize: 16, cursor: "pointer",
                    border: `1.5px solid ${form.tipoSemen === "fresco" ? T.teal : T.line}`, background: form.tipoSemen === "fresco" ? T.tealSoft : "#fff", color: form.tipoSemen === "fresco" ? T.teal : T.inkSoft,
                  }}>Semen fresco</button>
                  <button onClick={() => setForm({ ...form, tipoSemen: "congelado" })} style={{
                    padding: "13px", borderRadius: 8, fontWeight: 700, fontSize: 16, cursor: "pointer",
                    border: `1.5px solid ${form.tipoSemen === "congelado" ? T.teal : T.line}`, background: form.tipoSemen === "congelado" ? T.tealSoft : "#fff", color: form.tipoSemen === "congelado" ? T.teal : T.inkSoft,
                  }}>Semen congelado</button>
                </div>
              </div>

              <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleImportarCS} />
              <button onClick={() => fileRef.current && fileRef.current.click()} style={{
                width: "100%", minWidth: 0, background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", marginBottom: 6,
                color: T.teal, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              }}>
                <Download size={19} style={{ transform: "rotate(180deg)" }} /> Importar base (Excel de un Andrológico previo)
              </button>
              <div style={{ fontSize: 14, color: T.inkSoft, marginBottom: 14 }}>
                {torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === form.establecimiento).length} toros en la base de {form.establecimiento || "este establecimiento"} (se comparte con Andrológico). Al cargar una muestra nueva, escribí el RP y se completan solos raza y C.E.
                {msgImport && <span style={{ display: "block", marginTop: 4, color: T.teal, fontWeight: 600 }}>{msgImport}</span>}
              </div>

              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, marginBottom: 14, overflow: "hidden" }}>
                <button onClick={() => setRefAbierta(!refAbierta)} style={{ width: "100%", minWidth: 0, background: "none", border: "none", cursor: "pointer", padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Ficha de referencia rápida — {form.tipoSemen === "fresco" ? "Semen fresco" : "Semen congelado"}</span>
                  {refAbierta ? <ChevronUp size={18} style={{ color: T.inkSoft }} /> : <ChevronDown size={18} style={{ color: T.inkSoft }} />}
                </button>
                {refAbierta && (
                  <div style={{ padding: "0 14px 14px", fontSize: 13 }}>
                    {form.tipoSemen === "fresco" ? (
                      <React.Fragment>
                        {[["Apariencia (densidad/volumen)", ESCALA_APARIENCIA], ["Motilidad masal", ESCALA_MOTILIDAD_MASAL]].map(([titulo, escala]) => (
                          <div key={titulo} style={{ marginBottom: 10 }}>
                            <div style={{ fontWeight: 700, color: T.ink, marginBottom: 4 }}>{titulo}</div>
                            {escala.map((o) => (
                              <div key={o.v} style={{ color: T.inkSoft, marginBottom: 2 }}><b style={{ color: T.ink }}>{o.v} ({o.label}):</b> {o.detalle}</div>
                            ))}
                          </div>
                        ))}
                        <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 14 }}>
                          <tbody>
                            {REFERENCIA_FRESCO_EXTRA.map(([param, valor]) => (
                              <tr key={param} style={{ borderBottom: `1px solid ${T.line}` }}>
                                <td style={{ padding: "6px 4px", color: T.ink, fontWeight: 700 }}>{param}</td>
                                <td style={{ padding: "6px 4px", color: T.inkSoft, textAlign: "right" }}>{valor}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </React.Fragment>
                    ) : (
                      <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 14 }}>
                        <tbody>
                          {REFERENCIA_SEMEN_CONGELADO.map(([param, valor]) => (
                            <tr key={param} style={{ borderBottom: `1px solid ${T.line}` }}>
                              <td style={{ padding: "6px 4px", color: T.ink, fontWeight: 700 }}>{param}</td>
                              <td style={{ padding: "6px 4px", color: T.inkSoft, textAlign: "right" }}>{valor}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                )}
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Muestras</div>
                <div style={{ background: T.tealSoft, color: T.teal, fontWeight: 800, fontSize: 15, padding: "4px 12px", borderRadius: 20 }}>
                  {form.muestras.length} cargada{form.muestras.length !== 1 ? "s" : ""}
                </div>
              </div>
              {form.muestras.length > 4 && (
                <input value={buscarMuestra} onChange={(e) => setBuscarMuestra(e.target.value)} placeholder="Buscar por identificación en este informe..."
                  style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, marginBottom: 10, background: "#fff" }} />
              )}
              {(() => {
                const q = buscarMuestra.trim().toLowerCase();
                const filtradas = q ? form.muestras.filter((m) => (m.identificacion || "").toLowerCase().includes(q)) : form.muestras;
                if (q && filtradas.length === 0) return <div style={{ textAlign: "center", padding: "16px 10px", color: T.inkSoft, fontSize: 14.5 }}>No hay ninguna muestra con esa identificación.</div>;
                return filtradas.map((m) => {
                  const i = form.muestras.indexOf(m);
                  return (
                    <TarjetaMuestra key={m.id} m={m} idx={i} expandido={expandidoId === m.id}
                      onExpandir={() => setExpandidoId(expandidoId === m.id ? null : m.id)}
                      onActualizar={(patch) => actualizarMuestra(m.id, patch)}
                      onQuitar={() => quitarMuestra(m.id)} sePuedeQuitar={form.muestras.length > 1}
                      identifRepetidas={identifRepetidas} electronicaRepetidas={electronicaRepetidas} tubosRepetidas={tubosRepetidas}

              {ultimoGuardado && (
                <div style={{ textAlign: "center", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>

              <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>

              const q = buscarGlobal.trim().toLowerCase();

        const nuevo = { id: uid(), caravana: caravana.trim(), resultado };
        const listaNueva = [...animales, nuevo];
        onChange({ animales: listaNueva, tactadas: listaNueva.length, vacias: listaNueva.filter((a) => a.resultado === "Vacía").length });
        playBeep(resultado === "Preñada" ? "positivo" : "negativo");
        setCaravana("");
      };
      const borrarAnimal = (id) => {
        const listaNueva = animales.filter((a) => a.id !== id);
        onChange({ animales: listaNueva, tactadas: listaNueva.length, vacias: listaNueva.filter((a) => a.resultado === "Vacía").length });
      };
      const pren = animales.filter((a) => a.resultado === "Preñada").length;
      const vac = animales.length - pren;
      const caravanasRepetidas = (() => {
        const conteo = {};
        animales.forEach((a) => { if (a.caravana) conteo[a.caravana] = (conteo[a.caravana] || 0) + 1; });

          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
            <div style={{ background: T.goldSoft, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>

              <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, textTransform: "uppercase" }}>Preñadas</div>
            </div>
            <div style={{ background: "#F4DCCF", borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
              <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 26, color: T.rust, lineHeight: 1.1 }}>{vac}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.rust, textTransform: "uppercase" }}>Vacías</div>
            </div>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
              <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 26, color: T.ink, lineHeight: 1.1 }}>{animales.length}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Total</div>
            </div>
          </div>
          {caravanasRepetidas.size > 0 && (
            <div style={{ marginBottom: 8 }}>
              <span style={{ background: T.rust, color: "#fff", padding: "3px 10px", borderRadius: 20, fontSize: 13, fontWeight: 700 }}>
                ⚠ {caravanasRepetidas.size} caravana{caravanasRepetidas.size > 1 ? "s" : ""} repetida{caravanasRepetidas.size > 1 ? "s" : ""}
              </span>
            </div>
          )}
          {animales.length > 0 && (
            <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8 }}>
              {[...animales].reverse().map((a) => {
                const repetida = a.caravana && caravanasRepetidas.has(a.caravana);
                return (
                  <div key={a.id} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 13px",
                    borderBottom: `1px solid ${T.line}`, fontSize: 15, background: repetida ? "#E7C9B7" : "transparent",

                    <span style={{ color: repetida ? T.rust : T.ink, fontWeight: repetida ? 700 : 400 }}>{a.caravana || "s/n"}{repetida ? " ⚠" : ""}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: a.resultado === "Preñada" ? T.gold : T.rust, fontWeight: 700 }}>{a.resultado}</span>
                      <button onClick={() => borrarAnimal(a.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={16} /></button>
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
