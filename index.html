                        <select value={f.gestacionInformeId && f.gestacionRodeoId ? `${f.gestacionInformeId}|${f.gestacionRodeoId}` : ""} onChange={(e) => {
                          if (!e.target.value) { actualizarFila(f.id, { gestacionInformeId: "", gestacionRodeoId: "" }); return; }
                          const [infId, rodeoId] = e.target.value.split("|");
                          const op = opcionesVinculo.find((o) => o.infId === infId && o.rodeoId === rodeoId);
                          actualizarFila(f.id, {
                            gestacionInformeId: infId, gestacionRodeoId: rodeoId,
                            rodeo: f.rodeo || op.rodeo.nombre || op.rodeo.categoria || "",
                            totalRodeo: op ? String(op.stats.prenadas) : f.totalRodeo,
                          });
                        }} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, margin: "4px 0 8px", background: "#fff" }}>
                          <option value="">Sin vincular</option>
                          {opcionesVinculo.map((o) => (
                            <option key={`${o.infId}|${o.rodeoId}`} value={`${o.infId}|${o.rodeoId}`}>
                              {(o.inf.nombre || o.inf.establecimiento)} · {o.inf.fecha} · {o.rodeo.nombre || o.rodeo.categoria || "Rodeo"} ({o.stats.prenadas} preñ.)
                            </option>
                          ))}
                        </select>
                        {vinculo && (
                          <div style={{ fontSize: 13, color: T.teal, marginBottom: 8 }}>
                            Diagnóstico original ({vinculo.inf.fecha}): {vinculo.stats.cantidad} tactadas, {vinculo.stats.prenadas} preñadas ({pct(vinculo.stats.prenadas, vinculo.stats.cantidad)}%) — se tomaron esas {vinculo.stats.prenadas} preñadas como "Total del rodeo" para este re-tacto
                          </div>
                        )}
                      </React.Fragment>
                    )}

                    <label style={{ fontSize: 13, color: T.inkSoft }}>Rodeo(s) revisado(s)</label>
                    <input value={f.rodeo} onChange={(e) => actualizarFila(f.id, { rodeo: e.target.value })} placeholder="Ej: Vaquillonas 1° parto Bf/Bc"
                      style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, margin: "4px 0 8px", background: "#fff" }} />

                    <label style={{ fontSize: 13, color: T.inkSoft }}>Forma de carga</label>
                    <div style={{ display: "flex", gap: 6, margin: "6px 0 10px" }}>
                      <button onClick={() => actualizarFila(f.id, { modoCarga: "rapida" })} style={{
                        flex: 1, padding: "10px 6px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                        border: `1.5px solid ${f.modoCarga === "rapida" ? T.teal : T.line}`, background: f.modoCarga === "rapida" ? T.tealSoft : "#fff", color: T.teal,
                        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                      }}><Zap size={15} /> Rápida (a campo)</button>
                      <button onClick={() => actualizarFila(f.id, { modoCarga: "totales" })} style={{
                        flex: 1, padding: "10px 6px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                        border: `1.5px solid ${f.modoCarga !== "rapida" ? T.teal : T.line}`, background: f.modoCarga !== "rapida" ? T.tealSoft : "#fff", color: T.teal,
                        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                      }}><ListChecks size={15} /> Totales a mano</button>
                    </div>

                    {f.modoCarga === "rapida" ? (
                      <FilaMermaQuickEntry fila={f} onChange={(patch) => actualizarFila(f.id, patch)} />
                    ) : (
                      <React.Fragment>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                          <div><label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad de tactadas</label>
                            <input type="number" inputMode="numeric" value={f.tactadas} onChange={(e) => actualizarFila(f.id, { tactadas: e.target.value })}
                              style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, background: "#fff" }} /></div>
                          <div><label style={{ fontSize: 13, color: T.inkSoft }}>Total del rodeo</label>
                            <input type="number" inputMode="numeric" value={f.totalRodeo} onChange={(e) => actualizarFila(f.id, { totalRodeo: e.target.value })}
                              style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, background: "#fff" }} /></div>
                        </div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad vacías</label>
                        <input type="number" inputMode="numeric" value={f.vacias} onChange={(e) => actualizarFila(f.id, { vacias: e.target.value })}
                          style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, margin: "4px 0 10px", background: "#fff" }} />
                      </React.Fragment>
                    )}
                    {f.modoCarga === "rapida" && (
                      <div style={{ marginTop: 8 }}>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Total del rodeo</label>
                        <input type="number" inputMode="numeric" value={f.totalRodeo} onChange={(e) => actualizarFila(f.id, { totalRodeo: e.target.value })}
                          style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16, margin: "4px 0 10px", background: "#fff" }} />
                      </div>
                    )}
                    {(f.tactadas || f.totalRodeo || f.vacias) && (
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: T.inkSoft, padding: "6px 2px 0", borderTop: `1px solid ${T.line}` }}>
                        <span>% Rodeo tactado: <b style={{ color: T.ink }}>{pct2(tact, tot)}%</b></span>
                        <span>% Merma: <b style={{ color: colorMerma(merma) }}>{merma}%</b></span>
                      </div>
                    )}
                  </div>
                );
              })}
              <button onClick={agregarFila} style={{ width: "100%", minWidth: 0, background: "none", border: `1.5px dashed ${T.teal}`, color: T.teal, borderRadius: 10, padding: "12px", fontWeight: 700, fontSize: 15, cursor: "pointer", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <Plus size={17} /> Agregar fila
              </button>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginBottom: 16 }}>
                <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: T.ink, lineHeight: 1.1 }}>{st.totalTactadas}</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft }}>tactadas</div>
                </div>
                <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: T.ink, lineHeight: 1.1 }}>{st.pctTactado}%</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft }}>del rodeo</div>
                </div>
                <div style={{ background: T.card, border: `1.5px solid ${colorMerma(st.pctMerma)}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: colorMerma(st.pctMerma), lineHeight: 1.1 }}>{st.pctMerma}%</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: colorMerma(st.pctMerma) }}>% merma</div>
                </div>
              </div>

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Notas (opcional)</label>
              <textarea value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Ej: Además se realizó tuberculinización a las 217 vacas del rodeo de El Gramillal el 12-9-25"
                style={{ width: "100%", minWidth: 0, boxSizing: "border-box", background: "#fff", border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, margin: "6px 0 20px", fontSize: 14.5, color: T.ink, minHeight: 80 }} />

              <button onClick={guardarAvance} style={{ width: "100%", minWidth: 0, background: "none", border: `1.5px solid ${T.teal}`, color: T.teal, borderRadius: 8, padding: "13px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", marginBottom: 8 }}>
                Guardar avance (sin cerrar el informe)
              </button>
              {ultimoGuardado && (
                <div style={{ textAlign: "center", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
                  ✓ Guardado automáticamente {new Date(ultimoGuardado).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
                </div>
              )}
              <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
            </div>
          </div>
        );
      }

      // vista === "lista"
      return (
        <div>
          <div style={{ padding: "0 16px 4px" }}>
            <Membrete width={190} />
          </div>
          <div style={{ padding: "0 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>Tactos Merma</div>
              <div style={{ fontSize: 15, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "12px 18px", fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
              <Plus size={17} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <Percent size={44} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de tactos merma para este cliente.</div>
              </div>
            )}
            {Object.entries(
              propios.reduce((acc, inf) => {
                const key = inf.establecimiento || "Sin establecimiento";
                (acc[key] = acc[key] || []).push(inf);
                return acc;
              }, {})
            ).sort((a, b) => a[0].localeCompare(b[0])).map(([estab, lista]) => {
              const abierto = establecimientoAbierto === estab;
              return (
                <div key={estab} style={{ marginBottom: 14 }}>
                  <button onClick={() => setEstablecimientoAbierto(abierto ? null : estab)} style={{
                    width: "100%", minWidth: 0, background: T.tealSoft, border: `1.5px solid ${T.teal}`, borderRadius: 12,
                    padding: "13px 15px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer",
                  }}>
                    <div style={{ textAlign: "left" }}>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.teal }}>{estab}</div>
                      <div style={{ fontSize: 13.5, color: T.inkSoft }}>{lista.length} informe{lista.length !== 1 ? "s" : ""}</div>
                    </div>
                    {abierto ? <ChevronUp size={20} style={{ color: T.teal }} /> : <ChevronDown size={20} style={{ color: T.teal }} />}
                  </button>
                  {abierto && (
                    <div style={{ marginTop: 10 }}>
                      {[...lista].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => {
                        const st = statsTactosMerma(inf);
                        return (
                          <div key={inf.id} onClick={() => abrirReporte(inf)} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12, cursor: "pointer" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                              <div>
                                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>Tacto seriado {inf.anio}</div>
                                <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.fecha}{inf.cargadoPor && <span style={{ fontStyle: "italic" }}> · {inf.cargadoPor}</span>}</div>
                                <div style={{ fontSize: 15, fontWeight: 700, marginTop: 4, color: colorMerma(st.pctMerma) }}>{st.pctMerma}% merma · {st.totalTactadas} tactadas</div>
                              </div>
                              <div style={{ display: "flex", gap: 10 }} onClick={(ev) => ev.stopPropagation()}>
                                <button onClick={() => exportarExcelTactosMerma(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                                <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                                <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SangradosView({ cliente, informes, guardar, borrar, estadoSync, todosInformes = [] }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const [viendoId, setViendoId] = useState(null);
      const [ultimoGuardado, setUltimoGuardado] = useState(null);
      const [establecimientoAbierto, setEstablecimientoAbierto] = useState(null);

      const vacio = () => ({
        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",
        fecha: todayISO(),
        numero: "",
        animales: [],
      });
      const [form, setForm] = useState(vacio());
      const propios = informes.filter((i) => i.clienteId === cliente.id);

      // Estado del "tablero" de carga rápida
      const [campo, setCampo] = useState({ tubo: "", caravana: "", caravanaElectronica: "", raza: "", categoria: "" });
      const [repetirRaza, setRepetirRaza] = useState(true);
      const [repetirCategoria, setRepetirCategoria] = useState(true);
      const [editandoAnimalId, setEditandoAnimalId] = useState(null);

      const abrirNuevo = () => {
        const v = vacio(); const id = uid();
        v.numero = String(proximoNumero(todosInformes, v.fecha));
        setEditando(id); setForm(v); setVista("form"); setUltimoGuardado(null);
        setCampo({ tubo: "", caravana: "", caravanaElectronica: "", raza: "", categoria: "" });
        setEditandoAnimalId(null);
      };
      const abrirEditar = (inf) => {
        setEditando(inf.id);
        setForm({ ...inf, animales: inf.animales || [] });
        setVista("form"); setUltimoGuardado(null);
        setCampo({ tubo: "", caravana: "", caravanaElectronica: "", raza: "", categoria: "" });
        setEditandoAnimalId(null);
      };
      const hayContenido = (f) => (f.animales || []).length > 0;
      useEffect(() => {
        if (vista !== "form" || !editando || !hayContenido(form)) return;
        const t = setTimeout(() => { guardar({ ...form, id: editando, clienteId: cliente.id }); setUltimoGuardado(Date.now()); }, 2500);
        return () => clearTimeout(t);
      }, [form, editando, vista]);
      const guardarAvance = () => {
        if (!editando || !hayContenido(form)) return;
        guardar({ ...form, id: editando, clienteId: cliente.id });
        setUltimoGuardado(Date.now());
      };
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || String(proximoNumero(todosInformes, form.fecha));
        const idFinal = editando || uid();
        guardar({ ...form, numero: numeroFinal, id: idFinal, clienteId: cliente.id });
        setViendoId(idFinal);
        setVista("reporte");
      };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) borrar(id); };
      const abrirReporte = (inf) => { setViendoId(inf.id); setVista("reporte"); };

      const siguienteTubo = (t) => {
        const n = parseInt(t, 10);
        if (!t || isNaN(n)) return "";
        return String(n + 1);
      };
      const agregarAnimal = () => {
        if (!campo.tubo && !campo.caravana && !campo.caravanaElectronica) return;
        if (editandoAnimalId) {
          setForm({ ...form, animales: form.animales.map((a) => (a.id === editandoAnimalId ? { ...a, ...campo } : a)) });
          setEditandoAnimalId(null);
          setCampo({ tubo: "", caravana: "", caravanaElectronica: "", raza: repetirRaza ? campo.raza : "", categoria: repetirCategoria ? campo.categoria : "" });
          return;
        }
        const nuevo = { id: uid(), ...campo };
        setForm({ ...form, animales: [...form.animales, nuevo] });
        playBeep("positivo");
        setCampo({
          tubo: siguienteTubo(campo.tubo),
          caravana: "", caravanaElectronica: "",
          raza: repetirRaza ? campo.raza : "",
          categoria: repetirCategoria ? campo.categoria : "",
        });
      };
      const editarAnimal = (a) => {
        setEditandoAnimalId(a.id);
        setCampo({ tubo: a.tubo || "", caravana: a.caravana || "", caravanaElectronica: a.caravanaElectronica || "", raza: a.raza || "", categoria: a.categoria || "" });
      };
      const cancelarEdicionAnimal = () => {
        setEditandoAnimalId(null);
        setCampo({ tubo: "", caravana: "", caravanaElectronica: "", raza: "", categoria: "" });
      };
      const quitarAnimal = (id) => {
        setForm({ ...form, animales: form.animales.filter((a) => a.id !== id) });
        if (editandoAnimalId === id) cancelarEdicionAnimal();
      };

      const informeMostrado = informes.find((i) => i.id === viendoId) || null;

      if (vista === "reporte" && informeMostrado) {
        const inf = informeMostrado;
        const animales = inf.animales || [];
        const porCategoria = {};
        animales.forEach((a) => { const c = a.categoria || "Sin categoría"; porCategoria[c] = (porCategoria[c] || 0) + 1; });
        return (
          <div>
            <div style={{ padding: "16px 16px 4px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <ChevronDown size={19} style={{ transform: "rotate(90deg)" }} /> Volver
              </button>
              <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <Pencil size={18} /> Editar
              </button>
            </div>
            <div style={{ padding: "0 16px 90px" }}>
              <div style={{ padding: "0 0 4px" }}><Membrete width={190} /></div>
              <div style={{ textAlign: "center", marginBottom: 4 }}>
                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 20, color: T.ink }}>
                  Sangrados {inf.establecimiento}
                </div>
                <div style={{ fontSize: 14, color: T.inkSoft }}>
                  {inf.fecha}{inf.numero ? ` · N° ${inf.numero}` : ""}
                </div>
              </div>

              <div style={{ display: "flex", gap: 8, margin: "14px 0", flexWrap: "wrap" }}>
                <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 16px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: T.ink }}>{animales.length}</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Total muestras</div>
                </div>
                {CATEGORIAS_SANGRADO.filter((c) => porCategoria[c]).map((c) => (
                  <div key={c} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 16px", textAlign: "center" }}>
                    <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: T.teal }}>{porCategoria[c]}</div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>{c}</div>
                  </div>
                ))}
              </div>

              <table style={{ width: "100%", borderCollapse: "collapse", margin: "14px 0", fontSize: 13 }}>
                <thead>
                  <tr style={{ background: T.gold, color: "#fff" }}>
                    {["N° tubo", "Caravana", "Caravana elect.", "Raza", "Categoría"].map((h) => (
                      <th key={h} style={{ padding: "8px 6px", textAlign: "center", fontWeight: 700 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {animales.map((a, i) => (
                    <tr key={a.id || i} style={{ background: i % 2 ? T.card : "transparent", borderBottom: `1px solid ${T.line}` }}>
                      <td style={{ padding: "7px 6px", textAlign: "center", fontWeight: 700 }}>{a.tubo || "-"}</td>
                      <td style={{ padding: "7px 6px", textAlign: "center" }}>{a.caravana || "-"}</td>
                      <td style={{ padding: "7px 6px", textAlign: "center" }}>{a.caravanaElectronica || "-"}</td>
                      <td style={{ padding: "7px 6px", textAlign: "center" }}>{normalizarRaza(a.raza) || "-"}</td>
                      <td style={{ padding: "7px 6px", textAlign: "center" }}>{a.categoria || "-"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                <button onClick={() => generarPDFSangrados(inf, cliente)} style={{ flex: 1, background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "14px", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
                  Descargar PDF
                </button>
                <button onClick={() => exportarExcelSangrados(inf, cliente)} style={{ background: "none", border: `1.5px solid ${T.gold}`, color: T.gold, borderRadius: 10, padding: "14px 16px", cursor: "pointer" }}>
                  <Download size={19} />
                </button>
                <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: `1.5px solid ${T.rust}`, color: T.rust, borderRadius: 10, padding: "14px 16px", cursor: "pointer" }}>
                  <Trash2 size={19} />
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (vista === "form") {
        return (
          <div>
            {estadoSync && <EstadoConexion estado={estadoSync} />}
            <div style={{ padding: "16px 16px 90px" }}>

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: T.gold }}>Editando muestra existente</span>

                <label style={{ fontSize: 13, color: T.inkSoft }}>Caravana electrónica</label>

                    border: `1.5px solid ${repetirRaza ? T.teal : T.line}`, background: repetirRaza ? T.tealSoft : "#fff", color: repetirRaza ? T.teal : T.inkSoft,

                </div>

                <div style={{ display: "flex", alignItems: "flex-end", gap: 8, marginBottom: 12 }}>
                  <div style={{ flex: 1 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Categoría</label>
                    <select value={campo.categoria} onChange={(e) => setCampo({ ...campo, categoria: e.target.value })}

                  </div>
                  <button onClick={() => setRepetirCategoria(!repetirCategoria)} title="Repetir esta categoría en las próximas muestras" style={{
                    flexShrink: 0, padding: "10px 12px", borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: "pointer",
                    border: `1.5px solid ${repetirCategoria ? T.teal : T.line}`, background: repetirCategoria ? T.tealSoft : "#fff", color: repetirCategoria ? T.teal : T.inkSoft,

                </div>

                <button onClick={agregarAnimal} style={{ width: "100%", minWidth: 0, background: editandoAnimalId ? T.gold : T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "14px", fontWeight: 700, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                  {editandoAnimalId ? (<React.Fragment><Pencil size={17} /> Guardar cambios</React.Fragment>) : (<React.Fragment><Plus size={18} /> Agregar</React.Fragment>)}
                </button>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Muestras cargadas · {form.animales.length}</div>
              </div>
              {form.animales.length > 0 && (
                <div style={{ maxHeight: 280, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8, marginBottom: 16 }}>
                  {[...form.animales].reverse().map((a) => (
                    <div key={a.id} onClick={() => editarAnimal(a)} style={{
                      display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 13px",
                      borderBottom: `1px solid ${T.line}`, fontSize: 14.5, cursor: "pointer",
                      background: editandoAnimalId === a.id ? T.goldSoft : "transparent",
                    }}>
                      <span>
                        <b>{a.tubo || "s/tubo"}</b>{a.caravana ? ` · ${a.caravana}` : ""}{a.caravanaElectronica ? ` · ${a.caravanaElectronica}` : ""}
                        <span style={{ color: T.inkSoft }}>{(a.raza || a.categoria) ? ` · ${[normalizarRaza(a.raza), a.categoria].filter(Boolean).join(" · ")}` : ""}</span>
                      </span>
                      <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <Pencil size={15} style={{ color: T.teal, flexShrink: 0 }} />
                        <button onClick={(ev) => { ev.stopPropagation(); quitarAnimal(a.id); }} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={16} /></button>
                      </span>
                    </div>
                  ))}
                </div>
              )}

              <button onClick={guardarAvance} style={{ width: "100%", minWidth: 0, background: "none", border: `1.5px solid ${T.teal}`, color: T.teal, borderRadius: 8, padding: "13px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", marginBottom: 8 }}>
                Guardar avance (sin cerrar el informe)
              </button>
              {ultimoGuardado && (
                <div style={{ textAlign: "center", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
                  ✓ Guardado automáticamente {new Date(ultimoGuardado).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
                </div>
              )}
              <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
            </div>
          </div>
        );
      }

      // vista === "lista"
      return (
        <div>
          <div style={{ padding: "0 16px 4px" }}>
            <Membrete width={190} />
          </div>
          <div style={{ padding: "0 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>Sangrados</div>
              <div style={{ fontSize: 15, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "12px 18px", fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
              <Plus size={17} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <Droplet size={44} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de sangrados para este cliente.</div>
              </div>
            )}
            {Object.entries(
              propios.reduce((acc, inf) => {
                const key = inf.establecimiento || "Sin establecimiento";
                (acc[key] = acc[key] || []).push(inf);
                return acc;
              }, {})
            ).sort((a, b) => a[0].localeCompare(b[0])).map(([estab, lista]) => {
              const abierto = establecimientoAbierto === estab;
              return (
                <div key={estab} style={{ marginBottom: 14 }}>
                  <button onClick={() => setEstablecimientoAbierto(abierto ? null : estab)} style={{
                    width: "100%", minWidth: 0, background: T.tealSoft, border: `1.5px solid ${T.teal}`, borderRadius: 12,
                    padding: "13px 15px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer",
                  }}>
                    <div style={{ textAlign: "left" }}>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.teal }}>{estab}</div>
                      <div style={{ fontSize: 13.5, color: T.inkSoft }}>{lista.length} informe{lista.length !== 1 ? "s" : ""}</div>
                    </div>
                    {abierto ? <ChevronUp size={20} style={{ color: T.teal }} /> : <ChevronDown size={20} style={{ color: T.teal }} />}
                  </button>
                  {abierto && (
                    <div style={{ marginTop: 10 }}>
                      {[...lista].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => (
                        <div key={inf.id} onClick={() => abrirReporte(inf)} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12, cursor: "pointer" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                            <div>
                              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>Sangrados</div>
                              <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.fecha}{inf.cargadoPor && <span style={{ fontStyle: "italic" }}> · {inf.cargadoPor}</span>}</div>
                              <div style={{ fontSize: 15, fontWeight: 700, marginTop: 4, color: T.teal }}>{(inf.animales || []).length} muestras</div>
                            </div>
                            <div style={{ display: "flex", gap: 10 }} onClick={(ev) => ev.stopPropagation()}>
                              <button onClick={() => exportarExcelSangrados(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                              <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                              <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* El bastón lector de caravanas a veces mete un espacio en medio del número (ej: "982 000123456789")
       en lugar de tipearlo corrido. limpiarCodigo saca TODOS los espacios (no solo los de los bordes),
       para que el RP/caravana/electrónica quede siempre como un solo bloque, se haya escaneado bien o no. */
    function limpiarCodigo(v) {
      return String(v || "").replace(/\s+/g, "");
    }
    /* Junta, para un mismo cliente, todos los registros individuales (por RP/caravana/electrónica) que aparecen
       dispersos en los distintos módulos, y arma una línea de tiempo. Normaliza el texto de búsqueda para que
       "123", " 123 " o "0123" puedan encontrarse entre sí sin ser demasiado permisivo. */
    function normalizarId(v) {
      return limpiarCodigo(v).toUpperCase().replace(/^0+(?=\d)/, "");
    }
    function buscarFichaAnimal({ termino, clienteId, preservicios, andrologicos, calidadSeminal, sangrados, gestaciones, torosBase }) {
      const t = normalizarId(termino);
      if (!t) return [];
      const coincide = (...valores) => valores.some((v) => v && normalizarId(v) === t);
      const eventos = [];

      (preservicios || []).filter((i) => i.clienteId === clienteId && i.modoCarga === "rapida").forEach((inf) => {
        (inf.animales || []).forEach((a) => {
          if (!coincide(a.rp, a.electronica)) return;
          eventos.push({
            fecha: inf.fecha, modulo: "Preservicio", color: T.teal, establecimiento: inf.establecimiento,
            resumen: `${a.resultado || "-"}${a.motivo ? ` · ${a.motivo}` : ""}${a.gdr ? ` · GDR${a.gdr}` : ""}${a.raza ? ` · ${normalizarRaza(a.raza)}` : ""}`,
          });
        });
      });

      (andrologicos || []).filter((i) => i.clienteId === clienteId).forEach((inf) => {
        (inf.toros || []).forEach((tt) => {
          if (!coincide(tt.rp, tt.electronica)) return;
          const est = ESTADOS_TORO.find((e) => e.v === tt.estado);
          eventos.push({
            fecha: inf.fecha, modulo: "Andrológico", color: T.gold, establecimiento: inf.establecimiento,
            resumen: `${(est && est.label) || tt.estado || "-"}${tt.motivoDescarte ? ` · ${tt.motivoDescarte}` : ""}${tt.ce ? ` · CE ${tt.ce}cm` : ""}${tt.raza ? ` · ${normalizarRaza(tt.raza)}` : ""}`,
          });
        });
      });

      (calidadSeminal || []).filter((i) => i.clienteId === clienteId).forEach((inf) => {
        (inf.muestras || []).forEach((m) => {
          if (!coincide(m.identificacion, m.electronica)) return;
          eventos.push({
            fecha: inf.fecha, modulo: "Calidad Seminal", color: T.rust, establecimiento: inf.establecimiento,
            resumen: `${m.resultado || "-"}${m.mt ? ` · MT ${m.mt}%` : ""}${m.mp ? ` · MP ${m.mp}%` : ""}${m.raza ? ` · ${normalizarRaza(m.raza)}` : ""}`,
          });
        });
      });

      (sangrados || []).filter((i) => i.clienteId === clienteId).forEach((inf) => {
        (inf.animales || []).forEach((a) => {
          if (!coincide(a.caravana, a.caravanaElectronica, a.tubo)) return;
          eventos.push({
            fecha: inf.fecha, modulo: "Sangrados", color: T.ink, establecimiento: inf.establecimiento,
            resumen: `${a.categoria || "-"}${a.raza ? ` · ${normalizarRaza(a.raza)}` : ""}${a.tubo ? ` · Tubo ${a.tubo}` : ""}`,
          });
        });
      });

      (gestaciones || []).filter((i) => i.clienteId === clienteId).forEach((inf) => {
        (inf.rodeos || []).filter((r) => r.modoCarga === "rapida").forEach((r) => {
          (r.animales || []).forEach((a) => {
            if (!coincide(a.caravana)) return;
            eventos.push({
              fecha: inf.fecha, modulo: "Gestación", color: T.teal, establecimiento: inf.establecimiento,
              resumen: `${a.resultado || "-"}${a.distribucion ? ` · ${a.distribucion}` : ""} · ${r.categoria || ""}`,
            });
          });
        });
      });

      eventos.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

      const base = (torosBase || []).find((b) => b.clienteId === clienteId && coincide(b.rp, b.electronica)) || null;
      return { eventos, base };
    }

    function FichaAnimalView({ cliente, preservicios, andrologicos, calidadSeminal, sangrados, gestaciones, torosBase }) {
      const [termino, setTermino] = useState("");
      const [buscado, setBuscado] = useState("");
      const resultado = buscado ? buscarFichaAnimal({ termino: buscado, clienteId: cliente.id, preservicios, andrologicos, calidadSeminal, sangrados, gestaciones, torosBase }) : null;

      return (
        <div>
          <div style={{ padding: "0 16px 4px" }}><Membrete width={190} /></div>
          <div style={{ padding: "0 16px 8px" }}>
            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>Ficha del animal</div>
            <div style={{ fontSize: 15, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
              <input value={termino} onChange={(e) => setTermino(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") setBuscado(termino); }}
                placeholder="RP, caravana o electrónica"
                style={{ flex: 1, minWidth: 0, boxSizing: "border-box", padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, background: "#fff" }} />
              <button onClick={() => setBuscado(termino)} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "0 20px", fontWeight: 700, cursor: "pointer" }}>
                Buscar
              </button>
            </div>

            {buscado && resultado && resultado.eventos.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                No se encontraron registros individuales con "{buscado}" para este cliente.
                <div style={{ fontSize: 12.5, marginTop: 8 }}>
                  (Sólo aparecen acá los informes cargados en modo "Rápida a campo" o con planilla individual, no los totales agregados a mano.)
                </div>
              </div>
            )}

            {resultado && resultado.base && (
              <div style={{ background: T.goldSoft, border: `1.5px solid ${T.gold}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, textTransform: "uppercase", marginBottom: 4 }}>Ficha base (toro)</div>
                <div style={{ fontSize: 15, color: T.ink }}>
                  RP {resultado.base.rp || "-"} · {normalizarRaza(resultado.base.raza) || "-"} · {resultado.base.establecimiento || "-"}
                  {resultado.base.origen ? ` · Origen: ${resultado.base.origen}` : ""}
                </div>
              </div>
            )}

            {resultado && resultado.eventos.length > 0 && (
              <React.Fragment>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>
                  {resultado.eventos.length} registro{resultado.eventos.length !== 1 ? "s" : ""} encontrado{resultado.eventos.length !== 1 ? "s" : ""}
                </div>
                <div style={{ position: "relative", paddingLeft: 4 }}>
                  {resultado.eventos.map((ev, i) => (
                    <div key={i} style={{ display: "flex", gap: 12, marginBottom: 14 }}>
                      <div style={{ flexShrink: 0, width: 10, paddingTop: 4 }}>
                        <div style={{ width: 10, height: 10, borderRadius: "50%", background: ev.color }} />
                      </div>
                      <div style={{ flex: 1, background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 13px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 2 }}>
                          <span style={{ fontWeight: 700, color: ev.color }}>{ev.modulo}</span>
                          <span style={{ color: T.inkSoft }}>{ev.fecha}</span>
                        </div>
                        <div style={{ fontSize: 14.5, color: T.ink }}>{ev.resumen}</div>
                        <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: 2 }}>{ev.establecimiento}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </React.Fragment>
            )}

            {!buscado && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                Buscá por RP, caravana o caravana electrónica para ver el historial completo del animal en todos los módulos.
              </div>
            )}
          </div>
        </div>
      );
    }

    /* Indicadores reproductivos cruzando módulos, por establecimiento y año */
    /* Calcula los mismos indicadores que se muestran en IndicadoresView, pero para un establecimiento puntual.
       Se reutiliza tanto para la vista de "un establecimiento" como para el comparativo entre varios. */
    function calcularIndicadoresEst({ clienteId, establecimiento, anio, gestaciones, preservicios, tactosMerma }) {
      const gestAnio = (gestaciones || []).filter((i) => i.clienteId === clienteId && i.establecimiento === establecimiento && anioDeInforme(i) === anio);
      const presAnio = (preservicios || []).filter((i) => i.clienteId === clienteId && i.establecimiento === establecimiento && anioDeInforme(i) === anio);
      const mermaAnio = (tactosMerma || []).filter((i) => i.clienteId === clienteId && i.establecimiento === establecimiento && anioDeInforme(i) === anio);

      const totPrenez = { cantidad: 0, prenadas: 0 };
      const porTipoServicio = {};
      gestAnio.forEach((inf) => (inf.rodeos || []).forEach((r) => {
        const s = statsRodeo(r);
        totPrenez.cantidad += s.cantidad; totPrenez.prenadas += s.prenadas;
        const tipo = r.tipoServicio || "Sin especificar";
        if (!porTipoServicio[tipo]) porTipoServicio[tipo] = { cantidad: 0, prenadas: 0 };
        porTipoServicio[tipo].cantidad += s.cantidad; porTipoServicio[tipo].prenadas += s.prenadas;
      }));

      const totPres = { revisadas: 0, aptas: 0 };
      const motivos = { "Pelvimetría": 0, "GDR": 0, "Tamaño": 0, "Preñada": 0, "Otras": 0 };
      presAnio.forEach((inf) => {
        const s = statsPreservicio(inf);
        totPres.revisadas += s.revisadas; totPres.aptas += s.aptas;
        motivos["Pelvimetría"] += s.descPelvimetria || 0; motivos["GDR"] += s.descGdr || 0;
        motivos["Tamaño"] += s.descTamano || 0; motivos["Preñada"] += s.descPrenada || 0; motivos["Otras"] += s.descOtras || 0;
      });

      const totMerma = { tactadas: 0, vacias: 0 };
      mermaAnio.forEach((inf) => { const s = statsTactosMerma(inf); totMerma.tactadas += s.totalTactadas; totMerma.vacias += s.totalVacias; });

      return { totPrenez, porTipoServicio, totPres, motivos, totMerma };
    }

    function statsPreservicio(f) {
      if (f.modoCarga === "rapida") {
        const animales = f.animales || [];
        const conteo = { "Pelvimetría": 0, "GDR": 0, "Tamaño": 0, "Preñada": 0, "Otras": 0 };
        animales.forEach((a) => { if (a.resultado === "Descarte" && a.motivo) conteo[a.motivo] = (conteo[a.motivo] || 0) + 1; });
        const gdrConteo = { 1: 0, 2: 0, 3: 0, 4: 0 };
        animales.forEach((a) => { if (a.resultado === "Apta" && a.gdr) gdrConteo[a.gdr] = (gdrConteo[a.gdr] || 0) + 1; });
        return {
          revisadas: animales.length, aptas: animales.filter((a) => a.resultado === "Apta").length,
          descPelvimetria: conteo["Pelvimetría"], descGdr: conteo["GDR"], descTamano: conteo["Tamaño"], descPrenada: conteo["Preñada"], descOtras: conteo["Otras"],
          gdr1: gdrConteo[1], gdr2: gdrConteo[2], gdr3: gdrConteo[3], gdr4: gdrConteo[4],
        };
      }
      return {
        revisadas: parseFloat(f.revisadas) || 0, aptas: parseFloat(f.aptas) || 0,
        descPelvimetria: parseFloat(f.descPelvimetria) || 0, descGdr: parseFloat(f.descGdr) || 0,
        descTamano: parseFloat(f.descTamano) || 0, descPrenada: parseFloat(f.descPrenada) || 0, descOtras: parseFloat(f.descOtras) || 0,
        gdr1: parseFloat(f.gdr1) || 0, gdr2: parseFloat(f.gdr2) || 0, gdr3: parseFloat(f.gdr3) || 0, gdr4: parseFloat(f.gdr4) || 0,
      };
    }

                    if (!raw) return;

                    if (!grupos[k]) grupos[k] = { total: 0, aptas: 0, gdr: { 1: 0, 2: 0, 3: 0, 4: 0 } };
                    grupos[k].total += 1;
                    if (a.resultado === "Apta") {
                      grupos[k].aptas += 1;
                      if (a.gdr) grupos[k].gdr[a.gdr] = (grupos[k].gdr[a.gdr] || 0) + 1;
                    }
                  });
                  return grupos;
                };
                const gruposCC = armar("cc");
                const gruposRaza = armar("raza", normalizarRaza);
                const totalCC = Object.values(gruposCC).reduce((a, g) => a + g.total, 0);
                const totalRaza = Object.values(gruposRaza).reduce((a, g) => a + g.total, 0);
                const renderGrupo = (nombre, entradas, total) => (
                  <React.Fragment key={nombre}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>{nombre}</div>

                      {entradas.map(([clave, g], i) => (
                        <div key={clave} style={{ marginBottom: i < entradas.length - 1 ? 14 : 0 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4 }}>
                            <span>{clave}</span><span style={{ fontWeight: 700 }}>{g.total} · {pct(g.total, total)}%</span>
                          </div>
                          <div style={{ background: T.line, borderRadius: 4, height: 6, marginBottom: 6 }}>
                            <div style={{ background: T.teal, borderRadius: 4, height: 6, width: `${pct(g.total, total)}%` }} />
                          </div>
                          <div style={{ display: "flex", gap: 14, fontSize: 12.5, paddingLeft: 4, marginBottom: (g.gdr[1] + g.gdr[2] + g.gdr[3] + g.gdr[4]) > 0 ? 6 : 0 }}>
                            <span style={{ color: T.gold }}>Aptas: <b>{g.aptas}</b> ({pct(g.aptas, g.total)}%)</span>
                            <span style={{ color: T.rust }}>No aptas: <b>{g.total - g.aptas}</b> ({pct(g.total - g.aptas, g.total)}%)</span>
                          </div>
                          {(g.gdr[1] + g.gdr[2] + g.gdr[3] + g.gdr[4]) > 0 && (
                            <div style={{ display: "flex", gap: 12, fontSize: 12.5, color: T.inkSoft, paddingLeft: 4 }}>
                              {[1, 2, 3, 4].map((n) => g.gdr[n] > 0 && <span key={n}>GDR{n}: <b style={{ color: T.ink }}>{g.gdr[n]}</b></span>)}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </React.Fragment>
                );
                return (
                  <React.Fragment>
                    {Object.keys(gruposCC).length > 0 && renderGrupo("Condición corporal", Object.entries(gruposCC).sort((a, b) => parseFloat(a[0]) - parseFloat(b[0])), totalCC)}
                    {Object.keys(gruposRaza).length > 0 && renderGrupo("Raza", Object.entries(gruposRaza).sort((a, b) => b[1].total - a[1].total), totalRaza)}
                  </React.Fragment>
                );
              })()}
