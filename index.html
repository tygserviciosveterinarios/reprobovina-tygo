                  {p.toros.map((t) => (
                    <div key={t.id} style={{ display: "grid", gridTemplateColumns: p.toros.length > 1 ? "1fr 0.5fr auto" : "1fr auto", gap: 6, marginTop: 4, marginBottom: 4 }}>
                      <input placeholder="Nombre" value={t.nombre} onChange={(e) => actualizarToroLote(t.id, { nombre: e.target.value })} style={{ padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }} />
                      {p.toros.length > 1 && (
                        <input type="number" placeholder="Cant." value={t.cantidad} onChange={(e) => actualizarToroLote(t.id, { cantidad: e.target.value })} style={{ padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }} />
                      )}
                      {p.toros.length > 1 && (
                        <button onClick={() => quitarToroLote(t.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={17} /></button>
                      )}
                    </div>
                  ))}
                  <button onClick={agregarToroLote} style={{ background: "none", border: "none", color: T.teal, fontSize: 14.5, fontWeight: 700, cursor: "pointer", padding: "4px 0 8px", display: "flex", alignItems: "center", gap: 4 }}>
                    <Plus size={15} /> Agregar toro
                  </button>
                  {p.toros.length > 1 && (() => {
                    const suma = p.toros.reduce((a, t) => a + (parseFloat(t.cantidad) || 0), 0);
                    const total = parseFloat(p.cantidad) || 0;
                    if (!total) return null;
                    const ok = suma === total;
                    return <div style={{ fontSize: 14, marginBottom: 8, fontWeight: 600, color: ok ? T.teal : T.rust }}>
                      {ok ? "✓" : "⚠"} Suma por toro: {suma} de {total} cabezas del lote
                    </div>;
                  })()}

                  <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginTop: 4, marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Fechas y horarios</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Colocación</label>
                        <input type="date" value={p.fechaColocacion} onChange={(e) => actualizarLote(p.id, { fechaColocacion: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Fecha de retiro</label>
                        <input type="date" value={p.fechaRetiro} onChange={(e) => actualizarLote(p.id, { fechaRetiro: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Hora inicio retiro</label>
                        <input type="time" value={p.horaRetiroInicio} onChange={(e) => actualizarLote(p.id, { horaRetiroInicio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Hora fin retiro</label>
                        <input type="time" value={p.horaRetiroFin} onChange={(e) => actualizarLote(p.id, { horaRetiroFin: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                    </div>
                    <div style={{ marginBottom: 8 }}>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Fecha de IATF</label>
                      <input type="date" value={p.fechaIATF} onChange={(e) => actualizarLote(p.id, { fechaIATF: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: horas !== null ? 10 : 0 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Hora inicio IATF</label>
                        <input type="time" value={p.horaIATFInicio} onChange={(e) => actualizarLote(p.id, { horaIATFInicio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Hora fin IATF</label>
                        <input type="time" value={p.horaIATFFin} onChange={(e) => actualizarLote(p.id, { horaIATFFin: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 14.5, background: "#fff" }} />
                      </div>
                    </div>
                    {horas !== null && (
                      <div style={{ background: T.tealSoft, borderRadius: 8, padding: "11px 13px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 13, fontWeight: 700, color: T.teal }}>HORAS TRANSCURRIDAS (retiro → IATF)</span>
                        <span style={{ fontWeight: 700, fontSize: 18, color: T.teal }}>{horas} h</span>
                      </div>
                    )}
                  </div>

                  <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Resultados</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad</label>
                      <input type="number" value={p.cantidad} onChange={(e) => actualizarLote(p.id, { cantidad: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Perd. dispositivo</label>
                      <input type="number" value={p.perdidasDispositivo} onChange={(e) => actualizarLote(p.id, { perdidasDispositivo: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>No respondieron</label>
                      <input type="number" value={p.noRespondieron} onChange={(e) => actualizarLote(p.id, { noRespondieron: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                  </div>
                  {s.cant > 0 && (
                    <div style={{ fontSize: 15, fontWeight: 700, color: T.teal }}>{s.pctResp}% respuesta · {s.pctPerd}% pérdida dispositivo</div>
                  )}
                </div>
              );
            })}
            <button onClick={agregarLote} style={{ background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", width: "100%", minWidth: 0, color: T.teal, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
              <Plus size={17} /> Agregar lote
            </button>

            <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Calidad seminal</div>
            {(form.pajuelas || []).map((p, i) => (
              <div key={p.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ fontWeight: 700, color: T.ink }}>Pajuela {i + 1}</div>
                  {form.pajuelas.length > 1 && <button onClick={() => quitarPajuela(p.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={19} /></button>}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                  <input placeholder="Toro" value={p.toro} onChange={(e) => actualizarPajuela(p.id, { toro: e.target.value })} style={{ padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                  <select value={p.raza} onChange={(e) => actualizarPajuela(p.id, { raza: e.target.value })} style={{ padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                    {RAZAS.map((r) => <option key={r}>{r}</option>)}
                  </select>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                  <div><label style={{ fontSize: 13, color: T.inkSoft }}>Concentración</label>
                    <input value={p.concentracion} onChange={(e) => actualizarPajuela(p.id, { concentracion: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
                  <div><label style={{ fontSize: 13, color: T.inkSoft }}>Tamaño pajuela</label>
                    <input value={p.tamPajuela} onChange={(e) => actualizarPajuela(p.id, { tamPajuela: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                  <div><label style={{ fontSize: 13, color: T.inkSoft }}>M.T. (%)</label>
                    <input type="number" value={p.mt} onChange={(e) => actualizarPajuela(p.id, { mt: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
                  <div><label style={{ fontSize: 13, color: T.inkSoft }}>M.P. (%)</label>
                    <input type="number" value={p.mp} onChange={(e) => actualizarPajuela(p.id, { mp: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
                </div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Resultado</label>
                <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                  {["Apto", "Descarte"].map((r) => (
                    <button key={r} onClick={() => actualizarPajuela(p.id, { resultado: r })} style={{
                      flex: 1, padding: "10px 4px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                      border: `1.5px solid ${p.resultado === r ? (r === "Apto" ? T.gold : T.rust) : T.line}`,
                      background: p.resultado === r ? (r === "Apto" ? T.goldSoft : "#E7C9B7") : "#fff",
                      color: r === "Apto" ? T.gold : T.rust,
                    }}>{r}</button>
                  ))}
                </div>
                <input placeholder="Observaciones" value={p.observaciones} onChange={(e) => actualizarPajuela(p.id, { observaciones: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
              </div>
            ))}
            <button onClick={agregarPajuela} style={{ background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", width: "100%", minWidth: 0, color: T.teal, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
              <Plus size={17} /> Agregar pajuela
            </button>

            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Observaciones generales</label>
              <textarea value={form.observacionesGen} onChange={(e) => setForm({ ...form, observacionesGen: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 0", background: "#fff", minHeight: 70 }} />
            </div>

            <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
          </div>
        );
      }

      return (
        <div>
          <EstadoConexion estado={estadoSync} />
          <Membrete width={160} />
          <div style={{ padding: "19px 19px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 21, color: T.ink }}>Inseminación Artificial</div>
              <div style={{ fontSize: 14.5, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "13px 19px", fontWeight: 700, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              <Plus size={20} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <OvumSpermIcon size={38} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de IATF para este cliente.</div>
              </div>
            )}
            {[...propios].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => (
              <div key={inf.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>
                    <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.establecimiento} · {inf.fecha}</div>
                    <div style={{ fontSize: 15, color: T.teal, fontWeight: 700, marginTop: 4 }}>{totalesInforme(inf)} inseminadas</div>
                  </div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button onClick={() => exportarExcelIatf(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                    <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                    <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const ESTADOS_TORO = [
      { v: "apto", label: "Apto", color: T.gold, bg: T.goldSoft },
      { v: "tratamiento", label: "A tratamiento", color: T.teal, bg: T.tealSoft },
      { v: "descarte", label: "Descarte", color: T.rust, bg: "#E7C9B7" },
    ];
    const MOTIVOS_DESCARTE = ["Atrofia testicular", "Parálisis", "Edad", "Locomotor", "Prepucio", "Otro"];
    function claseCE(ce) {
      const v = parseFloat(ce);
      if (!v) return null;
      if (v >= 35) return { label: "Apto", color: T.gold, bg: T.goldSoft };
      if (v >= 34) return { label: "Observable", color: T.teal, bg: T.tealSoft };
      return { label: "Descartable", color: T.rust, bg: "#E7C9B7" };
    }
    function nuevoToro() {
      return {
        id: uid(), tubo: "", rp: "", electronica: "", raza: "", origen: "", rodeo: "",
        ce: "", tono: "", cc: "", estado: "apto", motivoDescarte: "", observaciones: "",
        miembroAnt: "Ok", miembroAntDetalle: "", miembroPost: "Ok", miembroPostDetalle: "",
        prepucio: "Ok", prepucioDetalle: "",
      };
    }

    function buscarEnBase(torosBase, clienteId, rp, electronica, establecimiento) {
      if (!rp && !electronica) return null;
      return torosBase.find((b) => b.clienteId === clienteId && (!establecimiento || b.establecimiento === establecimiento) && ((rp && b.rp === rp) || (electronica && b.electronica === electronica))) || null;
    }

    function TarjetaToro({ t, idx, expandido, onExpandir, onActualizar, onQuitar, sePuedeQuitar, torosBase, clienteId, establecimiento, tubosRepetidos }) {
      const est = ESTADOS_TORO.find((e) => e.v === t.estado);
      const baseCliente = torosBase.filter((b) => b.clienteId === clienteId && b.establecimiento === establecimiento);
      const match = buscarEnBase(baseCliente, clienteId, t.rp, t.electronica, establecimiento);
      const esNuevo = !match && baseCliente.length > 0 && (t.rp || t.electronica);

      const aplicarMatch = (m) => {
        if (!m) return;
        onActualizar({
          rp: m.rp || t.rp, electronica: m.electronica || t.electronica,
          raza: m.raza || t.raza, origen: m.origen || t.origen, rodeo: m.rodeo || t.rodeo,
          ce: m.ce || t.ce, tono: m.tono || t.tono, cc: m.cc || t.cc,
          estado: m.estado || t.estado, motivoDescarte: m.motivoDescarte || t.motivoDescarte,
          observaciones: m.observaciones || t.observaciones,
          miembroAnt: m.miembroAnt || t.miembroAnt, miembroAntDetalle: m.miembroAntDetalle || t.miembroAntDetalle,
          miembroPost: m.miembroPost || t.miembroPost, miembroPostDetalle: m.miembroPostDetalle || t.miembroPostDetalle,
          prepucio: m.prepucio || t.prepucio, prepucioDetalle: m.prepucioDetalle || t.prepucioDetalle,
        });
        if (m.estado === "descarte") playBeep("negativo");
      };
      /* Si se borraron RP y electrónica, limpiamos los datos que se habían traído de la base
         para no dejar pegados por error datos de otro toro */
      const limpiarSiVacio = () => {
        if (!t.rp && !t.electronica) {
          onActualizar({
            raza: "", origen: "", rodeo: "", ce: "", tono: "", cc: "", estado: "apto", motivoDescarte: "", observaciones: "",
            miembroAnt: "Ok", miembroAntDetalle: "", miembroPost: "Ok", miembroPostDetalle: "", prepucio: "Ok", prepucioDetalle: "",
          });
        }
      };

      if (!expandido) {
        return (
          <div onClick={onExpandir} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 700, color: T.ink }}>#{t.tubo || idx + 1} · RP {t.rp || "-"}</div>
              <div style={{ fontSize: 14, color: T.inkSoft }}>{t.raza}{t.rodeo ? ` · ${t.rodeo}` : ""}{t.ce ? ` · CE ${t.ce} cm${claseCE(t.ce) ? ` (${claseCE(t.ce).label})` : ""}` : ""}</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {t.tubo && tubosRepetidos.has(t.tubo) && <span style={{ background: T.rust, color: "#fff", fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>Tubo repetido</span>}
              {esNuevo && <span style={{ background: "#E7C9B7", color: T.rust, fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>Nuevo</span>}
              {est && <span style={{ background: est.bg, color: est.color, fontSize: 13, fontWeight: 700, padding: "5px 10px", borderRadius: 20 }}>{est.label}</span>}
              <ChevronDown size={21} style={{ color: T.inkSoft }} />
            </div>
          </div>
        );
      }
      return (
        <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 8 }}>
          <div onClick={onExpandir} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, cursor: "pointer" }}>
            <div style={{ fontWeight: 700, color: T.ink }}>Toro {idx + 1}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {sePuedeQuitar && <button onClick={(e) => { e.stopPropagation(); onQuitar(); }} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={19} /></button>}
              <ChevronUp size={21} style={{ color: T.inkSoft }} />
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
            <div><label style={{ fontSize: 13, color: T.inkSoft }}>N° Tubo</label>
              <input value={t.tubo} onChange={(e) => onActualizar({ tubo: e.target.value })}
                style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, fontSize: 16.5, background: "#fff",
                  border: `1.5px solid ${t.tubo && tubosRepetidos.has(t.tubo) ? T.rust : T.line}`,
                  color: t.tubo && tubosRepetidos.has(t.tubo) ? T.rust : T.ink, fontWeight: t.tubo && tubosRepetidos.has(t.tubo) ? 700 : 400,
                }} /></div>
            <div><label style={{ fontSize: 13, color: T.inkSoft }}>RP</label>
              <input value={t.rp} onChange={(e) => onActualizar({ rp: e.target.value })}
                onBlur={() => { aplicarMatch(buscarEnBase(baseCliente, clienteId, t.rp, "", establecimiento)); limpiarSiVacio(); }}
                style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
          </div>
          <div style={{ marginBottom: 8 }}><label style={{ fontSize: 13, color: T.inkSoft }}>Electrónica (caravana)</label>
            <input value={t.electronica} onChange={(e) => onActualizar({ electronica: e.target.value })}
              onBlur={() => { aplicarMatch(buscarEnBase(baseCliente, clienteId, "", t.electronica, establecimiento)); limpiarSiVacio(); }}
              style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>

          {match && match.estado === "descarte" && (
            <div style={{
              background: T.rust, borderRadius: 10, padding: "15px 17px", marginBottom: 10,
              display: "flex", alignItems: "flex-start", gap: 10, border: `2px solid ${T.ink}`,
            }}>
              <AlertTriangle size={25} style={{ color: "#fff", flexShrink: 0, marginTop: 1 }} />
              <div>
                <div style={{ color: "#fff", fontWeight: 800, fontSize: 16.5 }}>⚠ TORO DESCARTADO EN LA BASE</div>
                <div style={{ color: "#fff", fontSize: 14.5, marginTop: 3 }}>
                  {match.motivoDescarte ? `Motivo: ${match.motivoDescarte}` : ""}{match.observaciones ? ` · ${match.observaciones}` : ""}
                </div>
                <div style={{ color: "#fff", fontSize: 14, marginTop: 4, fontWeight: 600 }}>Confirmá si sigue en descarte o si cambió su condición.</div>
              </div>
            </div>
          )}
          {match && match.estado !== "descarte" && (
            <div style={{ background: T.goldSoft, borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, color: T.gold }}>
              Encontrado en la base — datos completados solos, revisá y actualizá lo que cambió.
            </div>
          )}
          {esNuevo && (
            <div style={{ background: "#E7C9B7", color: T.rust, borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700 }}>
              Toro nuevo: no está en la base cargada para este cliente.
            </div>
          )}
          {t.tubo && tubosRepetidos.has(t.tubo) && (
            <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "11px 13px", marginBottom: 10, fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={16} /> Tubo {t.tubo} repetido en este informe — revisá los toros
            </div>
          )}

          <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Datos físicos</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Raza</label>
                <input value={t.raza} onChange={(e) => onActualizar({ raza: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Origen</label>
                <input value={t.origen} onChange={(e) => onActualizar({ origen: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
            </div>
            <div style={{ marginBottom: 8 }}>
              <label style={{ fontSize: 13, color: T.inkSoft }}>Rodeo (en servicio)</label>
              <input value={t.rodeo} onChange={(e) => onActualizar({ rodeo: e.target.value })} placeholder="Ej: Rodeo 1 - Vaquillonas" style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: claseCE(t.ce) ? 4 : 0 }}>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>C.E. (cm)</label>
                <input value={t.ce} onChange={(e) => onActualizar({ ce: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>Tono</label>
                <input value={t.tono} onChange={(e) => onActualizar({ tono: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
              <div><label style={{ fontSize: 13, color: T.inkSoft }}>C.C.</label>
                <input value={t.cc} onChange={(e) => onActualizar({ cc: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} /></div>
            </div>
            {claseCE(t.ce) && (
              <span style={{ background: claseCE(t.ce).bg, color: claseCE(t.ce).color, fontSize: 13, fontWeight: 700, padding: "4px 10px", borderRadius: 20 }}>
                C.E. {claseCE(t.ce).label}
              </span>
            )}
          </div>

          <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Examen físico</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Miembro anterior</label>
                <select value={t.miembroAnt} onChange={(e) => onActualizar({ miembroAnt: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="Ok">Ok</option>
                  <option value="*">*</option>
                </select>
                {t.miembroAnt === "*" && (
                  <input value={t.miembroAntDetalle} onChange={(e) => onActualizar({ miembroAntDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
                )}
              </div>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Miembro posterior</label>
                <select value={t.miembroPost} onChange={(e) => onActualizar({ miembroPost: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                  <option value="Ok">Ok</option>
                  <option value="*">*</option>
                </select>
                {t.miembroPost === "*" && (
                  <input value={t.miembroPostDetalle} onChange={(e) => onActualizar({ miembroPostDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
                )}
              </div>
            </div>
            <div>
              <label style={{ fontSize: 13, color: T.inkSoft }}>Prepucio</label>
              <select value={t.prepucio} onChange={(e) => onActualizar({ prepucio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                <option value="Ok">Ok</option>
                <option value="*">*</option>
              </select>
              {t.prepucio === "*" && (
                <input value={t.prepucioDetalle} onChange={(e) => onActualizar({ prepucioDetalle: e.target.value })} placeholder="Detalle" style={{ width: "100%", minWidth: 0, padding: "9px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, marginTop: 6, background: "#fff" }} />
              )}
            </div>
          </div>

          <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Resultado</div>
          <label style={{ fontSize: 13, color: T.inkSoft }}>Estado</label>
          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            {ESTADOS_TORO.map((e) => (
              <button key={e.v} onClick={() => onActualizar({ estado: e.v })} style={{
                flex: 1, padding: "10px 6px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                border: `1.5px solid ${t.estado === e.v ? e.color : T.line}`, background: t.estado === e.v ? e.bg : "#fff", color: e.color,
              }}>{e.label}</button>
            ))}
          </div>
          {t.estado === "descarte" && (
            <div style={{ marginBottom: 8 }}>
              <label style={{ fontSize: 13, color: T.inkSoft }}>Motivo de descarte</label>
              <select value={t.motivoDescarte} onChange={(e) => onActualizar({ motivoDescarte: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                <option value="">Seleccionar...</option>
                {MOTIVOS_DESCARTE.map((m) => <option key={m}>{m}</option>)}
              </select>
            </div>
          )}
          <label style={{ fontSize: 13, color: T.inkSoft }}>Observaciones</label>
          <textarea value={t.observaciones} onChange={(e) => onActualizar({ observaciones: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff", minHeight: 50 }} />
        </div>
      );
    }

    function AndrologicoView({ cliente, informes, guardar, borrar, estadoSync, torosBase, guardarBase, todosInformes = [] }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const vacio = () => ({
        nombre: "", numero: "",
        fecha: new Date().toISOString().slice(0, 10),
        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",
        toros: [nuevoToro()],
      });
      const [form, setForm] = useState(vacio());
      const [expandidoId, setExpandidoId] = useState(null);

      const propios = informes.filter((i) => i.clienteId === cliente.id);
      const tubosRepetidos = (() => {
        const conteo = {};
        form.toros.forEach((t) => { if (t.tubo) conteo[t.tubo] = (conteo[t.tubo] || 0) + 1; });
        return new Set(Object.keys(conteo).filter((k) => conteo[k] > 1));
      })();
      const abrirNuevo = () => { const v = vacio(); setEditando(null); setForm(v); setExpandidoId(v.toros[0].id); setVista("form"); };
      const abrirEditar = (inf) => { setEditando(inf.id); setForm(inf); setExpandidoId(null); setVista("form"); };
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        guardar({ ...form, numero: numeroFinal, id: editando || undefined, clienteId: cliente.id });
        form.toros.forEach((t) => {
          if (!t.rp && !t.electronica) return;
          const baseCliente = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === form.establecimiento);
          const existente = buscarEnBase(baseCliente, cliente.id, t.rp, t.electronica, form.establecimiento);
          guardarBase({
            id: existente ? existente.id : undefined, clienteId: cliente.id, establecimiento: form.establecimiento,
            rp: t.rp, electronica: t.electronica, raza: t.raza, origen: t.origen, rodeo: t.rodeo,
            ce: t.ce, tono: t.tono, cc: t.cc, estado: t.estado, motivoDescarte: t.motivoDescarte, observaciones: t.observaciones,
            miembroAnt: t.miembroAnt, miembroAntDetalle: t.miembroAntDetalle,
            miembroPost: t.miembroPost, miembroPostDetalle: t.miembroPostDetalle,
            prepucio: t.prepucio, prepucioDetalle: t.prepucioDetalle,
          });
        });
        setVista("lista");
      };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) borrar(id); };

      const fileRef = useRef(null);
      const [msgImport, setMsgImport] = useState("");
      const [estabImportLista, setEstabImportLista] = useState((cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "");
      const handleImportar = async (e, estab) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        setMsgImport("Leyendo archivo...");
        try {
          const { toros: filas, headersOriginales, ceEncontrada } = await parseExcelToros(file);
          if (!filas.length) { setMsgImport("Se leyó el archivo pero no se encontraron filas con RP o electrónica."); return; }
          let count = 0;
          for (const t of filas) {
            const baseCliente = torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === estab);
            const existente = buscarEnBase(baseCliente, cliente.id, t.rp, t.electronica, estab);
            guardarBase({ id: existente ? existente.id : undefined, clienteId: cliente.id, establecimiento: estab, ...t });
            count++;
          }
          if (!ceEncontrada) {
            setMsgImport(`${count} toros importados. ⚠ No encontré la columna de C.E. Columnas detectadas: ${headersOriginales.join(" | ")}`);
          } else {
            setMsgImport(`${count} toros importados/actualizados en la base de ${estab || "este establecimiento"}.`);
          }
        } catch (err) {
          setMsgImport("No se pudo leer el archivo: " + (err.message || "error desconocido"));
        }
      };

      const actualizarToro = (id, patch) => setForm({ ...form, toros: form.toros.map((t) => t.id === id ? { ...t, ...patch } : t) });
      const agregarToro = () => { const nuevo = nuevoToro(); setForm({ ...form, toros: [...form.toros, nuevo] }); setExpandidoId(nuevo.id); };
      const quitarToro = (id) => setForm({ ...form, toros: form.toros.filter((t) => t.id !== id) });

      const resumen = (inf) => {
        const toros = inf.toros || [];
        const aptos = toros.filter((t) => t.estado === "apto").length;
        return `${aptos}/${toros.length} aptos`;
      };

      if (vista === "form") {
        return (
          <div style={{ padding: "16px 16px 90px" }}>
            <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, marginBottom: 10, cursor: "pointer", fontWeight: 700 }}>&larr; Volver</button>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10 }}>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Nombre del informe (opcional)</label>
                  <input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej: Andrológico Saravia 2026" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>N° de informe</label>
                  <input value={form.numero} onChange={(e) => setForm({ ...form, numero: e.target.value })} placeholder="Opcional" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
              </div>
              {numeroInformeDuplicado(todosInformes, form.numero, form.fecha, editando) && (
                <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "10px 12px", marginBottom: 12, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
                  <AlertTriangle size={16} /> Ya existe un informe N° {form.numero} para este año
                </div>
              )}
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Fecha</label>
              <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Establecimiento</label>
              {(cliente.establecimientos || []).length > 0 ? (
                <select value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 0", background: "#fff" }}>
                  {cliente.establecimientos.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                </select>
              ) : (
                <input value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 0", background: "#fff" }} />
              )}
            </div>

            <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={(e) => handleImportar(e, form.establecimiento)} />
            <button onClick={() => fileRef.current && fileRef.current.click()} style={{
              width: "100%", minWidth: 0, background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", marginBottom: 6,
              color: T.teal, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            }}>
              <Download size={19} style={{ transform: "rotate(180deg)" }} /> Importar toros (Excel)
            </button>
            <div style={{ fontSize: 14, color: T.inkSoft, marginBottom: 14 }}>
              {torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === form.establecimiento).length} toros en la base de {form.establecimiento || "este establecimiento"}.
              {msgImport && <span style={{ display: "block", marginTop: 4, color: T.teal, fontWeight: 600 }}>{msgImport}</span>}
            </div>

            <div style={{ fontSize: 14, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Toros examinados</div>
            {form.toros.map((t, i) => (
              <TarjetaToro key={t.id} t={t} idx={i} expandido={expandidoId === t.id}
                onExpandir={() => setExpandidoId(expandidoId === t.id ? null : t.id)}
                onActualizar={(patch) => actualizarToro(t.id, patch)}
                onQuitar={() => quitarToro(t.id)} sePuedeQuitar={form.toros.length > 1}
                torosBase={torosBase} clienteId={cliente.id} establecimiento={form.establecimiento} tubosRepetidos={tubosRepetidos} />
            ))}
            <button onClick={agregarToro} style={{ background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", width: "100%", minWidth: 0, color: T.teal, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
              <Plus size={17} /> Agregar toro
            </button>

            <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
          </div>
        );
      }

      return (
        <div>
          <EstadoConexion estado={estadoSync} />
          <Membrete width={160} />
          <div style={{ padding: "19px 19px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 21, color: T.ink }}>Examen Andrológico</div>
              <div style={{ fontSize: 14.5, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "13px 19px", fontWeight: 700, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              <Plus size={20} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 12px" }}>
            {(cliente.establecimientos || []).length > 1 && (
              <div style={{ marginBottom: 8 }}>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Establecimiento para la base de toros</label>
                <select value={estabImportLista} onChange={(e) => setEstabImportLista(e.target.value)} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                  {cliente.establecimientos.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                </select>
              </div>
            )}
            <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={(e) => handleImportar(e, estabImportLista)} />
            <button onClick={() => fileRef.current && fileRef.current.click()} style={{
              width: "100%", minWidth: 0, background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px",
              color: T.teal, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            }}>
              <Download size={19} style={{ transform: "rotate(180deg)" }} /> Importar toros (Excel)
            </button>
            <div style={{ fontSize: 14, color: T.inkSoft, marginTop: 6 }}>
              {torosBase.filter((b) => b.clienteId === cliente.id && b.establecimiento === estabImportLista).length} toros en la base de {estabImportLista || "este establecimiento"}.
              {msgImport && <span style={{ display: "block", marginTop: 4, color: T.teal, fontWeight: 600 }}>{msgImport}</span>}
            </div>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <BullIcon size={44} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay exámenes andrológicos para este cliente.</div>
              </div>
            )}
            {[...propios].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => (
              <div key={inf.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>
                    <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.establecimiento} · {inf.fecha}</div>
                    <div style={{ fontSize: 15, color: T.gold, fontWeight: 700, marginTop: 4 }}>{resumen(inf)}</div>
                  </div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button onClick={() => exportarExcelAndrologico(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                    <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                    <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BarraNav({ tab, setTab }) {
      const tabs = [
        { k: "clientes", label: "Clientes", icon: Users, activo: true },
        { k: "preservicio", label: "Preservicio", icon: ListChecks, activo: true },
        { k: "gestacion", label: "Gestación", icon: CowCalfIcon, activo: true },
        { k: "iatf", label: "IATF", icon: OvumSpermIcon, activo: true },
        { k: "andrologico", label: "Andrológico", icon: BullIcon, activo: true },
      ];
      return (
        <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", minWidth: 0, maxWidth: 900, background: T.card, borderTop: `1.5px solid ${T.line}`, display: "flex", padding: "10px 6px" }}>
          {tabs.map(({ k, label, icon: Icon, activo }) => (
            <button key={k} disabled={!activo} onClick={() => activo && setTab(k)} style={{
              flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              padding: "6px 2px", color: !activo ? "#B8AF95" : (tab === k ? T.rust : T.inkSoft), cursor: activo ? "pointer" : "default",
            }}>
              <Icon size={22} />
              <span style={{ fontSize: 12 }}>{activo ? label : label + " (pronto)"}</span>
            </button>
          ))}
        </div>
      );
    }

    function HomeScreen({ onElegir }) {
      const opciones = [
        { k: "clientes", label: "Clientes", icon: Users },
        { k: "preservicio", label: "Preservicio", icon: ListChecks },
        { k: "gestacion", label: "Gestación", icon: CowCalfIcon },
        { k: "iatf", label: "IATF", icon: OvumSpermIcon },
        { k: "andrologico", label: "Andrológico", icon: BullIcon },
      ];
      const fileRef = useRef(null);
      const [msg, setMsg] = useState("");
      const [ocupado, setOcupado] = useState(false);

      const handleExportar = async () => {
        setOcupado(true);
        try {
          await exportarBackupCompleto();
          setMsg("Copia de seguridad descargada.");
        } catch (err) {
          setMsg("No se pudo exportar: " + (err.message || "error desconocido"));
        }
        setOcupado(false);
      };
      const handleImportar = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (!window.confirm("Esto va a sumar/actualizar datos en este dispositivo desde el archivo elegido. ¿Continuar?")) return;
        setOcupado(true);
        try {
          const total = await importarBackupDesdeArchivo(file);
          setMsg(`${total} registros importados. Recargando...`);
          setTimeout(() => window.location.reload(), 1200);
        } catch (err) {
          setMsg("No se pudo importar: " + (err.message || "error desconocido"));
          setOcupado(false);
        }
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 40 }}>
          <img src={LOGO_TYG} alt="T&G Servicios Veterinarios" style={{ width: "min(80%, 340px)", height: "auto", marginBottom: 30 }} />
          <div style={{
            display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 20,
            width: "100%", maxWidth: 480, padding: "0 24px",
          }}>
            {opciones.map(({ k, label, icon: Icon }) => (
              <button key={k} onClick={() => onElegir(k)} style={{
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12,
                background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 18, padding: "26px 10px",
                color: T.ink, cursor: "pointer", boxShadow: "0 2px 4px rgba(28,43,34,0.08)",
              }}>
                <Icon size={46} style={{ color: T.rust }} />
                <span style={{ fontSize: 17, fontWeight: 700 }}>{label}</span>
              </button>
            ))}
          </div>

          <div style={{ width: "100%", maxWidth: 480, padding: "24px 24px 40px", textAlign: "center" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Copia de seguridad</div>
            <div style={{ display: "flex", gap: 10 }}>
              <button disabled={ocupado} onClick={handleExportar} style={{
                flex: 1, background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "12px 8px",
                color: T.teal, fontWeight: 700, fontSize: 14, cursor: "pointer",
              }}>
                <Download size={16} style={{ verticalAlign: "-3px", marginRight: 4 }} /> Exportar todo
              </button>
              <button disabled={ocupado} onClick={() => fileRef.current && fileRef.current.click()} style={{
                flex: 1, background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "12px 8px",
                color: T.teal, fontWeight: 700, fontSize: 14, cursor: "pointer",
              }}>
                <Download size={16} style={{ verticalAlign: "-3px", marginRight: 4, transform: "rotate(180deg)" }} /> Importar todo
              </button>
              <input type="file" ref={fileRef} accept=".json" style={{ display: "none" }} onChange={handleImportar} />
            </div>
            {msg && <div style={{ fontSize: 13, color: T.inkSoft, marginTop: 10 }}>{msg}</div>}
          </div>
        </div>
      );
    }

    function anioDeInforme(inf) {
      if (inf.fecha) return inf.fecha.slice(0, 4);
      return "s/f";
    }
    function MiniStat({ label, value, tone }) {
      const bg = tone === "gold" ? T.goldSoft : tone === "teal" ? T.tealSoft : "#E7C9B7";
      const fg = tone === "gold" ? T.gold : tone === "teal" ? T.teal : T.rust;
      return (
        <div style={{ background: bg, borderRadius: 12, padding: "10px 6px", textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: fg, textTransform: "uppercase" }}>{label}</div>
          <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 20, color: fg }}>{value}</div>
        </div>
      );
    }
    function ClienteDashboard({ cliente, gestaciones, preservicios, iatfs, andrologicos, onBack }) {
      const propios = (list) => list.filter((i) => i.clienteId === cliente.id);
      const gAll = propios(gestaciones), pAll = propios(preservicios), iAll = propios(iatfs), aAll = propios(andrologicos);
      const anios = Array.from(new Set([...gAll, ...pAll, ...iAll, ...aAll].map(anioDeInforme))).sort((a, b) => b.localeCompare(a));

      const statsPorAnio = anios.map((anio) => {
        const gY = gAll.filter((i) => anioDeInforme(i) === anio);
        const pY = pAll.filter((i) => anioDeInforme(i) === anio);
        const iY = iAll.filter((i) => anioDeInforme(i) === anio);
        const aY = aAll.filter((i) => anioDeInforme(i) === anio);

        let gCant = 0, gPren = 0;
        gY.forEach((inf) => (inf.rodeos || []).forEach((r) => {
          const s = statsRodeo(r); gCant += s.cantidad; gPren += s.prenadas;
        }));

        let pRev = 0, pApt = 0;
        pY.forEach((inf) => {
          const s = statsPreservicio(inf);
          pRev += s.revisadas; pApt += s.aptas;
        });

        let iCant = 0, iPerd = 0, iNoResp = 0;
        iY.forEach((inf) => (inf.protocolos || []).forEach((p) => {
          iCant += parseFloat(p.cantidad) || 0;
          iPerd += parseFloat(p.perdidasDispositivo) || 0;
          iNoResp += parseFloat(p.noRespondieron) || 0;
        }));

        let aTotal = 0, aApto = 0, aDescarte = 0, aTratamiento = 0;
        aY.forEach((inf) => (inf.toros || []).forEach((t) => {
          aTotal++;
          if (t.estado === "descarte") aDescarte++;
          else if (t.estado === "tratamiento") aTratamiento++;
          else aApto++;
        }));

        return {
          anio,
          gestacion: gCant > 0 ? { cant: gCant, pct: pct(gPren, gCant) } : null,
          preservicio: pRev > 0 ? { rev: pRev, pctApt: pct(pApt, pRev), pctDesc: pct(pRev - pApt, pRev) } : null,
          iatf: iCant > 0 ? { cant: iCant, pctResp: pct(iCant - iNoResp, iCant), pctPerd: pct(iPerd, iCant) } : null,
          andrologico: aTotal > 0 ? { total: aTotal, pctApto: pct(aApto, aTotal), pctDesc: pct(aDescarte, aTotal), pctTrat: pct(aTratamiento, aTotal) } : null,
        };
      });

      return (
        <div>
          <button onClick={onBack} style={{ background: "none", border: "none", color: T.teal, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "16px 16px 0", display: "block" }}>&larr; Volver</button>
          <div style={{ padding: "8px 16px 4px" }}>
            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>Evolución</div>
            <div style={{ fontSize: 15, color: T.inkSoft }}>{cliente.nombre}</div>
          </div>
          <div style={{ padding: "12px 16px 100px" }}>
            {statsPorAnio.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <BarChart3 size={38} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes cargados para este cliente.</div>
              </div>
            )}
            {statsPorAnio.map((y) => (
              <div key={y.anio} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 21, color: T.ink, marginBottom: 10 }}>{y.anio}</div>

                {y.gestacion && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 6 }}>Gestación ({y.gestacion.cant} cabezas)</div>
                    <MiniStat label="% Preñez" value={`${y.gestacion.pct}%`} tone="gold" />
                  </div>
                )}
                {y.preservicio && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 6 }}>Preservicio ({y.preservicio.rev} revisadas)</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8 }}>
                      <MiniStat label="Aptas" value={`${y.preservicio.pctApt}%`} tone="gold" />
                      <MiniStat label="Descarte" value={`${y.preservicio.pctDesc}%`} tone="rust" />
                    </div>
                  </div>
                )}
                {y.iatf && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 6 }}>IATF ({y.iatf.cant} inseminadas)</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8 }}>
                      <MiniStat label="Respuesta" value={`${y.iatf.pctResp}%`} tone="teal" />
                      <MiniStat label="Pérdida disp." value={`${y.iatf.pctPerd}%`} tone="rust" />
                    </div>
                  </div>
                )}
                {y.andrologico && (
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 6 }}>Andrológico ({y.andrologico.total} toros)</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8 }}>
                      <MiniStat label="Aptos" value={`${y.andrologico.pctApto}%`} tone="gold" />
                      <MiniStat label="Tratam." value={`${y.andrologico.pctTrat}%`} tone="teal" />
                      <MiniStat label="Descarte" value={`${y.andrologico.pctDesc}%`} tone="rust" />
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const { lista: clientes, guardar: guardarCliente, borrar: borrarCliente, estadoSync: syncClientes } = useCollection("clientes");
      const { lista: preservicios, guardar: guardarPreservicio, borrar: borrarPreservicio, estadoSync: syncPreservicio } = useCollection("preservicios");
      const { lista: gestaciones, guardar: guardarGestacion, borrar: borrarGestacion, estadoSync: syncGestacion } = useCollection("gestaciones");
      const { lista: iatfs, guardar: guardarIatf, borrar: borrarIatf, estadoSync: syncIatf } = useCollection("iatfs");
      const { lista: andrologicos, guardar: guardarAndrologico, borrar: borrarAndrologico, estadoSync: syncAndrologico } = useCollection("andrologicos");
      const { lista: torosBase, guardar: guardarBase } = useCollection("toros_base");
      const [tab, setTab] = useState(null);
      const [dashboardCliente, setDashboardCliente] = useState(null);
      const [clienteId, setClienteId] = useState(null);
      const clienteActivo = clientes.find((c) => c.id === clienteId) || null;

      const todosInformes = [...gestaciones, ...preservicios, ...iatfs, ...andrologicos];
      const irACliente = (c) => { setClienteId(c.id); setTab("preservicio"); };
      const irAInicio = () => setTab(null);

      if (dashboardCliente) {
        return (
          <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", maxWidth: 900, margin: "0 auto", color: T.ink }}>
            <ClienteDashboard cliente={dashboardCliente} gestaciones={gestaciones} preservicios={preservicios}
              iatfs={iatfs} andrologicos={andrologicos} onBack={() => setDashboardCliente(null)} />
          </div>
        );
      }

      if (tab === null) {
        return (
          <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", color: T.ink }}>
            <HomeScreen onElegir={setTab} />
          </div>
        );
      }

      return (
        <div style={{ fontFamily: "Inter, sans-serif", background: T.paper, minHeight: "100vh", maxWidth: 900, margin: "0 auto", color: T.ink }}>
          <button onClick={irAInicio} style={{ background: "none", border: "none", color: T.teal, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "10px 16px 0", display: "block" }}>
            &larr; Inicio
          </button>
          {tab === "clientes" && (
            <ClientesView clientes={clientes} guardar={guardarCliente} borrar={borrarCliente} estadoSync={syncClientes} onSeleccionar={irACliente} onVerEvolucion={setDashboardCliente} />
          )}
          {tab === "preservicio" && (
            clienteActivo ? (
              <PreservicioView cliente={clienteActivo} informes={preservicios} guardar={guardarPreservicio} borrar={borrarPreservicio} estadoSync={syncPreservicio} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "gestacion" && (
            clienteActivo ? (
              <GestacionView cliente={clienteActivo} informes={gestaciones} guardar={guardarGestacion} borrar={borrarGestacion} estadoSync={syncGestacion} iatfs={iatfs} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "iatf" && (
            clienteActivo ? (
              <IatfView cliente={clienteActivo} informes={iatfs} guardar={guardarIatf} borrar={borrarIatf} estadoSync={syncIatf} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          {tab === "andrologico" && (
            clienteActivo ? (
              <AndrologicoView cliente={clienteActivo} informes={andrologicos} guardar={guardarAndrologico} borrar={borrarAndrologico} estadoSync={syncAndrologico} torosBase={torosBase} guardarBase={guardarBase} todosInformes={todosInformes} />
            ) : (
              <div style={{ padding: 40, textAlign: "center", color: T.inkSoft }}>
                Elegí un cliente primero desde la pestaña Clientes.
              </div>
            )
          )}
          <BarraNav tab={tab} setTab={setTab} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
