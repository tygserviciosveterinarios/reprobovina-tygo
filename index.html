  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useRef } from "react";
    import { createRoot } from "react-dom/client";
    import { Users, Plus, X, Trash2, Pencil, Wifi, WifiOff, ListChecks, ChevronDown, ChevronUp, AlertTriangle, Download, BarChart3, Zap } from "lucide-react";
    import * as XLSX from "xlsx";
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyDeBLhH4lIASyLxlMg_oSwM_EZX7wzOg94",
      authDomain: "reprobovina-tyg.firebaseapp.com",
      projectId: "reprobovina-tyg",
      storageBucket: "reprobovina-tyg.firebasestorage.app",
      messagingSenderId: "162502425864",
      appId: "1:162502425864:web:49fecac926675a731c00bd",
    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    const DB_NAME = "reprobovina_local";
    const DB_VERSION = 6;
    const COLECCIONES = ["clientes", "preservicios", "gestaciones", "iatfs", "andrologicos", "toros_base"];

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const dbase = req.result;
          COLECCIONES.forEach((nombre) => {
            if (!dbase.objectStoreNames.contains(nombre)) {
              dbase.createObjectStore(nombre, { keyPath: "id" });
            }
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbGetAll(nombreColeccion) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readonly");
        const req = tx.objectStore(nombreColeccion).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbPut(nombreColeccion, registro) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readwrite");
        tx.objectStore(nombreColeccion).put(registro);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbDelete(nombreColeccion, id) {
      const dbase = await abrirDB();
      return new Promise((resolve, reject) => {
        const tx = dbase.transaction(nombreColeccion, "readwrite");
        tx.objectStore(nombreColeccion).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function getColeccion(nombreColeccion) { return idbGetAll(nombreColeccion); }

    /* Copia de seguridad completa: junta las 6 colecciones en un solo archivo para exportar/restaurar */
    async function exportarBackupCompleto() {
      const data = {};
      for (const col of COLECCIONES) {
        data[col] = await getColeccion(col);
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `backup_reprobovina_${todayISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    async function importarBackupDesdeArchivo(file) {
      const texto = await file.text();
      const data = JSON.parse(texto);
      let total = 0;
      for (const col of COLECCIONES) {
        const registros = data[col] || [];
        for (const r of registros) {
          await guardarEnColeccion(col, r);
          total++;
        }
      }
      return total;
    }
    async function guardarEnColeccion(nombreColeccion, registro) {
      const conFecha = { ...registro, updatedAt: Date.now() };
      await idbPut(nombreColeccion, conFecha);
      if (navigator.onLine) {
        try { await setDoc(doc(db, nombreColeccion, conFecha.id), conFecha); } catch (e) {}
      }
      return conFecha;
    }
    async function borrarDeColeccion(nombreColeccion, id) {
      await idbDelete(nombreColeccion, id);
      if (navigator.onLine) {
        try { await deleteDoc(doc(db, nombreColeccion, id)); } catch (e) {}
      }
    }
    async function sincronizar(nombreColeccion) {
      if (!navigator.onLine) return { ok: false };
      try {
        const locales = await idbGetAll(nombreColeccion);
        const localesPorId = Object.fromEntries(locales.map((r) => [r.id, r]));
        const snap = await getDocs(collection(db, nombreColeccion));
        const remotos = snap.docs.map((d) => d.data());
        const remotosPorId = Object.fromEntries(remotos.map((r) => [r.id, r]));
        const todosLosIds = new Set([...Object.keys(localesPorId), ...Object.keys(remotosPorId)]);
        for (const id of todosLosIds) {
          const loc = localesPorId[id];
          const rem = remotosPorId[id];
          if (loc && !rem) await setDoc(doc(db, nombreColeccion, id), loc);
          else if (rem && !loc) await idbPut(nombreColeccion, rem);
          else if (loc && rem) {
            if ((loc.updatedAt || 0) > (rem.updatedAt || 0)) await setDoc(doc(db, nombreColeccion, id), loc);
            else if ((rem.updatedAt || 0) > (loc.updatedAt || 0)) await idbPut(nombreColeccion, rem);
          }
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, motivo: e.message };
      }
    }

    const T = {
      paper: "#DCD3B8", ink: "#1C2B22", inkSoft: "#5A6B5E", card: "#F3EEDD",
      line: "#C9BE9C", rust: "#A6491F", gold: "#8A6D1E", goldSoft: "#E9DCB0",
      teal: "#1F6B6B", tealSoft: "#CFE3E1",
    };
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function todayISO() { return new Date().toISOString().slice(0, 10); }

    /* Revisa si el número de informe ya está usado por otro informe del mismo año, en cualquiera de los 4 módulos */
    function numeroInformeDuplicado(todosInformes, numero, fecha, selfId) {
      if (!numero) return false;
      const anio = (fecha || todayISO()).slice(0, 4);
      return (todosInformes || []).some((i) => i.id !== selfId && String(i.numero) === String(numero) && (i.fecha || "").slice(0, 4) === anio);
    }
    /* Calcula el próximo número correlativo (compartido entre los 4 módulos) para el año de la fecha dada */
    function proximoNumero(todosInformes, fecha) {
      const anio = (fecha || todayISO()).slice(0, 4);
      const delAnio = (todosInformes || []).filter((i) => (i.fecha || "").slice(0, 4) === anio);
      const max = delAnio.reduce((m, i) => Math.max(m, parseFloat(i.numero) || 0), 0);
      return max + 1;
    }

    let _audioCtx = null;
    let _audioUnlocked = false;
    function _desbloquearAudio(ctx) {
      if (_audioUnlocked) return;
      try {
        const buffer = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buffer; src.connect(ctx.destination); src.start(0);
      } catch (e) {}
      _audioUnlocked = true;
    }
    function _tocarTono(ctx, kind) {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if (kind === "negativo") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.16);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.19);
      } else {
        osc.type = "sine";
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.1);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now); osc.stop(now + 0.15);
      }
    }
    /* kind: "positivo" (preñada/apta) o "negativo" (vacía/descarte) */
    function playBeep(kind) {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = _audioCtx;
        _desbloquearAudio(ctx);
        if (ctx.state === "suspended" || ctx.state === "interrupted") {
          ctx.resume().then(() => _tocarTono(ctx, kind)).catch(() => {});
        } else {
          _tocarTono(ctx, kind);
        }
      } catch (e) {}
    }

    function EstadoConexion({ estado }) {
      const config = {
        online: { icon: Wifi, texto: "En línea · sincronizado", color: T.teal, bg: T.tealSoft },
        offline: { icon: WifiOff, texto: "Sin conexión · guardado en el dispositivo", color: T.rust, bg: "#E7C9B7" },
        sincronizando: { icon: Wifi, texto: "Sincronizando...", color: T.gold, bg: T.goldSoft },
      }[estado] || {};
      const Icon = config.icon;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", background: config.bg, color: config.color, fontSize: 14, fontWeight: 600 }}>
          {Icon && <Icon size={16} />} {config.texto}
        </div>
      );
    }

    function useCollection(nombre) {
      const [lista, setLista] = useState([]);
      const [estadoSync, setEstadoSync] = useState(navigator.onLine ? "sincronizando" : "offline");
      const recargar = () => getColeccion(nombre).then(setLista);
      useEffect(() => {
        recargar();
        const sync = async () => {
          if (!navigator.onLine) { setEstadoSync("offline"); return; }
          setEstadoSync("sincronizando");
          await sincronizar(nombre);
          await recargar();
          setEstadoSync("online");
        };
        sync();
        const onOnline = () => sync();
        const onOffline = () => setEstadoSync("offline");
        window.addEventListener("online", onOnline);
        window.addEventListener("offline", onOffline);
        return () => {
          window.removeEventListener("online", onOnline);
          window.removeEventListener("offline", onOffline);
        };
      }, [nombre]);
      const guardar = async (registro) => {
        const conId = registro.id ? registro : { ...registro, id: uid() };
        await guardarEnColeccion(nombre, conId);
        await recargar();
      };
      const borrar = async (id) => { await borrarDeColeccion(nombre, id); await recargar(); };
      return { lista, guardar, borrar, estadoSync };
    }

    function pct(parte, total) {
      if (!total) return 0;
      return Math.round((parte / total) * 1000) / 10;
    }
    function nuevoEstablecimiento() { return { id: uid(), nombre: "", ubicacion: "" }; }

    /* Busca un valor en una fila de Excel probando distintos nombres posibles de columna */
    /* Normaliza un texto de encabezado de Excel: minúsculas, sin acentos, sin puntos/espacios/símbolos.
       Así "C.E." o "C. E." o "Condición Corporal" se reconocen igual que "ce" o "condicion". */
    function normalizeKey(k) {
      return k.toString().trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }
    function extractField(row, aliases) {
      const aliasesNorm = aliases.map(normalizeKey);
      for (const key of Object.keys(row)) {
        const k = normalizeKey(key);
        if (aliasesNorm.some((a) => k === a || k.includes(a))) return row[key];
      }
      return "";
    }

    /* Lee un archivo Excel/CSV de toros (identidad simple o examen completo, reconoce las columnas solo) */
    async function parseExcelToros(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      // Leemos como grilla de filas/columnas (no como objetos) para no depender de cómo
      // SheetJS adivine los encabezados, y para poder buscar la fila de encabezados real.
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

      let headerRowIdx = 0;
      for (let i = 0; i < Math.min(grid.length, 15); i++) {
        const fila = (grid[i] || []).map((c) => normalizeKey(c));
        if (fila.some((c) => c === "tubo" || c === "rp")) { headerRowIdx = i; break; }
      }
      const headers = (grid[headerRowIdx] || []).map((c) => normalizeKey(c));
      const headersOriginales = (grid[headerRowIdx] || []).map((c) => String(c).trim()).filter(Boolean);
      const dataRows = grid.slice(headerRowIdx + 1);

      const getCell = (row, aliases) => {
        const aliasesNorm = aliases.map(normalizeKey);
        for (let col = 0; col < headers.length; col++) {
          const h = headers[col];
          if (!h) continue;
          if (aliasesNorm.some((a) => h === a || h.includes(a))) {
            return row[col] !== undefined ? row[col] : "";
          }
        }
        return "";
      };

      const toros = dataRows.map((row) => {
        if (!row || row.every((c) => c === "" || c === undefined)) return null;
        const estadoTexto = String(getCell(row, ["estado"]) || "").trim().toLowerCase();
        const motivoTexto = String(getCell(row, ["motivo"]) || "").trim();
        const observTexto = String(getCell(row, ["observ"]) || "").trim();
        let estado = "apto";
        if (estadoTexto.includes("descarte")) estado = "descarte";
        else if (estadoTexto.includes("tratamiento")) estado = "tratamiento";
        if (estado === "apto" && (motivoTexto.toLowerCase().includes("descarte") || observTexto.toLowerCase().includes("descarte"))) {
          estado = "descarte";
        }
        return {
          tubo: String(getCell(row, ["tubo"]) || "").trim(),
          rp: String(getCell(row, ["rp"]) || "").trim(),
          electronica: String(getCell(row, ["electronica", "eid", "vid", "caravana"]) || "").trim(),
          raza: String(getCell(row, ["raza"]) || "").trim(),
          origen: String(getCell(row, ["origen"]) || "").trim(),
          rodeo: String(getCell(row, ["rodeo"]) || "").trim(),
          ce: String(getCell(row, ["ce", "circunferencia", "perimetro", "escrotal"]) || "").trim(),
          tono: String(getCell(row, ["tono", "tonicidad"]) || "").trim(),
          cc: String(getCell(row, ["cc", "condicion", "corporal"]) || "").trim(),
          estado,
          motivoDescarte: motivoTexto,
          observaciones: observTexto,
        };
      }).filter(Boolean).filter((t) => t.rp || t.electronica);

      const ceEncontrada = headers.some((h) => ["ce", "circunferencia", "perimetro", "escrotal"].some((a) => h === a || h.includes(a)));
      return { toros, headersOriginales, ceEncontrada };
    }

    /* Descarga un libro de Excel ya armado (evita el bug de XLSX.writeFile en algunos navegadores) */
    function descargarExcel(wb, nombreArchivo) {
      const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nombreArchivo;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportarExcelPreservicio(inf, cliente) {
      const st = statsPreservicio(inf);
      const rev = st.revisadas, apt = st.aptas;
      const filas = [
        ["INFORME DE PRESERVICIO"],
        ["Cliente", cliente.nombre], ["Establecimiento", inf.establecimiento], ["Fecha", inf.fecha],
        [],
        ["Revisadas", rev], ["Aptas", apt], ["% Aptas", `${pct(apt, rev)}%`], ["% Descarte", `${pct(rev - apt, rev)}%`],
        [], ["Motivos de descarte"],
        ["Pelvimetría", st.descPelvimetria || 0], ["GDR", st.descGdr || 0], ["Tamaño", st.descTamano || 0], ["Otras", st.descOtras || 0],
        [], ["Clasificación por GDR (sobre aptas)"],
        ["GDR 1", st.gdr1 || 0, `${pct(st.gdr1, apt)}%`], ["GDR 2", st.gdr2 || 0, `${pct(st.gdr2, apt)}%`],
        ["GDR 3", st.gdr3 || 0, `${pct(st.gdr3, apt)}%`], ["GDR 4", st.gdr4 || 0, `${pct(st.gdr4, apt)}%`],
        [], ["Observaciones", inf.observaciones || ""],
      ];
      const ws = XLSX.utils.aoa_to_sheet(filas);
      ws["!cols"] = [{ wch: 20 }, { wch: 26 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Preservicio");
      descargarExcel(wb, `Preservicio_${cliente.nombre}_${inf.fecha}.xlsx`);
    }

    function exportarExcelGestacion(inf, cliente, iatfs = []) {
      const filas = [
        ["INFORME DE GESTACIÓN"],
        ["Cliente", cliente.nombre], ["Establecimiento", inf.establecimiento], ["Fecha", inf.fecha], ["Método", inf.metodo],
        [],
        ["Rodeo", "Categoría", "Tipo servicio", "Estado general", "Puestero", "Cantidad", "Preñadas", "Vacías", "% Preñez",
          "Cabeza", "Cuerpo", "Cola", "C.C. Preñadas", "C.C. Vacías", "% Toros en servicio",
          "Ingreso toros", "Salida toros", "Días servicio", "Fecha IATF", "Edad preñez (d)", "Lote IATF vinculado", "% Preñez a IATF", "Observaciones"],
      ];
      let totCant = 0, totPren = 0;
      (inf.rodeos || []).forEach((r, i) => {
        const s = statsRodeo(r);
        totCant += s.cantidad; totPren += s.prenadas;
        const vinculado = getLoteIatfVinculado(iatfs, r.iatfInformeId, r.iatfLoteId);
        const inseminadas = vinculado ? (parseFloat(vinculado.lote.cantidad) || 0) : 0;
        filas.push([
          r.nombre || `Rodeo ${i + 1}`, r.categoria || "", r.tipoServicio || "", r.estadoGeneral || "", r.puestero || "",
          s.cantidad, s.prenadas, r.vacias || "", `${pct(s.prenadas, s.cantidad)}%`,
          r.cabeza || "", r.cuerpo || "", r.cola || "", r.ccPrenadas || "", r.ccVacias || "", r.porcToros || "",
          r.fechaIngresoToros || "", r.fechaSalidaToros || "", (r.diasServicio || diffDays(r.fechaIngresoToros, inf.fecha) || ""),
          r.fechaIATF || "", (diffDays(r.fechaSalidaToros, inf.fecha) ?? ""),
          vinculado ? `${vinculado.lote.nombre || "Lote"} (${inseminadas})` : "",
          vinculado ? `${pct(s.prenadas, inseminadas)}%` : "",
          r.observaciones || "",
        ]);
      });
      filas.push(["TOTAL", "", "", "", "", totCant, totPren, "", `${pct(totPren, totCant)}%`, "", "", "", "", "", "", "", "", "", "", "", "", "", ""]);
      filas.push([], ["Conclusión", inf.conclusion || ""]);
      const ws = XLSX.utils.aoa_to_sheet(filas);
      ws["!cols"] = [{ wch: 14 }, { wch: 18 }, { wch: 20 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 10 },
        { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 12 },

    function exportarExcelIatf(inf, cliente) {
      const filas = [
        ["INFORME DE IATF"],
        ["Cliente", cliente.nombre], ["Establecimiento", inf.establecimiento], ["Fecha", inf.fecha],
        [],
        ["Lote", "Toros", "Colocación", "Retiro", "Hora fin retiro", "IATF", "Hora inicio IATF", "Horas transcurridas", "Cantidad", "Perd. dispositivo", "% Pérdida", "No respondieron", "% Respuesta"],
      ];
      (inf.protocolos || []).forEach((p, i) => {
        const cant = parseFloat(p.cantidad) || 0;
        const perd = parseFloat(p.perdidasDispositivo) || 0;
        const noResp = parseFloat(p.noRespondieron) || 0;
        const toros = (p.toros || []).filter((t) => t.nombre).map((t) => `${t.nombre}${(p.toros.length > 1 && t.cantidad) ? ` (${t.cantidad})` : ""}`).join(", ");
        const horas = horasEntreRetiroYIatf(p);
        filas.push([
          p.nombre || `Lote ${i + 1}`, toros, p.fechaColocacion || "", p.fechaRetiro || "", p.horaRetiroFin || "",
          p.fechaIATF || "", p.horaIATFInicio || "", horas !== null ? `${horas} h` : "",
          cant, perd, `${pct(perd, cant)}%`, noResp, `${pct(cant - noResp, cant)}%`,
        ]);
      });
      filas.push([], ["Observaciones generales", inf.observacionesGen || ""]);
      if ((inf.pajuelas || []).some((p) => p.toro)) {
        filas.push([], ["CALIDAD SEMINAL"]);
        filas.push(["Toro", "Raza", "Concentración", "Tamaño pajuela", "M.T. (%)", "M.P. (%)", "Resultado", "Observaciones"]);
        inf.pajuelas.filter((p) => p.toro).forEach((p) => {
          filas.push([p.toro, p.raza, p.concentracion || "", p.tamPajuela || "", p.mt || "", p.mp || "", p.resultado, p.observaciones || ""]);
        });
      }
      const ws = XLSX.utils.aoa_to_sheet(filas);
      ws["!cols"] = [{ wch: 16 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 14 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "IATF");
      descargarExcel(wb, `IATF_${cliente.nombre}_${inf.fecha}.xlsx`);
    }

    function statsPreservicio(f) {
      if (f.modoCarga === "rapida") {
        const animales = f.animales || [];
        const conteo = { "Pelvimetría": 0, "GDR": 0, "Tamaño": 0, "Otras": 0 };
        animales.forEach((a) => { if (a.resultado === "Descarte" && a.motivo) conteo[a.motivo] = (conteo[a.motivo] || 0) + 1; });
        const gdrConteo = { 1: 0, 2: 0, 3: 0, 4: 0 };
        animales.forEach((a) => { if (a.resultado === "Apta" && a.gdr) gdrConteo[a.gdr] = (gdrConteo[a.gdr] || 0) + 1; });
        return {
          revisadas: animales.length, aptas: animales.filter((a) => a.resultado === "Apta").length,
          descPelvimetria: conteo["Pelvimetría"], descGdr: conteo["GDR"], descTamano: conteo["Tamaño"], descOtras: conteo["Otras"],
          gdr1: gdrConteo[1], gdr2: gdrConteo[2], gdr3: gdrConteo[3], gdr4: gdrConteo[4],
        };
      }
      return {
        revisadas: parseFloat(f.revisadas) || 0, aptas: parseFloat(f.aptas) || 0,
        descPelvimetria: parseFloat(f.descPelvimetria) || 0, descGdr: parseFloat(f.descGdr) || 0,
        descTamano: parseFloat(f.descTamano) || 0, descOtras: parseFloat(f.descOtras) || 0,
        gdr1: parseFloat(f.gdr1) || 0, gdr2: parseFloat(f.gdr2) || 0, gdr3: parseFloat(f.gdr3) || 0, gdr4: parseFloat(f.gdr4) || 0,
      };
    }

                  })()}

                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Motivos de descarte (opcional)</label>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, margin: "6px 0 12px" }}>

                    <input type="number" placeholder="GDR" value={form.descGdr} onChange={(e) => setForm({ ...form, descGdr: e.target.value })} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    <input type="number" placeholder="Tamaño" value={form.descTamano} onChange={(e) => setForm({ ...form, descTamano: e.target.value })} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    <input type="number" placeholder="Otras" value={form.descOtras} onChange={(e) => setForm({ ...form, descOtras: e.target.value })} style={{ width: "100%", minWidth: 0, boxSizing: "border-box", padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />

              {(s.gdr1 + s.gdr2 + s.gdr3 + s.gdr4) > 0 && (

                          <div style={{ fontWeight: 700, fontSize: 17, color: T.teal }}>{val} <span style={{ fontSize: 12 }}>({pct(val, s.aptas)}%)</span></div>

                  </div>

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Observaciones</label>

      return (

          <div style={{ padding: "0 16px 90px" }}>

              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <ListChecks size={38} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de preservicio para este cliente.</div>
              </div>
            )}
            {[...propios].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => {
              const stInf = statsPreservicio(inf);
              const rev = stInf.revisadas, apt = stInf.aptas;
              return (
                <div key={inf.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>

                    </div>
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => exportarExcelPreservicio(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                      <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                      <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>

    function diffDays(isoDesde, isoHasta) {
      if (!isoDesde || !isoHasta) return null;
      const a = new Date(isoDesde + "T00:00:00");
      const b = new Date(isoHasta + "T00:00:00");
      if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    }
    const CATEGORIAS_RODEO = ["Vaquillona 1° servicio", "Vaquillona 2° servicio", "Vaca seca", "Vaca con cría al pie", "Vaca de cabaña", "Otra"];
    const TIPOS_SERVICIO = ["IATF + Servicio Natural", "IATF Cabeza + Servicio Natural", "IATF exclusiva", "Servicio Natural"];
    const ESTADOS_GENERALES = ["Muy Bueno", "Bueno", "Regular", "Malo"];
    function nuevoRodeo() {
      return {
        id: uid(), nombre: "", categoria: CATEGORIAS_RODEO[0], tipoServicio: TIPOS_SERVICIO[0], estadoGeneral: ESTADOS_GENERALES[0],
        modoCarga: "totales", cantidad: "", prenadas: "", vacias: "", cabeza: "", cuerpo: "", cola: "",
        ccPrenadas: "", ccVacias: "", porcToros: "", puestero: "", animales: [], observaciones: "",
        fechaIngresoToros: "", fechaSalidaToros: "", fechaIATF: "", iatfInformeId: "", iatfLoteId: "",
        diasServicio: "", edadPrenezChica: "",
      };
    }
    function statsRodeo(r) {
      if (r.modoCarga === "rapida") {
        const animales = r.animales || [];
        return { cantidad: animales.length, prenadas: animales.filter((a) => a.resultado === "Preñada").length };
      }
      return { cantidad: parseFloat(r.cantidad) || 0, prenadas: parseFloat(r.prenadas) || 0 };
    }

    function RodeoQuickEntry({ rodeo, onChange }) {
      const [caravana, setCaravana] = useState("");
      const animales = rodeo.animales || [];
      const marcar = (resultado) => {
        const nuevo = { id: uid(), caravana: caravana.trim(), resultado };
        onChange({ animales: [...animales, nuevo] });
        playBeep(resultado === "Preñada" ? "positivo" : "negativo");
        setCaravana("");
      };
      const borrarAnimal = (id) => onChange({ animales: animales.filter((a) => a.id !== id) });
      const pren = animales.filter((a) => a.resultado === "Preñada").length;
      const vac = animales.length - pren;
      const caravanasRepetidas = (() => {
        const conteo = {};
        animales.forEach((a) => { if (a.caravana) conteo[a.caravana] = (conteo[a.caravana] || 0) + 1; });
        return new Set(Object.keys(conteo).filter((k) => conteo[k] > 1));
      })();
      return (
        <div>
          <input value={caravana} onChange={(e) => setCaravana(e.target.value)} placeholder="Caravana (opcional)"
            style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, marginBottom: 8, background: "#fff" }} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
            <button onClick={() => marcar("Preñada")} style={{ padding: "16px", borderRadius: 10, border: "none", background: T.gold, color: "#fff", fontWeight: 700, fontSize: 17, cursor: "pointer" }}>Preñada</button>
            <button onClick={() => marcar("Vacía")} style={{ padding: "16px", borderRadius: 10, border: "none", background: T.rust, color: "#fff", fontWeight: 700, fontSize: 17, cursor: "pointer" }}>Vacía</button>
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 8, fontSize: 15, fontWeight: 700, flexWrap: "wrap" }}>
            <span style={{ color: T.gold }}>{pren} preñadas</span>
            <span style={{ color: T.rust }}>{vac} vacías</span>
            <span style={{ color: T.inkSoft }}>{animales.length} total</span>
            {caravanasRepetidas.size > 0 && (
              <span style={{ background: T.rust, color: "#fff", padding: "2px 8px", borderRadius: 20, fontSize: 13 }}>
                ⚠ {caravanasRepetidas.size} caravana{caravanasRepetidas.size > 1 ? "s" : ""} repetida{caravanasRepetidas.size > 1 ? "s" : ""}
              </span>
            )}
          </div>
          {animales.length > 0 && (
            <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8 }}>
              {[...animales].reverse().map((a) => {
                const repetida = a.caravana && caravanasRepetidas.has(a.caravana);
                return (
                  <div key={a.id} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 13px",
                    borderBottom: `1px solid ${T.line}`, fontSize: 15, background: repetida ? "#E7C9B7" : "transparent",
                  }}>
                    <span style={{ color: repetida ? T.rust : T.ink, fontWeight: repetida ? 700 : 400 }}>{a.caravana || "s/n"}{repetida ? " ⚠" : ""}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: a.resultado === "Preñada" ? T.gold : T.rust, fontWeight: 700 }}>{a.resultado}</span>
                      <button onClick={() => borrarAnimal(a.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={16} /></button>
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function getLoteIatfVinculado(iatfs, iatfInformeId, iatfLoteId) {
      if (!iatfInformeId || !iatfLoteId) return null;
      const inf = iatfs.find((i) => i.id === iatfInformeId);
      if (!inf) return null;
      const lote = (inf.protocolos || []).find((p) => p.id === iatfLoteId);
      if (!lote) return null;
      return { inf, lote };
    }

    function GestacionView({ cliente, informes, guardar, borrar, estadoSync, iatfs = [], todosInformes = [] }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const vacio = () => ({
        nombre: "", numero: "",
        fecha: new Date().toISOString().slice(0, 10),
        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",
        metodo: "Tacto rectal",
        rodeos: [nuevoRodeo()],
        conclusion: "",
      });
      const [form, setForm] = useState(vacio());

      const propios = informes.filter((i) => i.clienteId === cliente.id);
      const abrirNuevo = () => { setEditando(null); setForm(vacio()); setVista("form"); };
      const abrirEditar = (inf) => { setEditando(inf.id); setForm(inf); setVista("form"); };
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        guardar({ ...form, numero: numeroFinal, id: editando || undefined, clienteId: cliente.id });
        setVista("lista");
      };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) borrar(id); };

      const actualizarRodeo = (id, patch) => setForm({ ...form, rodeos: form.rodeos.map((r) => r.id === id ? { ...r, ...patch } : r) });
      const agregarRodeo = () => setForm({ ...form, rodeos: [...form.rodeos, nuevoRodeo()] });
      const quitarRodeo = (id) => setForm({ ...form, rodeos: form.rodeos.filter((r) => r.id !== id) });

      const totalesInforme = (inf) => (inf.rodeos || []).reduce((acc, r) => {
        const s = statsRodeo(r);
        acc.cantidad += s.cantidad;
        acc.prenadas += s.prenadas;
        return acc;
      }, { cantidad: 0, prenadas: 0 });

      if (vista === "form") {
        return (
          <div style={{ padding: "16px 16px 90px" }}>
            <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, marginBottom: 10, cursor: "pointer", fontWeight: 700 }}>&larr; Volver</button>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10 }}>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Nombre del informe (opcional)</label>
                  <input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej: Gestación Saravia 2026" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>N° de informe</label>
                  <input value={form.numero} onChange={(e) => setForm({ ...form, numero: e.target.value })} placeholder="Opcional" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
              </div>
              {numeroInformeDuplicado(todosInformes, form.numero, form.fecha, editando) && (
                <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "10px 12px", marginBottom: 12, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
                  <AlertTriangle size={16} /> Ya existe un informe N° {form.numero} para este año
                </div>
              )}
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Fecha</label>
              <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Establecimiento</label>
              {(cliente.establecimientos || []).length > 0 ? (
                <select value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }}>
                  {cliente.establecimientos.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                </select>
              ) : (
                <input value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
              )}

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Método</label>
              <select value={form.metodo} onChange={(e) => setForm({ ...form, metodo: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }}>
                <option>Tacto rectal</option>
                <option>Ecografía</option>
              </select>
            </div>

            {form.rodeos.map((r, i) => {
              const s = statsRodeo(r);
              return (
                <div key={r.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontWeight: 700, color: T.ink }}>Rodeo {i + 1}</div>
                    {form.rodeos.length > 1 && <button onClick={() => quitarRodeo(r.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={19} /></button>}
                  </div>
                  <input placeholder="Nombre del rodeo (opcional)" value={r.nombre || ""} onChange={(e) => actualizarRodeo(r.id, { nombre: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, marginBottom: 10, background: "#fff" }} />

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Categoría</label>
                      <select value={r.categoria} onChange={(e) => actualizarRodeo(r.id, { categoria: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                        {CATEGORIAS_RODEO.map((c) => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Tipo de servicio</label>
                      <select value={r.tipoServicio} onChange={(e) => actualizarRodeo(r.id, { tipoServicio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                        {TIPOS_SERVICIO.map((c) => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Estado general</label>
                    <select value={r.estadoGeneral} onChange={(e) => actualizarRodeo(r.id, { estadoGeneral: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                      {ESTADOS_GENERALES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Vincular con informe de IATF (opcional)</label>
                    <select value={r.iatfInformeId && r.iatfLoteId ? `${r.iatfInformeId}|${r.iatfLoteId}` : ""} onChange={(e) => {
                      const [infId, loteId] = e.target.value ? e.target.value.split("|") : ["", ""];
                      const vinculado = getLoteIatfVinculado(iatfs, infId, loteId);
                      actualizarRodeo(r.id, {
                        iatfInformeId: infId, iatfLoteId: loteId,
                        fechaIATF: vinculado ? vinculado.inf.fecha : r.fechaIATF,
                      });
                    }} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                      <option value="">Sin vincular</option>
                      {iatfs.filter((inf) => inf.clienteId === cliente.id).map((inf) => (
                        (inf.protocolos || []).map((p) => (
                          <option key={p.id} value={`${inf.id}|${p.id}`}>
                            {(inf.nombre || inf.establecimiento)} · {inf.fecha} · {p.nombre || "Lote"}
                          </option>
                        ))
                      ))}
                    </select>
                  </div>

                  <label style={{ fontSize: 13, color: T.inkSoft }}>Forma de carga</label>
                  <div style={{ display: "flex", gap: 6, margin: "6px 0 10px" }}>
                    <button onClick={() => actualizarRodeo(r.id, { modoCarga: "rapida" })} style={{
                      flex: 1, padding: "10px 6px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                      border: `1.5px solid ${r.modoCarga === "rapida" ? T.teal : T.line}`, background: r.modoCarga === "rapida" ? T.tealSoft : "#fff", color: T.teal,
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                    }}><Zap size={15} /> Rápida (a campo)</button>
                    <button onClick={() => actualizarRodeo(r.id, { modoCarga: "totales" })} style={{
                      flex: 1, padding: "10px 6px", borderRadius: 8, fontSize: 14.5, fontWeight: 700, cursor: "pointer",
                      border: `1.5px solid ${r.modoCarga !== "rapida" ? T.teal : T.line}`, background: r.modoCarga !== "rapida" ? T.tealSoft : "#fff", color: T.teal,
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                    }}><ListChecks size={15} /> Totales a mano</button>
                  </div>

                  {r.modoCarga === "rapida" ? (
                    <RodeoQuickEntry rodeo={r} onChange={(patch) => actualizarRodeo(r.id, patch)} />
                  ) : (
                    <React.Fragment>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad tactadas</label>
                          <input type="number" value={r.cantidad} onChange={(e) => actualizarRodeo(r.id, { cantidad: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Preñadas</label>
                          <input type="number" value={r.prenadas} onChange={(e) => actualizarRodeo(r.id, { prenadas: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                      </div>
                      <div style={{ marginBottom: 10 }}>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Vacías</label>
                        <input type="number" value={r.vacias} onChange={(e) => actualizarRodeo(r.id, { vacias: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cabeza</label>
                          <input type="number" value={r.cabeza} onChange={(e) => actualizarRodeo(r.id, { cabeza: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cuerpo</label>
                          <input type="number" value={r.cuerpo} onChange={(e) => actualizarRodeo(r.id, { cuerpo: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cola</label>
                          <input type="number" value={r.cola} onChange={(e) => actualizarRodeo(r.id, { cola: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                      </div>
                    </React.Fragment>
                  )}

                  <div style={{ background: T.goldSoft, borderRadius: 8, padding: "11px 13px", marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: T.gold, textTransform: "uppercase" }}>% Preñez calculado</span>
                    <span style={{ fontWeight: 700, fontSize: 18, color: T.gold }}>{pct(s.prenadas, s.cantidad)}%</span>
                  </div>

                  <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginTop: 14 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Servicio</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Fecha IATF (si hubo)</label>
                        <input type="date" value={r.fechaIATF} onChange={(e) => actualizarRodeo(r.id, { fechaIATF: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Ingreso de toros</label>
                        <input type="date" value={r.fechaIngresoToros} onChange={(e) => actualizarRodeo(r.id, { fechaIngresoToros: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                    </div>
                    <div style={{ marginBottom: 10 }}>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Salida de toros</label>
                      <input type="date" value={r.fechaSalidaToros} onChange={(e) => actualizarRodeo(r.id, { fechaSalidaToros: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Días de servicio</label>
                        <input type="number" value={r.diasServicio} onChange={(e) => actualizarRodeo(r.id, { diasServicio: e.target.value })} placeholder={String(diffDays(r.fechaIngresoToros, form.fecha) ?? "")} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Edad preñez más chica (días)</label>
                        <div style={{ padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#f3eedd", color: T.inkSoft, fontWeight: 700 }}>
                          {diffDays(r.fechaSalidaToros, form.fecha) ?? "—"}
                        </div>
                      </div>
                    </div>
                    {diffDays(r.fechaIngresoToros, form.fecha) !== null && (
                      <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: -4, marginBottom: 10 }}>
                        Sugerido según fechas: {diffDays(r.fechaIngresoToros, form.fecha)} días de servicio
                      </div>
                    )}

                    {(() => {
                      const vinculado = getLoteIatfVinculado(iatfs, r.iatfInformeId, r.iatfLoteId);
                      if (!vinculado) return null;
                      const inseminadas = parseFloat(vinculado.lote.cantidad) || 0;
                      return (
                        <div style={{ background: T.tealSoft, borderRadius: 8, padding: "10px 12px" }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: T.teal, textTransform: "uppercase" }}>Comparación con el lote de IATF</div>
                          <div style={{ fontSize: 14, color: T.teal, marginTop: 4 }}>
                            {inseminadas} inseminadas · {s.prenadas} preñadas encontradas · <b>{pct(s.prenadas, inseminadas)}% preñez a IATF</b>
                          </div>
                        </div>
                      );
                    })()}
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, margin: "14px 0 10px" }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>C.C. Preñadas</label>
                      <input type="number" value={r.ccPrenadas} onChange={(e) => actualizarRodeo(r.id, { ccPrenadas: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>C.C. Vacías</label>
                      <input type="number" value={r.ccVacias} onChange={(e) => actualizarRodeo(r.id, { ccVacias: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>% Toros en servicio</label>
                      <input type="number" value={r.porcToros} onChange={(e) => actualizarRodeo(r.id, { porcToros: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Puestero a cargo</label>
                    <input value={r.puestero} onChange={(e) => actualizarRodeo(r.id, { puestero: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                  </div>

                  <label style={{ fontSize: 13, color: T.inkSoft }}>Observaciones del rodeo</label>
                  <textarea value={r.observaciones} onChange={(e) => actualizarRodeo(r.id, { observaciones: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff", minHeight: 50, marginTop: 6 }} />
                </div>
              );
            })}
            <button onClick={agregarRodeo} style={{ background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", width: "100%", minWidth: 0, color: T.teal, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
              <Plus size={17} /> Agregar rodeo
            </button>

            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Conclusión / observaciones</label>
              <textarea value={form.conclusion} onChange={(e) => setForm({ ...form, conclusion: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 0", background: "#fff", minHeight: 70 }} />
            </div>

            <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
          </div>
        );
      }

      return (
        <div>
          <EstadoConexion estado={estadoSync} />
          <Membrete width={160} />
          <div style={{ padding: "19px 19px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 21, color: T.ink }}>Diagnóstico de Gestación</div>
              <div style={{ fontSize: 14.5, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "13px 19px", fontWeight: 700, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              <Plus size={20} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <CowCalfIcon size={44} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de gestación para este cliente.</div>
              </div>
            )}
            {[...propios].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => {
              const t = totalesInforme(inf);
              return (
                <div key={inf.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>
                      <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.establecimiento} · {inf.fecha} · {inf.metodo}</div>
                      {t.cantidad > 0 && <div style={{ fontSize: 15, color: T.gold, fontWeight: 700, marginTop: 4 }}>{pct(t.prenadas, t.cantidad)}% preñez · {t.cantidad} cabezas</div>}
                    </div>
                    <div style={{ display: "flex", gap: 10 }}>
                      <button onClick={() => exportarExcelGestacion(inf, cliente, iatfs)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                      <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                      <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function nuevoLote() {
      return {
        id: uid(), nombre: "", cantidad: "", toros: [nuevoToroLote()],
        fechaColocacion: "", fechaRetiro: "", horaRetiroInicio: "", horaRetiroFin: "",
        fechaIATF: "", horaIATFInicio: "", horaIATFFin: "",
        perdidasDispositivo: "", noRespondieron: "",
      };
    }
    /* Horas entre el fin del retiro del dispositivo y el inicio de la IATF (pueden ser días distintos) */
    function horasEntreRetiroYIatf(p) {
      if (!p.fechaRetiro || !p.horaRetiroFin || !p.fechaIATF || !p.horaIATFInicio) return null;
      const inicio = new Date(`${p.fechaRetiro}T${p.horaRetiroFin}:00`);
      const fin = new Date(`${p.fechaIATF}T${p.horaIATFInicio}:00`);
      if (isNaN(inicio.getTime()) || isNaN(fin.getTime())) return null;
      return Math.round(((fin - inicio) / 3600000) * 10) / 10;
    }

      const actualizarLote = (id, patch) => setForm({ ...form, protocolos: form.protocolos.map((p) => p.id === id ? { ...p, ...patch } : p) });

      const quitarLote = (id) => setForm({ ...form, protocolos: form.protocolos.filter((p) => p.id !== id) });

        const cant = parseFloat(p.cantidad) || 0;
        const noResp = parseFloat(p.noRespondieron) || 0;
        const perd = parseFloat(p.perdidasDispositivo) || 0;
        return { cant, respondieron: Math.max(0, cant - noResp), perd, pctResp: pct(cant - noResp, cant), pctPerd: pct(perd, cant) };
      };
      const totalesInforme = (inf) => (inf.protocolos || []).reduce((a, p) => a + (parseFloat(p.cantidad) || 0), 0);
