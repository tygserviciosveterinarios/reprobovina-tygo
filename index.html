                      <div>
                        <div style={{ fontWeight: 700, color: T.ink }}>RP {a.rp || "-"}{a.electronica ? ` · Elec. ${a.electronica}` : ""}</div>
                        <div style={{ fontSize: 13.5, color: T.inkSoft, marginTop: 2 }}>{inf.nombre || inf.establecimiento} · {inf.establecimiento} · {inf.fecha}</div>
                      </div>
                      <span style={{ background: a.resultado === "Apta" ? T.goldSoft : "#E7C9B7", color: a.resultado === "Apta" ? T.gold : T.rust, fontSize: 12.5, fontWeight: 700, padding: "4px 10px", borderRadius: 20 }}>
                        {a.resultado}{a.gdr ? ` · GDR ${a.gdr}` : ""}
                      </span>
                    </div>
                  ))}
                  <div style={{ borderBottom: `1.5px solid ${T.line}`, marginTop: 6 }} />
                </div>
              );
            })()}
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <ListChecks size={38} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de preservicio para este cliente.</div>
              </div>
            )}
            {[...propios].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => {
              const stInf = statsPreservicio(inf);
              const rev = stInf.revisadas, apt = stInf.aptas;
              return (
                <div key={inf.id} onClick={() => abrirReporte(inf)} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12, cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>
                      <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.establecimiento} · {inf.fecha}{inf.cargadoPor && <span style={{ fontStyle: "italic" }}> · {inf.cargadoPor}</span>}</div>
                      {rev > 0 && <div style={{ fontSize: 15, color: T.gold, fontWeight: 700, marginTop: 4 }}>{apt}/{rev} aptas ({pct(apt, rev)}%)</div>}
                    </div>
                    <div style={{ display: "flex", gap: 10 }} onClick={(ev) => ev.stopPropagation()}>
                      <button onClick={() => exportarExcelPreservicio(inf, cliente)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                      <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                      <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function diffDays(isoDesde, isoHasta) {
      if (!isoDesde || !isoHasta) return null;
      const a = new Date(isoDesde + "T00:00:00");
      const b = new Date(isoHasta + "T00:00:00");
      if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
      return Math.round((b - a) / 86400000);
    }
    const CATEGORIAS_RODEO = ["Vaquillona 1° servicio", "Vaquillona 2° servicio", "Vaca seca", "Vaca con cría al pie", "Vaca de cabaña", "Otra"];
    const TIPOS_SERVICIO = ["IATF + Servicio Natural", "IATF Cabeza + Servicio Natural", "IATF exclusiva", "Servicio Natural"];
    const ESTADOS_GENERALES = ["Muy Bueno", "Bueno", "Regular", "Malo"];
    function nuevoRodeo() {
      return {
        id: uid(), nombre: "", categoria: CATEGORIAS_RODEO[0], tipoServicio: TIPOS_SERVICIO[0], estadoGeneral: ESTADOS_GENERALES[0],
        modoCarga: "totales", cantidad: "", prenadas: "", vacias: "", cabeza: "", cuerpo: "", cola: "",
        ccPrenadas: "", ccVacias: "", porcToros: "", cantToros: "", puestero: "", puesto: "", garrapatas: "", animales: [], observaciones: "",
        fechaIngresoToros: "", fechaSalidaToros: "", fechaIATF: "", iatfInformeId: "", iatfLoteId: "",
        diasServicio: "", edadPrenezChica: "",
      };
    }
    function statsRodeo(r) {
      if (r.modoCarga === "rapida") {
        const animales = r.animales || [];
        const cabeza = animales.filter((a) => a.distribucion === "Cabeza").length;
        const cuerpo = animales.filter((a) => a.distribucion === "Cuerpo").length;
        const cola = animales.filter((a) => a.distribucion === "Cola").length;
        return { cantidad: animales.length, prenadas: animales.filter((a) => a.resultado === "Preñada").length, cabeza, cuerpo, cola };
      }
      return { cantidad: parseFloat(r.cantidad) || 0, prenadas: parseFloat(r.prenadas) || 0, cabeza: parseFloat(r.cabeza) || 0, cuerpo: parseFloat(r.cuerpo) || 0, cola: parseFloat(r.cola) || 0 };
    }

    function RodeoQuickEntry({ rodeo, onChange }) {
      const [caravana, setCaravana] = useState("");
      const [pendiente, setPendiente] = useState(false); // true cuando está esperando Cabeza/Cuerpo/Cola
      const animales = rodeo.animales || [];
      const marcar = (resultado, distribucion) => {
        const nuevo = { id: uid(), caravana: caravana.trim(), resultado, distribucion: distribucion || "" };
        onChange({ animales: [...animales, nuevo] });
        playBeep(resultado === "Preñada" ? "positivo" : "negativo");
        setCaravana(""); setPendiente(false);
      };
      const borrarAnimal = (id) => onChange({ animales: animales.filter((a) => a.id !== id) });
      const pren = animales.filter((a) => a.resultado === "Preñada").length;
      const vac = animales.length - pren;
      const caravanasRepetidas = (() => {
        const conteo = {};
        animales.forEach((a) => { if (a.caravana) conteo[a.caravana] = (conteo[a.caravana] || 0) + 1; });
        return new Set(Object.keys(conteo).filter((k) => conteo[k] > 1));
      })();
      return (
        <div>
          <input value={caravana} onChange={(e) => setCaravana(e.target.value)} placeholder="Caravana (opcional)"
            style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, marginBottom: 8, background: "#fff" }} />
          {!pendiente ? (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
              <button onClick={() => setPendiente(true)} style={{ padding: "16px", borderRadius: 10, border: "none", background: T.gold, color: "#fff", fontWeight: 700, fontSize: 17, cursor: "pointer" }}>Preñada</button>
              <button onClick={() => marcar("Vacía")} style={{ padding: "16px", borderRadius: 10, border: "none", background: T.rust, color: "#fff", fontWeight: 700, fontSize: 17, cursor: "pointer" }}>Vacía</button>
            </div>
          ) : (
            <div style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 14.5, color: T.inkSoft, marginBottom: 6 }}>Distribución (opcional):</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 8 }}>
                {["Cabeza", "Cuerpo", "Cola"].map((d) => (
                  <button key={d} onClick={() => marcar("Preñada", d)} style={{ padding: "14px 6px", borderRadius: 10, border: `1.5px solid ${T.gold}`, background: T.goldSoft, color: T.gold, fontWeight: 700, fontSize: 16, cursor: "pointer" }}>{d}</button>
                ))}
              </div>
              <button onClick={() => marcar("Preñada", "")} style={{ background: "none", border: "none", color: T.teal, fontSize: 14.5, fontWeight: 700, cursor: "pointer", marginRight: 12 }}>Sin clasificar</button>
              <button onClick={() => setPendiente(false)} style={{ background: "none", border: "none", color: T.teal, fontSize: 14.5, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
            <div style={{ background: T.goldSoft, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
              <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 26, color: T.gold, lineHeight: 1.1 }}>{pren}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, textTransform: "uppercase" }}>Preñadas</div>
            </div>
            <div style={{ background: "#F4DCCF", borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
              <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 26, color: T.rust, lineHeight: 1.1 }}>{vac}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.rust, textTransform: "uppercase" }}>Vacías</div>
            </div>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
              <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 26, color: T.ink, lineHeight: 1.1 }}>{animales.length}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Total</div>
            </div>
          </div>
          {caravanasRepetidas.size > 0 && (
            <div style={{ marginBottom: 8 }}>
              <span style={{ background: T.rust, color: "#fff", padding: "3px 10px", borderRadius: 20, fontSize: 13, fontWeight: 700 }}>
                ⚠ {caravanasRepetidas.size} caravana{caravanasRepetidas.size > 1 ? "s" : ""} repetida{caravanasRepetidas.size > 1 ? "s" : ""}
              </span>
            </div>
          )}
          {animales.length > 0 && (
            <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${T.line}`, borderRadius: 8 }}>
              {[...animales].reverse().map((a) => {
                const repetida = a.caravana && caravanasRepetidas.has(a.caravana);
                return (
                  <div key={a.id} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 13px",
                    borderBottom: `1px solid ${T.line}`, fontSize: 15, background: repetida ? "#E7C9B7" : "transparent",
                  }}>
                    <span style={{ color: repetida ? T.rust : T.ink, fontWeight: repetida ? 700 : 400 }}>{a.caravana || "s/n"}{repetida ? " ⚠" : ""}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: a.resultado === "Preñada" ? T.gold : T.rust, fontWeight: 700 }}>{a.resultado}{a.distribucion ? ` · ${a.distribucion}` : ""}</span>
                      <button onClick={() => borrarAnimal(a.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><X size={16} /></button>
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function getLoteIatfVinculado(iatfs, iatfInformeId, iatfLoteId) {
      if (!iatfInformeId || !iatfLoteId) return null;
      const inf = iatfs.find((i) => i.id === iatfInformeId);
      if (!inf) return null;
      const lote = (inf.protocolos || []).find((p) => p.id === iatfLoteId);
      if (!lote) return null;
      return { inf, lote };
    }

    function ResumenEstablecimiento({ cliente, establecimiento, informes, historicos, guardarHistorico, borrarHistorico, onBack }) {
      const propios = informes.filter((i) => i.clienteId === cliente.id && i.establecimiento === establecimiento);
      const aniosConDatos = Array.from(new Set(propios.map(anioDeInforme))).sort((a, b) => b.localeCompare(a));
      const anioActual = String(new Date().getFullYear());
      const [anioSel, setAnioSel] = useState(aniosConDatos[0] || anioActual);
      const [nuevoAnio, setNuevoAnio] = useState("");
      const [nuevoPct, setNuevoPct] = useState("");

      const gY = propios.filter((i) => anioDeInforme(i) === anioSel);
      const porCategoria = {};
      let totCant = 0, totPren = 0;
      gY.forEach((inf) => (inf.rodeos || []).forEach((r) => {
        const s = statsRodeo(r);
        const cat = r.categoria || "Sin categoría";
        if (!porCategoria[cat]) porCategoria[cat] = { cantidad: 0, prenadas: 0 };
        porCategoria[cat].cantidad += s.cantidad;
        porCategoria[cat].prenadas += s.prenadas;
        totCant += s.cantidad; totPren += s.prenadas;
      }));
      const filasCategoria = Object.entries(porCategoria);

      const historicosEstab = historicos.filter((h) => h.clienteId === cliente.id && h.establecimiento === establecimiento);

      // % por año calculado desde la app
      const porAnioApp = {};
      propios.forEach((inf) => (inf.rodeos || []).forEach((r) => {
        const anio = anioDeInforme(inf);
        const s = statsRodeo(r);
        if (!porAnioApp[anio]) porAnioApp[anio] = { cantidad: 0, prenadas: 0 };
        porAnioApp[anio].cantidad += s.cantidad;
        porAnioApp[anio].prenadas += s.prenadas;
      }));

      // Serie combinada: años con datos de la app (calculado) + años cargados a mano (solo si no hay datos de la app ese año)
      const serie = {};
      Object.keys(porAnioApp).forEach((anio) => { serie[anio] = { pctv: pct(porAnioApp[anio].prenadas, porAnioApp[anio].cantidad), manual: false }; });
      historicosEstab.forEach((h) => {
        if (!serie[h.anio]) serie[h.anio] = { pctv: parseFloat(h.porcentaje) || 0, manual: true, id: h.id };
      });
      const serieOrdenada = Object.entries(serie).sort((a, b) => a[0].localeCompare(b[0]));
      const maxPct = Math.max(100, ...serieOrdenada.map(([, v]) => v.pctv));

      const agregarHistorico = () => {
        if (!nuevoAnio || nuevoPct === "") return;
        if (porAnioApp[nuevoAnio]) { alert(`Ya hay datos cargados en la app para ${nuevoAnio}, no hace falta anotarlo a mano.`); return; }
        guardarHistorico({ clienteId: cliente.id, establecimiento, anio: nuevoAnio, porcentaje: nuevoPct });
        setNuevoAnio(""); setNuevoPct("");
      };

      return (
        <div>
          <div style={{ padding: "16px 16px 4px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <button onClick={onBack} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
              <ChevronDown size={19} style={{ transform: "rotate(90deg)" }} /> Volver
            </button>
            <button onClick={() => window.print()} style={{ background: "none", border: "none", color: T.ink, cursor: "pointer" }} title="Imprimir">
              <Download size={22} />
            </button>
          </div>
          <div style={{ padding: "0 16px 8px" }}>
            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 22, color: T.ink }}>Tactos {establecimiento}</div>
            <div style={{ fontSize: 15, color: T.inkSoft }}>{cliente.nombre}</div>
          </div>
          <Membrete width={190} />
          <div style={{ padding: "8px 16px 90px" }}>
            <div style={{ marginBottom: 10 }}>
              <label style={{ fontSize: 13, color: T.inkSoft }}>Año a detallar</label>
              <select value={anioSel} onChange={(e) => setAnioSel(e.target.value)} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                {aniosConDatos.length === 0 && <option value={anioActual}>{anioActual}</option>}
                {aniosConDatos.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>

            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink, marginBottom: 10 }}>Porcentaje de preñez general {anioSel}</div>
            <div style={{ border: `1.5px solid ${T.line}`, borderRadius: 12, overflow: "hidden", marginBottom: 24 }}>
              <div style={{ background: T.rust, color: "#fff", padding: "10px 12px", fontWeight: 700, fontSize: 14, textAlign: "center" }}>Porcentaje de preñez general {anioSel}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr 1fr 1fr", background: T.paper, fontSize: 12.5, fontWeight: 700, color: T.inkSoft, padding: "8px 6px", borderBottom: `1.5px solid ${T.line}` }}>
                <div>Lote</div><div style={{ textAlign: "center" }}>Cant.</div><div style={{ textAlign: "center" }}>Preñ.</div><div style={{ textAlign: "center" }}>Vacías</div><div style={{ textAlign: "center" }}>%</div>
              </div>
              {filasCategoria.length === 0 && (
                <div style={{ padding: 16, textAlign: "center", color: T.inkSoft, fontSize: 14 }}>Sin datos cargados para {anioSel}.</div>
              )}
              {filasCategoria.map(([cat, s], i) => (
                <div key={cat} style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr 1fr 1fr", fontSize: 13.5, padding: "8px 6px", borderBottom: `1px solid ${T.line}`, background: i % 2 ? T.card : "#fff" }}>
                  <div>{cat}</div>
                  <div style={{ textAlign: "center" }}>{s.cantidad}</div>
                  <div style={{ textAlign: "center", fontStyle: "italic" }}>{s.prenadas}</div>
                  <div style={{ textAlign: "center" }}>{s.cantidad - s.prenadas}</div>
                  <div style={{ textAlign: "center", fontWeight: 700 }}>{pct(s.prenadas, s.cantidad)}%</div>
                </div>
              ))}
              {filasCategoria.length > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr 1fr 1fr", fontSize: 14.5, fontWeight: 800, padding: "10px 6px", background: T.goldSoft }}>
                  <div>TOTAL</div>
                  <div style={{ textAlign: "center" }}>{totCant}</div>
                  <div style={{ textAlign: "center", fontStyle: "italic" }}>{totPren}</div>
                  <div style={{ textAlign: "center" }}>{totCant - totPren}</div>
                  <div style={{ textAlign: "center" }}>{pct(totPren, totCant)}%</div>
                </div>
              )}
            </div>

            <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink, marginBottom: 14, textAlign: "center" }}>Porcentaje preñez por año</div>
            <div style={{ border: `1.5px solid ${T.line}`, borderRadius: 12, background: "#fff", padding: "18px 12px 12px" }}>
              {serieOrdenada.length === 0 ? (
                <div style={{ textAlign: "center", color: T.inkSoft, fontSize: 14 }}>Todavía no hay datos ni años cargados.</div>
              ) : (
                <div style={{ position: "relative" }}>
                  <div style={{ position: "absolute", left: 4, right: 4, bottom: 40, height: 130, pointerEvents: "none" }}>
                    {[0, 25, 50, 75, 100].map((p) => (
                      <div key={p} style={{ position: "absolute", left: 0, right: 0, bottom: `${Math.min(100, (p / maxPct) * 100)}%`, borderTop: "1px dashed rgba(28,43,34,0.14)" }} />
                    ))}
                  </div>
                  <div style={{ display: "flex", alignItems: "flex-end", justifyContent: serieOrdenada.length <= 8 ? "center" : "flex-start", gap: 16, height: 230, paddingTop: 26, overflowX: "auto", overflowY: "hidden", position: "relative" }}>
                    {serieOrdenada.map(([anio, v]) => {
                      const esSel = anio === anioSel;
                      const gradiente = esSel ? "linear-gradient(180deg,#C4602E 0%,#A6491F 100%)" : v.manual ? "linear-gradient(180deg,#2E8484 0%,#1F6B6B 100%)" : "linear-gradient(180deg,#B08A3A 0%,#8A6D1E 100%)";
                      return (
                        <div key={anio} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 auto", width: 54 }}>
                          <div style={{ fontSize: 13, fontWeight: 800, color: T.ink, marginBottom: 5, whiteSpace: "nowrap" }}>{v.pctv}%</div>
                          <div style={{
                            width: 32, height: Math.max(4, (v.pctv / maxPct) * 130),
                            backgroundImage: gradiente, borderRadius: "6px 6px 3px 3px",
                            boxShadow: "0 3px 6px rgba(166,73,31,0.18)", position: "relative",
                          }}>
                            {esSel && (
                              <div style={{ position: "absolute", top: -9, left: "50%", transform: "translateX(-50%)", width: 14, height: 14, borderRadius: "50%", background: "#fff", border: `2.5px solid ${T.rust}` }} />
                            )}
                          </div>
                          <div style={{ fontSize: 12.5, color: esSel ? T.rust : T.inkSoft, fontWeight: esSel ? 800 : 600, marginTop: 7, whiteSpace: "nowrap" }}>{anio}</div>
                          {v.manual && (
                            <button onClick={() => { if (window.confirm(`¿Borrar el % cargado a mano de ${anio}?`)) borrarHistorico(v.id); }} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", padding: 2 }}>
                              <Trash2 size={13} />
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div style={{ fontSize: 12, color: T.inkSoft, textAlign: "center", marginTop: 10 }}>
                <span style={{ color: T.gold }}>●</span> calculado en la app &nbsp; <span style={{ color: T.teal }}>●</span> cargado a mano
              </div>
            </div>
            <div style={{ marginBottom: 24 }} />

            <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Cargar % de un año anterior</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 8, marginBottom: 8 }}>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>Año</label>
                <input type="number" placeholder="Ej: 2020" value={nuevoAnio} onChange={(e) => setNuevoAnio(e.target.value)} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
              </div>
              <div>
                <label style={{ fontSize: 13, color: T.inkSoft }}>% Preñez</label>
                <input type="number" placeholder="Ej: 78,7" value={nuevoPct} onChange={(e) => setNuevoPct(e.target.value)} style={{ width: "100%", minWidth: 0, padding: "10px 12px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
              </div>
              <button onClick={agregarHistorico} style={{ alignSelf: "end", background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "10px 16px", fontWeight: 700, cursor: "pointer" }}>
                <Plus size={17} />
              </button>
            </div>
            <div style={{ fontSize: 12.5, color: T.inkSoft }}>
              Solo hace falta cargar a mano los años en los que todavía no usabas la app (por ejemplo, si en {cliente.nombre} - {establecimiento} tenés registro desde 2020 pero recién empezaste a usar la app este año).
            </div>
          </div>
        </div>
      );
    }

    function GestacionView({ cliente, informes, guardar, borrar, estadoSync, iatfs = [], todosInformes = [], historicos = [], guardarHistorico, borrarHistorico }) {
      const [vista, setVista] = useState("lista");
      const [editando, setEditando] = useState(null);
      const [viendoId, setViendoId] = useState(null);
      const [establecimientoAbierto, setEstablecimientoAbierto] = useState(null);
      const [viendoResumenEstab, setViendoResumenEstab] = useState(null);
      const [conclusionEdit, setConclusionEdit] = useState("");
      const [conclusionManual, setConclusionManual] = useState(false);
      useEffect(() => {
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual) return;
        setConclusionManual(!!infActual.conclusionManual);
        if (infActual.conclusionManual) {
          setConclusionEdit(infActual.conclusion != null ? infActual.conclusion : generarConclusionGestacion(infActual));
        } else {
          setConclusionEdit(generarConclusionGestacion(infActual));
        }
      }, [viendoId, informes]);
      useEffect(() => {
        if (vista !== "reporte" || !viendoId || !conclusionManual) return;
        const infActual = informes.find((i) => i.id === viendoId);
        if (!infActual || (infActual.conclusion === conclusionEdit && infActual.conclusionManual)) return;
        const t = setTimeout(() => guardar({ ...infActual, conclusion: conclusionEdit, conclusionManual: true }), 900);
        return () => clearTimeout(t);
      }, [conclusionEdit, conclusionManual]);
      const vacio = () => ({
        nombre: "", numero: "",
        fecha: new Date().toISOString().slice(0, 10),
        establecimiento: (cliente.establecimientos && cliente.establecimientos[0] && cliente.establecimientos[0].nombre) || "",
        metodo: "Tacto rectal",
        rodeos: [nuevoRodeo()],
        conclusion: "",
      });
      const [form, setForm] = useState(vacio());
      const [ultimoGuardado, setUltimoGuardado] = useState(null);

      const propios = informes.filter((i) => i.clienteId === cliente.id);
      const abrirNuevo = () => { const id = uid(); setEditando(id); setForm(vacio()); setVista("form"); setUltimoGuardado(null); };
      const abrirEditar = (inf) => { setEditando(inf.id); setForm(inf); setVista("form"); setUltimoGuardado(null); };
      const hayContenidoGestacion = (f) => (f.rodeos || []).some((r) => r.cantidad || r.prenadas || (r.animales || []).length > 0) || f.nombre;
      const guardarAvance = () => {
        if (!editando || !hayContenidoGestacion(form)) return;
        guardar({ ...form, id: editando, clienteId: cliente.id });
        setUltimoGuardado(Date.now());
      };
      useEffect(() => {
        if (vista !== "form" || !editando || !hayContenidoGestacion(form)) return;
        const t = setTimeout(() => { guardar({ ...form, id: editando, clienteId: cliente.id }); setUltimoGuardado(Date.now()); }, 2500);
        return () => clearTimeout(t);
      }, [form, editando, vista]);
      const confirmarGuardar = () => {
        const numeroFinal = form.numero || proximoNumero(todosInformes, form.fecha);
        const idFinal = editando || uid();
        guardar({ ...form, numero: numeroFinal, id: idFinal, clienteId: cliente.id });
        setViendoId(idFinal);
        setVista("reporte");
      };
      const abrirReporte = (inf) => { setViendoId(inf.id); setVista("reporte"); };
      const eliminar = (id) => { if (window.confirm("¿Eliminar este informe?")) { borrar(id); setVista("lista"); } };

      const actualizarRodeo = (id, patch) => setForm({ ...form, rodeos: form.rodeos.map((r) => r.id === id ? { ...r, ...patch } : r) });
      const agregarRodeo = () => setForm({ ...form, rodeos: [...form.rodeos, nuevoRodeo()] });
      const quitarRodeo = (id) => setForm({ ...form, rodeos: form.rodeos.filter((r) => r.id !== id) });

      const totalesInforme = (inf) => (inf.rodeos || []).reduce((acc, r) => {
        const s = statsRodeo(r);
        acc.cantidad += s.cantidad;
        acc.prenadas += s.prenadas;
        return acc;
      }, { cantidad: 0, prenadas: 0 });

      const informeMostrado = informes.find((i) => i.id === viendoId) || null;

      if (viendoResumenEstab) {
        return (
          <ResumenEstablecimiento
            cliente={cliente} establecimiento={viendoResumenEstab} informes={informes}
            historicos={historicos} guardarHistorico={guardarHistorico} borrarHistorico={borrarHistorico}
            onBack={() => setViendoResumenEstab(null)}
          />
        );
      }

      if (vista === "reporte" && informeMostrado) {
        const inf = informeMostrado;
        const rodeos = inf.rodeos || [];
        const tot = totalesInforme(inf);
        const porCategoria = (() => {
          const conteo = {};
          rodeos.forEach((r) => {
            const s = statsRodeo(r);
            const cat = r.categoria || "Sin categoría";
            if (!conteo[cat]) conteo[cat] = { cantidad: 0, prenadas: 0 };
            conteo[cat].cantidad += s.cantidad;
            conteo[cat].prenadas += s.prenadas;
          });
          return Object.entries(conteo).sort((a, b) => b[1].cantidad - a[1].cantidad);
        })();
        const distribucion = rodeos.reduce((acc, r) => {
          const s = statsRodeo(r);
          acc.cabeza += s.cabeza || 0; acc.cuerpo += s.cuerpo || 0; acc.cola += s.cola || 0;
          return acc;
        }, { cabeza: 0, cuerpo: 0, cola: 0 });
        const hayDistribucion = distribucion.cabeza || distribucion.cuerpo || distribucion.cola;
        return (
          <div>
            <div style={{ padding: "16px 16px 4px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <button onClick={() => setVista("lista")} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer", fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                <ChevronDown size={19} style={{ transform: "rotate(90deg)" }} /> Volver
              </button>
              <button onClick={() => window.print()} style={{ background: "none", border: "none", color: T.ink, cursor: "pointer" }} title="Imprimir">
                <Download size={22} />
              </button>
            </div>
            <div style={{ padding: "0 16px 8px" }}>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 24, color: T.ink }}>{inf.nombre || "Diagnóstico de Gestación"}</div>
              <div style={{ fontSize: 15, color: T.inkSoft }}>{inf.fecha}{inf.numero ? ` · N° ${inf.numero}` : ""} · {inf.metodo}</div>
            </div>
            <Membrete width={210} />
            <div style={{ padding: "8px 16px 90px" }}>
              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "13px 15px", marginBottom: 14 }}>
                Cliente: <b>{cliente.nombre}</b> · {tot.cantidad} cabezas tactadas en {rodeos.length} rodeo{rodeos.length !== 1 ? "s" : ""}
                <div style={{ fontSize: 14, color: T.inkSoft, marginTop: 2 }}>{inf.establecimiento}</div>
              </div>

                  <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, textTransform: "uppercase" }}>Preñadas</div>
                  <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 28, color: T.gold, margin: "4px 0" }}>{tot.prenadas}</div>
                  <div style={{ fontSize: 13, color: T.gold }}>{pct(tot.prenadas, tot.cantidad)}%</div>
                </div>
                <div style={{ background: T.tealSoft, borderRadius: 12, padding: "16px 8px", textAlign: "center" }}>

                  <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 28, color: T.teal, margin: "4px 0" }}>{tot.cantidad - tot.prenadas}</div>
                  <div style={{ fontSize: 13, color: T.teal }}>{pct(tot.cantidad - tot.prenadas, tot.cantidad)}%</div>
                </div>
                <div style={{ background: "#E3D9C0", borderRadius: 12, padding: "16px 8px", textAlign: "center" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: T.ink, textTransform: "uppercase" }}>Total</div>
                  <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 28, color: T.ink, margin: "4px 0" }}>{tot.cantidad}</div>
                  <div style={{ fontSize: 13, color: T.ink }}>100%</div>
                </div>
              </div>

              <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Detalle por categoría</div>
              <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20 }}>
                {porCategoria.map(([cat, s], i) => (
                  <div key={cat} style={{ marginBottom: i < porCategoria.length - 1 ? 10 : 0 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4 }}>
                      <span>{cat}</span><span style={{ fontWeight: 700 }}>{s.prenadas}/{s.cantidad} · {pct(s.prenadas, s.cantidad)}%</span>
                    </div>
                    <div style={{ background: T.line, borderRadius: 4, height: 6 }}>
                      <div style={{ background: T.gold, borderRadius: 4, height: 6, width: `${pct(s.prenadas, s.cantidad)}%` }} />
                    </div>
                  </div>

              </div>

              {hayDistribucion > 0 && (
                <React.Fragment>
                  <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>Preñez por etapa (Cabeza / Cuerpo / Cola)</div>
                  <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20 }}>
                    {[["Cabeza", distribucion.cabeza], ["Cuerpo", distribucion.cuerpo], ["Cola", distribucion.cola]].map(([label, n], i) => (
                      <div key={label} style={{ marginBottom: i < 2 ? 10 : 0 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4 }}>

                        <div style={{ background: T.line, borderRadius: 4, height: 6 }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase" }}>Conclusión (para el PDF del productor — editable)</div>
                {conclusionManual && (
                  <button onClick={() => { setConclusionEdit(generarConclusionGestacion(inf)); setConclusionManual(false); guardar({ ...inf, conclusionManual: false }); }}
                    style={{ background: "none", border: "none", color: T.teal, fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>↺ Volver a automática</button>

              </div>
              <textarea value={conclusionEdit} onChange={(e) => { setConclusionEdit(e.target.value); setConclusionManual(true); }}
                style={{ width: "100%", minWidth: 0, background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 20, fontSize: 14.5, color: T.ink, minHeight: 110 }} />

              <div style={{ display: "grid", gridTemplateColumns: "auto auto 1fr auto", gap: 8 }}>
                <button onClick={() => generarPDFGestacion({ ...inf, conclusion: conclusionEdit }, cliente, iatfs)} style={{ background: T.rust, color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                  <Download size={18} /> PDF
                </button>
                <button onClick={() => exportarExcelGestacion(inf, cliente, iatfs)} style={{ background: T.teal, color: "#fff", border: "none", borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                  <Download size={18} /> Excel
                </button>
                <button onClick={() => abrirEditar(inf)} style={{ background: "#fff", color: T.ink, border: `1.5px solid ${T.line}`, borderRadius: 10, padding: "13px 16px", fontWeight: 700, cursor: "pointer" }}>Editar informe</button>
                <button onClick={() => eliminar(inf.id)} style={{ background: T.rust, color: "#fff", border: "none", borderRadius: 10, padding: "13px", cursor: "pointer" }}><Trash2 size={20} /></button>
              </div>
            </div>
          </div>
        );
      }

      if (vista === "form") {
        return (
          <div style={{ padding: "16px 16px 90px" }}>
            <button onClick={() => { if (window.confirm("¿Volver sin guardar los cambios de este informe?")) setVista("lista"); }} style={{ background: "none", border: "none", color: T.teal, marginBottom: 6, cursor: "pointer", fontWeight: 700, fontSize: 17, padding: "12px 10px 12px 0", minHeight: 44 }}>&larr; Volver</button>
            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 10 }}>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Nombre del informe (opcional)</label>
                  <input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej: Gestación Saravia 2026" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
                <div>
                  <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>N° de informe</label>
                  <input value={form.numero} onChange={(e) => setForm({ ...form, numero: e.target.value })} placeholder="Opcional" style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
                </div>
              </div>
              {numeroInformeDuplicado(todosInformes, form.numero, form.fecha, editando) && (
                <div style={{ background: T.rust, color: "#fff", borderRadius: 8, padding: "10px 12px", marginBottom: 12, fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
                  <AlertTriangle size={16} /> Ya existe un informe N° {form.numero} para este año
                </div>
              )}
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Fecha</label>
              <input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Establecimiento</label>
              {(cliente.establecimientos || []).length > 0 ? (
                <select value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }}>
                  {cliente.establecimientos.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                </select>
              ) : (
                <input value={form.establecimiento} onChange={(e) => setForm({ ...form, establecimiento: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }} />
              )}

              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Método</label>
              <select value={form.metodo} onChange={(e) => setForm({ ...form, metodo: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 12px", background: "#fff" }}>
                <option>Tacto rectal</option>
                <option>Ecografía</option>
              </select>
            </div>

            {form.rodeos.map((r, i) => {
              const s = statsRodeo(r);
              return (
                <div key={r.id} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontWeight: 700, color: T.ink }}>Rodeo {i + 1}</div>
                    {form.rodeos.length > 1 && <button onClick={() => quitarRodeo(r.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={19} /></button>}
                  </div>
                  <input placeholder="Nombre del rodeo (opcional)" value={r.nombre || ""} onChange={(e) => actualizarRodeo(r.id, { nombre: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, marginBottom: 10, background: "#fff" }} />

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Categoría</label>
                      <select value={r.categoria} onChange={(e) => actualizarRodeo(r.id, { categoria: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                        {CATEGORIAS_RODEO.map((c) => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Tipo de servicio</label>
                      <select value={r.tipoServicio} onChange={(e) => actualizarRodeo(r.id, { tipoServicio: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15.5, background: "#fff" }}>
                        {TIPOS_SERVICIO.map((c) => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Estado general</label>
                    <select value={r.estadoGeneral} onChange={(e) => actualizarRodeo(r.id, { estadoGeneral: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                      {ESTADOS_GENERALES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>

                    <label style={{ fontSize: 13, color: T.inkSoft }}>Vincular con informe de IATF (opcional)</label>

                  </div>

                  {r.modoCarga === "rapida" ? (
                    <RodeoQuickEntry rodeo={r} onChange={(patch) => actualizarRodeo(r.id, patch)} />
                  ) : (
                    <React.Fragment>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad tactadas</label>
                          <input type="number" value={r.cantidad} onChange={(e) => {
                            const cant = e.target.value;
                            const pren = parseFloat(r.prenadas) || 0;
                            actualizarRodeo(r.id, { cantidad: cant, vacias: cant !== "" ? Math.max(0, (parseFloat(cant) || 0) - pren) : r.vacias });
                          }} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Preñadas</label>
                          <input type="number" value={r.prenadas} onChange={(e) => {
                            const pren = e.target.value;
                            const cant = parseFloat(r.cantidad) || 0;
                            actualizarRodeo(r.id, { prenadas: pren, vacias: cant > 0 ? Math.max(0, cant - (parseFloat(pren) || 0)) : r.vacias });
                          }} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                      </div>
                      <div style={{ marginBottom: 10 }}>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Vacías <span style={{ fontWeight: 400, textTransform: "none" }}>(se completa sola, la podés corregir)</span></label>
                        <input type="number" value={r.vacias} onChange={(e) => actualizarRodeo(r.id, { vacias: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8, marginBottom: 4 }}>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cabeza</label>
                          <input type="number" value={r.cabeza} onChange={(e) => actualizarRodeo(r.id, { cabeza: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cuerpo</label>
                          <input type="number" value={r.cuerpo} onChange={(e) => actualizarRodeo(r.id, { cuerpo: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 13, color: T.inkSoft }}>Cola</label>
                          <input type="number" value={r.cola} onChange={(e) => actualizarRodeo(r.id, { cola: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        </div>
                      </div>
                    </React.Fragment>
                  )}
                  {s.prenadas > 0 && (s.cabeza || s.cuerpo || s.cola) > 0 && (
                    <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 12, padding: "12px 10px", marginBottom: 12 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", textAlign: "center", marginBottom: 10 }}>Distribución de preñez</div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8 }}>
                        {[["Cabeza", s.cabeza], ["Cuerpo", s.cuerpo], ["Cola", s.cola]].map(([label, n]) => (
                          <div key={label} style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                            <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 22, color: T.teal, lineHeight: 1.1 }}>{n}</div>
                            <div style={{ fontSize: 12, fontWeight: 700, color: T.ink, marginTop: 2 }}>{label}</div>
                            <div style={{ fontSize: 12.5, color: T.inkSoft }}>{pct(n, s.prenadas)}%</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div style={{ background: T.goldSoft, borderRadius: 8, padding: "11px 13px", marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: T.gold, textTransform: "uppercase" }}>% Preñez calculado</span>
                    <span style={{ fontWeight: 700, fontSize: 18, color: T.gold }}>{pct(s.prenadas, s.cantidad)}%</span>
                  </div>

                  <div style={{ background: T.paper, borderRadius: 12, padding: 14, marginTop: 14 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 10 }}>Servicio</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Fecha IATF (si hubo)</label>
                        <div style={{ display: "flex", gap: 6 }}>
                          <input type="date" value={r.fechaIATF} onChange={(e) => actualizarRodeo(r.id, { fechaIATF: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 15, background: "#fff" }} />
                          {r.fechaIATF && <button onClick={() => actualizarRodeo(r.id, { fechaIATF: "" })} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", flexShrink: 0 }}><X size={18} /></button>}
                        </div>
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Ingreso de toros</label>
                        <div style={{ display: "flex", gap: 6 }}>
                          <input type="date" value={r.fechaIngresoToros} onChange={(e) => actualizarRodeo(r.id, { fechaIngresoToros: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                          {r.fechaIngresoToros && <button onClick={() => actualizarRodeo(r.id, { fechaIngresoToros: "" })} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", flexShrink: 0 }}><X size={18} /></button>}
                        </div>
                      </div>
                    </div>
                    <div style={{ marginBottom: 10 }}>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Salida de toros</label>
                      <div style={{ display: "flex", gap: 6 }}>
                        <input type="date" value={r.fechaSalidaToros} onChange={(e) => actualizarRodeo(r.id, { fechaSalidaToros: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                        {r.fechaSalidaToros && <button onClick={() => actualizarRodeo(r.id, { fechaSalidaToros: "" })} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", flexShrink: 0 }}><X size={18} /></button>}
                      </div>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Días de servicio</label>
                        <input type="number" value={r.diasServicio} onChange={(e) => actualizarRodeo(r.id, { diasServicio: e.target.value })} placeholder={String(diffDays(r.fechaIATF || r.fechaIngresoToros, r.fechaSalidaToros) ?? "")} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Edad preñez más chica (días)</label>
                        <div style={{ padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#f3eedd", color: T.inkSoft, fontWeight: 700 }}>
                          {diffDays(r.fechaSalidaToros, form.fecha) ?? "—"}
                        </div>
                      </div>
                    </div>
                    {diffDays(r.fechaIATF || r.fechaIngresoToros, r.fechaSalidaToros) !== null && (
                      <div style={{ fontSize: 12.5, color: T.inkSoft, marginTop: -4, marginBottom: 10 }}>
                        Sugerido según fechas: {diffDays(r.fechaIATF || r.fechaIngresoToros, r.fechaSalidaToros)} días de servicio
                      </div>
                    )}

                    {(() => {
                      const vinculado = getLoteIatfVinculado(iatfs, r.iatfInformeId, r.iatfLoteId);
                      if (!vinculado) return null;
                      const inseminadas = parseFloat(vinculado.lote.cantidad) || 0;
                      return (
                        <div style={{ background: T.tealSoft, borderRadius: 8, padding: "10px 12px" }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: T.teal, textTransform: "uppercase" }}>Comparación con el lote de IATF</div>
                          <div style={{ fontSize: 14, color: T.teal, marginTop: 4 }}>
                            {inseminadas} inseminadas · {s.prenadas} preñadas encontradas · <b>{pct(s.prenadas, inseminadas)}% preñez a IATF</b>
                          </div>
                        </div>
                      );
                    })()}
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, margin: "14px 0 10px" }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>C.C. Preñadas</label>
                      <input type="number" value={r.ccPrenadas} onChange={(e) => actualizarRodeo(r.id, { ccPrenadas: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>C.C. Vacías</label>
                      <input type="number" value={r.ccVacias} onChange={(e) => actualizarRodeo(r.id, { ccVacias: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                  </div>
                  <div style={{ background: T.paper, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, textTransform: "uppercase", marginBottom: 8 }}>
                      Toros en servicio {s.cantidad > 0 && <span style={{ fontWeight: 400, textTransform: "none" }}>(sobre {s.cantidad} vacas revisadas)</span>}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8 }}>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>Cantidad de toros</label>
                        <input type="number" value={r.cantToros || ""} onChange={(e) => {
                          const cant = e.target.value;
                          const porc = (cant !== "" && s.cantidad > 0) ? String(Math.round((parseFloat(cant) / s.cantidad) * 1000) / 10) : r.porcToros;
                          actualizarRodeo(r.id, { cantToros: cant, porcToros: porc });
                        }} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                      <div>
                        <label style={{ fontSize: 13, color: T.inkSoft }}>% Toros en servicio</label>
                        <input type="number" value={r.porcToros} onChange={(e) => {
                          const porc = e.target.value;
                          const cant = (porc !== "" && s.cantidad > 0) ? String(Math.round((parseFloat(porc) / 100) * s.cantidad)) : r.cantToros;
                          actualizarRodeo(r.id, { porcToros: porc, cantToros: cant });
                        }} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                      </div>
                    </div>
                    <div style={{ fontSize: 12, color: T.inkSoft, marginTop: 6 }}>Completá uno de los dos y el otro se calcula solo. Se recalcula si cambia la cantidad de vacas revisadas.</div>
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 8, marginBottom: 10 }}>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Puesto</label>
                      <input value={r.puesto} onChange={(e) => actualizarRodeo(r.id, { puesto: e.target.value })} placeholder="Ej: Puesto 3" style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 13, color: T.inkSoft }}>Garrapatas</label>
                      <select value={r.garrapatas} onChange={(e) => actualizarRodeo(r.id, { garrapatas: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }}>
                        <option value="">-</option>
                        <option value="+">+</option>
                        <option value="++">++</option>
                        <option value="+++">+++</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    <label style={{ fontSize: 13, color: T.inkSoft }}>Puestero a cargo</label>
                    <input value={r.puestero} onChange={(e) => actualizarRodeo(r.id, { puestero: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff" }} />
                  </div>

                  <label style={{ fontSize: 13, color: T.inkSoft }}>Observaciones del rodeo</label>
                  <textarea value={r.observaciones} onChange={(e) => actualizarRodeo(r.id, { observaciones: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "11px 13px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 16.5, background: "#fff", minHeight: 50, marginTop: 6 }} />
                </div>
              );
            })}
            <button onClick={agregarRodeo} style={{ background: "none", border: `1.5px dashed ${T.line}`, borderRadius: 10, padding: "10px", width: "100%", minWidth: 0, color: T.teal, fontWeight: 700, cursor: "pointer", marginBottom: 14 }}>
              <Plus size={17} /> Agregar rodeo
            </button>

            <div style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <label style={{ fontSize: 14.5, fontWeight: 700, color: T.inkSoft }}>Conclusión / observaciones</label>
              <textarea value={form.conclusion} onChange={(e) => setForm({ ...form, conclusion: e.target.value })} style={{ width: "100%", minWidth: 0, padding: "13px 15px", borderRadius: 8, border: `1.5px solid ${T.line}`, fontSize: 17, margin: "6px 0 0", background: "#fff", minHeight: 70 }} />
            </div>

            <button onClick={guardarAvance} style={{ width: "100%", minWidth: 0, background: "none", border: `1.5px solid ${T.teal}`, color: T.teal, borderRadius: 8, padding: "13px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", marginBottom: 8 }}>
              Guardar avance (sin cerrar el informe)
            </button>
            {ultimoGuardado && (
              <div style={{ textAlign: "center", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>
                ✓ Guardado automáticamente {new Date(ultimoGuardado).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
              </div>
            )}

            <button onClick={confirmarGuardar} style={{ width: "100%", minWidth: 0, background: T.ink, color: T.paper, border: "none", borderRadius: 8, padding: "16px", fontSize: 17, fontWeight: 700, cursor: "pointer" }}>Guardar informe</button>
          </div>
        );
      }

      return (
        <div>
          <EstadoConexion estado={estadoSync} />
          <Membrete width={160} />
          <div style={{ padding: "19px 19px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 21, color: T.ink }}>Diagnóstico de Gestación</div>
              <div style={{ fontSize: 14.5, color: T.inkSoft }}>Cliente: {cliente.nombre}</div>
            </div>
            <button onClick={abrirNuevo} style={{ background: T.ink, color: T.paper, border: "none", borderRadius: 10, padding: "13px 19px", fontWeight: 700, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              <Plus size={20} /> Nuevo
            </button>
          </div>
          <div style={{ padding: "0 16px 90px" }}>
            {propios.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 20px", color: T.inkSoft }}>
                <CowCalfIcon size={44} style={{ opacity: 0.4, marginBottom: 10 }} />
                <div>Todavía no hay informes de gestación para este cliente.</div>
              </div>
            )}
            {Object.entries(
              propios.reduce((acc, inf) => {
                const key = inf.establecimiento || "Sin establecimiento";
                (acc[key] = acc[key] || []).push(inf);
                return acc;
              }, {})
            ).sort((a, b) => a[0].localeCompare(b[0])).map(([estab, lista]) => {
              const abierto = establecimientoAbierto === estab;
              const totalEstab = lista.reduce((acc, inf) => {
                const t = totalesInforme(inf);
                acc.cantidad += t.cantidad; acc.prenadas += t.prenadas;
                return acc;
              }, { cantidad: 0, prenadas: 0 });
              return (
                <div key={estab} style={{ marginBottom: 14 }}>
                  <div style={{
                    width: "100%", minWidth: 0, background: T.tealSoft, border: `1.5px solid ${T.teal}`, borderRadius: 12,
                    padding: "13px 15px", display: "flex", justifyContent: "space-between", alignItems: "center",
                  }}>
                    <button onClick={() => setEstablecimientoAbierto(abierto ? null : estab)} style={{ background: "none", border: "none", cursor: "pointer", textAlign: "left", flex: 1, padding: 0 }}>
                      <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.teal }}>{estab}</div>
                      <div style={{ fontSize: 13.5, color: T.inkSoft }}>
                        {lista.length} informe{lista.length !== 1 ? "s" : ""}
                        {totalEstab.cantidad > 0 && ` · ${pct(totalEstab.prenadas, totalEstab.cantidad)}% preñez`}
                      </div>
                    </button>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <button onClick={() => setViendoResumenEstab(estab)} title="Ver resumen por año" style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><BarChart3 size={20} /></button>
                      <button onClick={() => setEstablecimientoAbierto(abierto ? null : estab)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                        {abierto ? <ChevronUp size={20} style={{ color: T.teal }} /> : <ChevronDown size={20} style={{ color: T.teal }} />}
                      </button>
                    </div>
                  </div>
                  {abierto && (
                    <div style={{ marginTop: 10 }}>
                      {[...lista].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")).map((inf) => {
                        const t = totalesInforme(inf);
                        return (
                          <div key={inf.id} onClick={() => abrirReporte(inf)} style={{ background: T.card, border: `1.5px solid ${T.line}`, borderRadius: 14, padding: 16, marginBottom: 12, cursor: "pointer" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                              <div>
                                <div style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 18, color: T.ink }}>{inf.nombre || inf.establecimiento}</div>
                                <div style={{ fontSize: 14.5, color: T.inkSoft }}>{inf.numero ? `N° ${inf.numero} · ` : ""}{inf.establecimiento} · {inf.fecha} · {inf.metodo}{inf.cargadoPor && <span style={{ fontStyle: "italic" }}> · {inf.cargadoPor}</span>}</div>
                                {t.cantidad > 0 && <div style={{ fontSize: 15, color: T.gold, fontWeight: 700, marginTop: 4 }}>{pct(t.prenadas, t.cantidad)}% preñez · {t.cantidad} cabezas</div>}
                              </div>
                              <div style={{ display: "flex", gap: 10 }} onClick={(ev) => ev.stopPropagation()}>
                                <button onClick={() => exportarExcelGestacion(inf, cliente, iatfs)} style={{ background: "none", border: "none", color: T.gold, cursor: "pointer" }}><Download size={19} /></button>
                                <button onClick={() => abrirEditar(inf)} style={{ background: "none", border: "none", color: T.teal, cursor: "pointer" }}><Pencil size={19} /></button>
                                <button onClick={() => eliminar(inf.id)} style={{ background: "none", border: "none", color: T.rust, cursor: "pointer" }}><Trash2 size={20} /></button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
